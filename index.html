loose.",vitals:[{label:"HR",value:"84 /min"},{label:"BP",value:"112/70"},{label:"RR",value:"14 /min"},{label:"Temp",value:"36.6 °C"},{label:"SpO₂",value:"99%"},{label:"BMI",value:"19.2"}],historyBudget:7,history:[{id:"stool",label:"Stool character: volume, blood, grease, floating",result:"3–5 times a day, bulky, pale and smelly, hard to flush. No blood.",relevance:"key",note:"Bulky pale floating stools suggest fat malabsorption (steatorrhoea), not colitis."},{id:"weight",label:"Weight change and appetite",result:"Lost about 5 kg in 3 months, though I eat normally.",relevance:"key",note:"Weight loss with preserved appetite points to malabsorption."},{id:"nocturnal",label:"Nocturnal diarrhoea, urgency",result:"Sometimes wakes me at night.",relevance:"key",note:"Nocturnal symptoms suggest organic disease rather than IBS."},{id:"family",label:"Family history of coeliac, IBD, thyroid or type 1 diabetes",result:"My sister has type 1 diabetes; an aunt was told she is “gluten intolerant”.",relevance:"key",note:"Coeliac disease clusters in families and with other autoimmune disease."},{id:"travel",label:"Travel, water source, sick contacts",result:"No travel abroad. Drinks treated water. Nobody else unwell.",relevance:"useful",note:"Makes giardiasis and other infections less likely."},{id:"drugs",label:"Medications, antibiotics, laxatives",result:"Only an iron tablet the GP started last month; no antibiotics or laxatives.",relevance:"useful",note:"Drug causes (metformin, magnesium, PPIs, laxatives) must be excluded."},{id:"milk",label:"Relation to milk or particular foods",result:"Bread seems to make the bloating worse. Milk maybe a little.",relevance:"useful",note:"Secondary lactose intolerance is common in coeliac disease."},{id:"skin",label:"Rashes, mouth ulcers, joint pains",result:"Itchy blisters on my elbows on and off.",relevance:"useful",note:"Dermatitis herpetiformis is the skin manifestation of coeliac disease."},{id:"thyroid",label:"Heat intolerance, palpitations, tremor",result:"No.",relevance:"low",note:"Hyperthyroidism causes diarrhoea but this history does not suggest it."}],examBudget:4,exam:[{id:"general",label:"General inspection: pallor, angular stomatitis, glossitis",result:"Pale conjunctivae, angular stomatitis, smooth red tongue.",relevance:"key",note:"Signs of iron, folate or B vitamin deficiency."},{id:"skin",label:"Skin examination",result:"Grouped excoriated vesicles on extensor elbows.",relevance:"key",note:"Consistent with dermatitis herpetiformis."},{id:"abdo",label:"Abdominal examination",result:"Mildly distended, tympanic, non-tender. No masses or organomegaly.",relevance:"useful"},{id:"hydration",label:"Hydration status",result:"Moist mucous membranes, normal capillary refill.",relevance:"useful"},{id:"pr",label:"Rectal examination",result:"Pale stool, no blood, no masses.",relevance:"low",note:"Reasonable but low-yield given the history."},{id:"thyroidex",label:"Thyroid examination",result:"Normal.",relevance:"low"}],investigations:[{id:"fbc",label:"FBC, ferritin, folate, B12",result:"Microcytic anaemia with low iron and folate.",labs:[{name:"Haemoglobin",value:"101",unit:"g/L",ref:"120–150",flag:"L"},{name:"MCV",value:"78",unit:"fL",ref:"80–100",flag:"L"},{name:"Ferritin",value:"6",unit:"µg/L",ref:"15–200",flag:"L"},{name:"Folate",value:"2.1",unit:"µg/L",ref:"> 3.9",flag:"L"},{name:"B12",value:"310",unit:"ng/L",ref:"200–900",flag:"N"}],relevance:"key",note:"Iron and folate are absorbed proximally, exactly where coeliac damage is worst."},{id:"ttg",label:"Anti-tTG IgA with total IgA",result:"tTG IgA 186 U/mL (ref < 10). Total IgA normal.",relevance:"key",note:"First-line coeliac test. Total IgA is needed because IgA deficiency (more common in coeliac) gives a false-negative tTG IgA."},{id:"ogd",label:"Upper GI endoscopy with duodenal biopsies (≥ 4 D2 + 1–2 bulb)",result:"Scalloped duodenal folds. Histology: villous atrophy, crypt hyperplasia, raised intra-epithelial lymphocytes (Marsh 3b).",relevance:"key",note:"Confirms the diagnosis in adults. The patient must still be eating gluten."},{id:"calpro",label:"Faecal calprotectin",result:"64 µg/g (ref < 50): marginally raised.",relevance:"useful",note:"Helps triage toward IBD; a markedly raised value would point to colonoscopy."},{id:"giardia",label:"Stool Giardia antigen / O&P",result:"Negative.",relevance:"useful",note:"Reasonable exclusion of a common treatable cause of malabsorption."},{id:"ue",label:"U&E, albumin, calcium, vitamin D",result:"Albumin 33 g/L, adjusted calcium 2.12 mmol/L, vitamin D low.",relevance:"useful",note:"Documents malabsorption consequences (bone health)."},{id:"tft",label:"Thyroid function",result:"Normal.",relevance:"useful"},{id:"culture",label:"Stool culture",result:"No pathogens isolated.",relevance:"low",note:"Bacterial culture has very low yield in chronic diarrhoea without travel or immunosuppression."},{id:"colon",label:"Colonoscopy",result:"Normal colon and terminal ileum.",relevance:"low",note:"Not first-line here: the history points to the small bowel, and serology was strongly positive."},{id:"ct",label:"CT abdomen",result:"Mildly fluid-filled small bowel loops, otherwise unremarkable.",relevance:"low",note:"Adds radiation without answering the key question."}],differentials:[{id:"coeliac",name:"Coeliac disease",note:"Steatorrhoea, weight loss, iron/folate deficiency, dermatitis herpetiformis, family autoimmunity, high tTG, villous atrophy."},{id:"ibs",name:"Irritable bowel syndrome",note:"IBS does not cause weight loss, nocturnal diarrhoea, anaemia or steatorrhoea: these are red flags against it."},{id:"crohn",name:"Crohn’s disease",note:"Can cause malabsorption and weight loss, but expect raised CRP, higher calprotectin, pain and possibly blood; colonoscopy/ileum normal."},{id:"giardia",name:"Giardiasis",note:"Malabsorptive, but antigen negative and no exposure history."},{id:"lactose",name:"Primary lactose intolerance",note:"Causes osmotic diarrhoea and bloating but not weight loss, anaemia or steatorrhoea. Secondary lactose intolerance can follow coeliac damage."},{id:"cp",name:"Chronic pancreatitis",note:"Causes steatorrhoea, but without alcohol history, pain or anaemia from proximal malabsorption."}],diagnosis:"coeliac",reasoning:[{id:"r1",text:"Chronic malabsorptive diarrhoea with weight loss, iron and folate deficiency and dermatitis herpetiformis; a strongly positive tTG IgA with normal total IgA and villous atrophy on duodenal biopsy confirm coeliac disease.",correct:!0},{id:"r2",text:"She is young with bloating and diarrhoea, so this is IBS.",why:"Weight loss, nocturnal diarrhoea, anaemia and steatorrhoea are alarm features that exclude a confident IBS diagnosis."},{id:"r3",text:"Bread makes her bloated, so a gluten-free diet should be started before testing.",why:"Serology and biopsy become falsely negative on a gluten-free diet. Test first, while she is still eating gluten."},{id:"r4",text:"Any chronic diarrhoea needs colonoscopy first.",why:"The pattern (steatorrhoea, proximal nutrient deficiency) localises to the small bowel; serology and duodenal biopsy are the right first steps."}],debrief:{summary:"Ms M. has coeliac disease: an immune reaction to gluten (gliadin, deamidated by tissue transglutaminase) in genetically susceptible people (HLA-DQ2/DQ8) that flattens proximal small-bowel villi. Loss of absorptive surface explains the steatorrhoea, weight loss and iron/folate deficiency.",redFlags:["Blood in stool","Unintentional weight loss","Nocturnal diarrhoea","Anaemia or iron deficiency","Age over 50 with new change in bowel habit","Family history of colorectal cancer or IBD"],management:["Lifelong strict gluten-free diet with specialist dietitian support; coeliac society membership.","Correct iron, folate, calcium and vitamin D; assess bone density.","Repeat tTG at 6–12 months to check adherence and response.","Screen first-degree relatives; consider pneumococcal vaccination (hyposplenism)."],takeaway:"Chronic diarrhoea + weight loss + iron deficiency: check tTG IgA with total IgA, while the patient is still eating gluten."}},questions:[{id:"d1",kind:"match",level:1,concept:"Diarrhoea mechanisms",prompt:"Match each mechanism to a typical cause.",pairs:[{left:"Secretory",right:"Cholera toxin"},{left:"Osmotic",right:"Lactase deficiency"},{left:"Inflammatory",right:"Shigella dysentery"},{left:"Malabsorptive",right:"Coeliac disease"},{left:"Motility",right:"Hyperthyroidism"}],explain:{reasoning:"Toxins drive secretion; unabsorbed solutes pull water osmotically; invasive organisms and IBD cause inflammatory exudation; loss of surface or enzymes causes malabsorption; rapid transit reduces contact time.",takeaway:"Name the mechanism first; it predicts the stool, the fasting response and the tests."}},{id:"d2",kind:"hotspot",level:1,view:"gut",answer:"ileum",concept:"Intestinal absorption sites",prompt:"Tap the segment where vitamin B12 and bile acids are absorbed.",explain:{reasoning:"The terminal ileum absorbs the B12–intrinsic factor complex and reabsorbs about 95% of bile acids.",science:"Ileal disease or resection lets bile acids reach the colon, where they stimulate secretion (bile acid diarrhoea). Larger losses deplete the bile acid pool → fat malabsorption.",takeaway:"Terminal ileum: B12 and bile acids. Think Crohn’s, TB and resection."}},{id:"d3",kind:"classify",level:1,concept:"Acute vs chronic",prompt:"Sort these presentations by time course.",buckets:["Acute (< 14 days)","Chronic (> 4 weeks)"],items:[{text:"Travellers’ diarrhoea for 3 days",bucket:0},{text:"Norovirus outbreak on a ward",bucket:0},{text:"Coeliac disease",bucket:1},{text:"Microscopic colitis",bucket:1},{text:"Food poisoning 6 hours after a meal",bucket:0},{text:"Bile acid diarrhoea after ileal resection",bucket:1}],explain:{reasoning:"Acute diarrhoea is mostly infectious and self-limiting. Diarrhoea for more than 4 weeks is chronic and is investigated for structural, inflammatory, malabsorptive or functional causes. 14 days–4 weeks is “persistent”.",takeaway:"Acute = think infection and hydration. Chronic = think mechanism and investigate."}},{id:"d4",kind:"hotspot",level:1,view:"villus",answer:"cftr",concept:"Secretory mechanism",prompt:"Tap the channel that cholera toxin forces open.",explain:{reasoning:"Cholera toxin permanently activates adenylate cyclase. Rising cAMP opens CFTR chloride channels in crypt cells; Na⁺ and water follow Cl⁻ into the lumen.",chain:["Cholera toxin","Gs stuck “on”","↑ cAMP","CFTR opens","Cl⁻, Na⁺, water secreted"],takeaway:"Secretory diarrhoea continues during fasting and can kill through volume loss within hours."}},{id:"d5",kind:"mcq",level:2,concept:"Oral rehydration",twin:"d5b",prompt:"Why does oral rehydration solution work in cholera even though the gut is secreting fluid?",options:[{id:"a",text:"SGLT1 Na⁺–glucose co-transport is unaffected by the toxin, so glucose drags Na⁺ and water back into the enterocyte",correct:!0},{id:"b",text:"Glucose neutralises cholera toxin",why:"Glucose does not inactivate the toxin; the toxin keeps acting until the cells turn over."},{id:"c",text:"ORS closes the CFTR channel",why:"ORS does not affect CFTR. It works through a separate, intact absorptive pathway."}],explain:{reasoning:"Absorption via SGLT1 stays intact in secretory diarrhoea. Coupling glucose with sodium in the right ratio drives net absorption that can exceed toxin-driven secretion.",chain:["ORS: glucose + Na⁺","SGLT1 co-transport","Na⁺ absorbed","Water follows osmotically","Rehydration"],takeaway:"ORS is one of medicine’s great physiology-based treatments: it targets the pathway the toxin leaves alone."}},{id:"d5b",kind:"mcq",level:2,concept:"Oral rehydration",prompt:"Why is zinc given alongside ORS to children with acute diarrhoea in WHO guidance?",options:[{id:"a",text:"It reduces the duration and severity of the episode and the risk of recurrence in the following months",correct:!0},{id:"b",text:"It kills enteric bacteria",why:"Zinc is not an antibiotic; it supports mucosal repair and immune function."},{id:"c",text:"It replaces potassium losses",why:"Potassium is replaced by ORS itself, not zinc."}],explain:{reasoning:"Zinc supplementation for 10–14 days shortens diarrhoeal episodes and reduces recurrence, especially where zinc deficiency is common.",takeaway:"Children with diarrhoea: ORS + zinc + continue feeding."}},{id:"d6",kind:"order",level:2,concept:"Malabsorption",prompt:"Build the chain: why does coeliac disease cause iron-deficiency anaemia?",items:["Gluten peptides are deamidated by tissue transglutaminase","HLA-DQ2/DQ8 present them to T cells","Immune injury flattens proximal small-bowel villi","Duodenal absorptive surface is lost","Iron absorption falls","Iron-deficiency anaemia"],explain:{reasoning:"Iron is absorbed mainly in the duodenum, the region most damaged in coeliac disease.",chain:["Gluten","tTG deamidation","T-cell response","Villous atrophy (proximal)","↓ Iron absorption","Anaemia"],takeaway:"Unexplained iron deficiency → check coeliac serology."}},{id:"d7",kind:"mcq",level:2,concept:"Osmotic vs secretory",prompt:"A patient’s diarrhoea stops completely during a 48-hour fast. What does that suggest?",options:[{id:"a",text:"An osmotic cause, driven by something they are eating",correct:!0},{id:"b",text:"A secretory cause such as a VIPoma",why:"Secretory diarrhoea continues during fasting because it is driven by secretagogues, not food."},{id:"c",text:"Inflammatory bowel disease",why:"Inflammatory diarrhoea usually persists during fasting."}],explain:{reasoning:"Osmotic diarrhoea depends on an ingested, poorly absorbed solute. Remove the solute (fast) and water no longer follows it.",takeaway:"Stops with fasting = osmotic. Continues = secretory or inflammatory."}},{id:"d8",kind:"mcq",level:2,deep:!0,concept:"Dehydration physiology",prompt:"Why does severe secretory diarrhoea cause metabolic acidosis?",options:[{id:"a",text:"Bicarbonate-rich intestinal fluid is lost in the stool, and hypovolaemia adds lactic acidosis",correct:!0},{id:"b",text:"Stomach acid is lost",why:"Loss of gastric acid (vomiting) causes metabolic alkalosis, the opposite."},{id:"c",text:"The colon absorbs extra chloride",why:"Not the main mechanism; the dominant problem is bicarbonate loss."}],explain:{reasoning:"Intestinal and pancreatic secretions are alkaline. Losing them causes a normal anion gap (hyperchloraemic) acidosis; poor perfusion adds a raised anion gap lactic component.",takeaway:"Diarrhoea → acidosis and hypokalaemia. Vomiting → alkalosis and hypokalaemia."}},{id:"d9",kind:"mcq",level:3,concept:"Acute bloody diarrhoea",stem:"A 6-year-old has bloody diarrhoea for 4 days after a farm visit. Today he is pale and passing little urine.",labs:[{name:"Haemoglobin",value:"78",unit:"g/L",ref:"115–155",flag:"L"},{name:"Platelets",value:"42",unit:"×10⁹/L",ref:"150–400",flag:"L"},{name:"Creatinine",value:"180",unit:"µmol/L",ref:"30–60",flag:"H"},{name:"Blood film",value:"Schistocytes",flag:"!"}],prompt:"What is the most likely complication and the key management principle?",options:[{id:"a",text:"Haemolytic uraemic syndrome from Shiga toxin-producing E. coli: supportive care, avoid antibiotics and antimotility agents",correct:!0},{id:"b",text:"Severe dehydration: start ciprofloxacin and loperamide",why:"Antibiotics and antimotility drugs are avoided in suspected STEC because they may increase toxin release and HUS risk."},{id:"c",text:"Immune thrombocytopenia: give steroids",why:"ITP does not cause haemolysis with schistocytes and renal failure."}],explain:{reasoning:"Microangiopathic haemolytic anaemia + thrombocytopenia + acute kidney injury after bloody diarrhoea = HUS, usually from E. coli O157 (STEC). Shiga toxin damages renal endothelium.",chain:["STEC in gut","Shiga toxin absorbed","Endothelial injury (kidney)","Microthrombi","Haemolysis + low platelets + AKI"],takeaway:"Bloody diarrhoea in a child: think STEC, test for Shiga toxin, and watch for HUS."}},{id:"d10",kind:"mcq",level:3,concept:"Chronic diarrhoea work-up",stem:"A 64-year-old woman has 3 months of watery, non-bloody diarrhoea, 6 times a day including at night. She started lansoprazole and sertraline last year. Colonoscopy looks macroscopically normal.",prompt:"What is the most important next step during colonoscopy?",options:[{id:"a",text:"Take random biopsies from the right and left colon for microscopic colitis",correct:!0},{id:"b",text:"No biopsies: the colon looks normal",why:"Microscopic colitis is, by definition, invisible macroscopically. It is diagnosed only on histology."},{id:"c",text:"Biopsy only the rectum",why:"Microscopic colitis can be patchy; biopsies from both right and left colon are recommended."}],explain:{reasoning:"Older woman, watery nocturnal diarrhoea, and drugs linked to microscopic colitis (PPIs, SSRIs, NSAIDs) → collagenous or lymphocytic colitis. Treatment: stop culprit drugs; budesonide.",takeaway:"Normal-looking colon + chronic watery diarrhoea → biopsy anyway."}},{id:"d11",kind:"mcq",level:3,deep:!0,concept:"C. difficile",stem:"A 72-year-old inpatient on IV ceftriaxone has 8 watery stools a day. WCC 18 ×10⁹/L, creatinine has risen from 80 to 160 µmol/L. C. difficile toxin positive.",prompt:"Which statement is correct?",options:[{id:"a",text:"This is severe C. difficile infection: stop ceftriaxone if possible and give oral vancomycin or fidaxomicin",correct:!0},{id:"b",text:"IV metronidazole alone is first-line for severe disease",why:"Current guidelines prefer oral vancomycin or fidaxomicin. Metronidazole is no longer first-line for severe infection."},{id:"c",text:"Give loperamide to reduce stool frequency",why:"Antimotility agents risk toxic megacolon in C. difficile infection."}],explain:{reasoning:"WCC > 15 or creatinine > 1.5× baseline defines severe CDI. Treat with oral vancomycin or fidaxomicin, stop the inciting antibiotic, isolate, and watch for fulminant colitis (ileus, megacolon, shock).",takeaway:"Antibiotics + diarrhoea in hospital = test for C. difficile and isolate."}}],readiness:{understand:["About 9 L of fluid enters the gut daily and only 100–200 mL leaves in stool, so small absorption changes cause diarrhoea.","Secretory diarrhoea (e.g. cholera: cAMP → CFTR) continues during fasting and has a low stool osmotic gap; osmotic diarrhoea stops with fasting and has a high gap.","Inflammatory diarrhoea brings blood, mucus and fever; malabsorption brings bulky pale stools, weight loss and nutrient deficiencies.","Dehydration is assessed with WHO signs (condition, eyes, thirst, skin pinch) and treated by Plan A, B or C; ORS works through intact SGLT1.","Acute diarrhoea is usually infectious and self-limiting; chronic diarrhoea (> 4 weeks) needs a mechanism-based work-up (coeliac serology, calprotectin, stool tests, endoscopy)."],listenFor:["Which acute diarrhoea patients need stool tests or antibiotics, and which should never get them (STEC).","How your lecturer approaches chronic diarrhoea: the order of first-line tests and red flags.","Local pathogens and outbreak patterns (cholera, typhoid, amoebiasis) and public-health measures."],questions:["Why might a patient with coeliac disease develop lactose intolerance, and why would it improve on a gluten-free diet?","How could you tell, at the bedside, whether a patient’s diarrhoea is coming from the small bowel or the colon?"],connection:"A child with watery diarrhoea and sunken eyes on a busy paediatric ward needs a fast WHO assessment and ORS; an adult with weight loss and iron deficiency in clinic needs coeliac serology. Same symptom, different reasoning."},recap:[{q:"Cholera toxin acts through?",a:"↑ cAMP → CFTR Cl⁻ secretion; water follows."},{q:"Diarrhoea that stops with fasting?",a:"Osmotic."},{q:"Stool osmotic gap formula?",a:"290 − 2(Na⁺ + K⁺); > 100 osmotic, < 50 secretory."},{q:"Why does ORS work?",a:"SGLT1 Na⁺–glucose co-transport stays intact."},{q:"WHO severe dehydration signs?",a:"Two of: lethargic/unconscious, sunken eyes, drinks poorly/unable, skin pinch very slow."},{q:"First coeliac test?",a:"tTG IgA + total IgA, on a gluten-containing diet."},{q:"Where is B12 absorbed?",a:"Terminal ileum."},{q:"Bloody diarrhoea + anaemia + low platelets + AKI?",a:"Haemolytic uraemic syndrome (STEC)."}],references:[{label:"WHO. The treatment of diarrhoea: a manual for physicians and other senior health workers. 4th rev. 2005.",note:"Dehydration assessment, Plans A–C, ORS, zinc"},{label:"Shane AL et al. 2017 IDSA Clinical Practice Guidelines for the Diagnosis and Management of Infectious Diarrhea. Clin Infect Dis 2017."},{label:"Riddle MS et al. ACG Clinical Guideline: Diagnosis, Treatment, and Prevention of Acute Diarrheal Infections in Adults. Am J Gastroenterol 2016."},{label:"Arasaradnam RP et al. Guidelines for the investigation of chronic diarrhoea in adults: BSG, 3rd ed. Gut 2018."},{label:"Rubio-Tapia A et al. ACG Clinical Guidelines: Diagnosis and Management of Celiac Disease. Am J Gastroenterol 2023."},{label:"Johnson S et al. IDSA/SHEA 2021 Focused Update: Management of Clostridioides difficile Infection in Adults. Clin Infect Dis 2021."},{label:"Guyton and Hall Textbook of Medical Physiology",note:"intestinal absorption and secretion (reference priority)"}],modelNote:"The fluid simulator and stool electrolyte values are illustrative. The WHO assessment logic follows the published WHO chart."},mm={id:"gross",name:"Pancreas in situ",viewBox:"0 0 420 400",diseaseLabel:"Acute gallstone pancreatitis",caption:"Anterior view with the stomach removed. The pancreatic head sits in the duodenal C-loop; the CBD runs through the head to join the main pancreatic duct at the ampulla. Disease: a migrating gallstone obstructs the ampulla; the gland swells with peripancreatic fluid.",structures:[{id:"head",name:"Head & uncinate process",fn:"Lies within the duodenal C-loop, with the CBD running through it. The uncinate process hooks behind the superior mesenteric vessels.",disease:"Pancreatic h ,Component:gm},{id:"function",name:"Acute → chronic",blurb:"Accumulate injury and watch exocrine and endocrine reserve fall.",Component:ym},{id:"timeline",name:"Severity & complications",blurb:"Scrub through the first six weeks of an attack: what to assess and what complications appear when.",Component:xm}],patient:{title:"Severe epigastric pain",name:"Mrs Grace T.",age:55,sex:"F",context:"Brought to the emergency department at 03:00 by her husband.",complaint:"Terrible pain in the upper stomach going through to my back since about 10 last night. I keep vomiting.",vitals:[{label:"HR",value:"112 /min",flag:!0},{label:"BP",value:"118/72"},{label:"RR",value:"22 /min",flag:!0},{label:"Temp",value:"37.9 °C",flag:!0},{label:"SpO₂",value:"95%"},{label:"Pain",value:"9/10",flag:!0}],historyBudget:7,history:[{id:"pain",label:"Onset, site, radiation, relieving factors",result:"Started an hour after a fried dinner, built up over 30 minutes, constant, goes straight through to the back. Sitting forward helps a little.",relevance:"key",note:"Constant epigastric pain radiating to the back, eased by leaning forward, is typical of pancreatic pain."},{id:"alcohol",label:"Alcohol intake",result:"I do not drink alcohol.",relevance:"key",note:"Excludes the second commonest cause."},{id:"prev",label:"Previous similar pains, gallstones",result:"Short attacks of right-sided upper pain after fatty food over the past year. I was told I might have gallstones but never had a scan.",relevance:"key",note:"Prior biliary colic supports gallstone aetiology."},{id:"drugs",label:"Medications",result:"Amlodipine only. No new drugs.",relevance:"useful",note:"Some drugs (e.g. azathioprine, valproate, thiazides) cause pancreatitis."},{id:"vomit",label:"Vomiting: content, blood",result:"Vomited bile four times, no blood.",relevance:"useful",note:"Bloody or coffee-ground vomit would raise peptic ulcer bleeding."},{id:"jaund",label:"Dark urine, pale stools, jaundice, rigors",result:"Urine is a bit darker; no rigors.",relevance:"useful",note:"Fever, jaundice and RUQ pain together would suggest cholangitis, an indication for urgent ERCP."},{id:"chest",label:"Chest pain, exertional symptoms",result:"No chest pain or breathlessness on exertion.",relevance:"useful",note:"Myocardial infarction can present with epigastric pain."},{id:"bowels",label:"Bowel habit",result:"Normal yesterday.",relevance:"low"}],examBudget:4,exam:[{id:"abdo",label:"Abdominal examination",result:"Epigastric tenderness with voluntary guarding; reduced bowel sounds. No rigidity. No pulsatile mass.",relevance:"key",note:"Rigidity would suggest perforation; a pulsatile mass would suggest AAA."},{id:"flanks",label:"Inspect flanks and umbilicus",result:"No discolouration.",relevance:"useful",note:"Grey Turner’s (flank) and Cullen’s (periumbilical) signs indicate retroperitoneal haemorrhage in severe necrotising pancreatitis, but are late and uncommon."},{id:"sclera",label:"Sclerae",result:"Mild scleral icterus.",relevance:"useful"},{id:"fluid",label:"Volume status: mucosa, capillary refill, JVP",result:"Dry mucosa, capillary refill 3 s, JVP not visible.",relevance:"key",note:"Third-space losses and vomiting make hypovolaemia common; it drives fluid therapy."},{id:"chestex",label:"Chest examination",result:"Reduced air entry at the left base.",relevance:"useful",note:"Left pleural effusion is common in acute pancreatitis."},{id:"murphy",label:"Murphy’s sign",result:"Equivocal because of generalised upper abdominal tenderness.",relevance:"low"}],investigations:[{id:"lipase",label:"Serum lipase",result:"Markedly raised.",labs:[{name:"Lipase",value:"2840",unit:"U/L",ref:"< 60",flag:"H"}],relevance:"key",note:"Lipase > 3× ULN with typical pain makes the diagnosis."},{id:"lft",label:"Liver tests",result:"Early transaminase rise.",labs:[{name:"ALT",value:"310",unit:"U/L",ref:"< 40",flag:"H"},{name:"ALP",value:"190",unit:"U/L",ref:"30–130",flag:"H"},{name:"Bilirubin",value:"38",unit:"µmol/L",ref:"< 21",flag:"H"}],relevance:"key",note:"ALT > about 150 U/L early in the attack strongly suggests a gallstone cause."},{id:"us",label:"Abdominal ultrasound",result:"Multiple small gallstones in the gallbladder. CBD 7 mm. Pancreas partly obscured by bowel gas.",relevance:"key",note:"Every patient with acute pancreatitis needs an ultrasound to look for gallstones."},{id:"bloods",label:"FBC, U&E, CRP, glucose, calcium",result:"WCC 15.2, urea 9.8 mmol/L, creatinine 96 µmol/L, glucose 9.1 mmol/L, adjusted Ca 2.18 mmol/L.",relevance:"key",note:"Urea and haematocrit help predict severity; calcium is a cause (if high) and a marker of severity (if low)."},{id:"tg",label:"Triglycerides",result:"2.1 mmol/L.",relevance:"useful",note:"Needed if no gallstones or alcohol; > 11 mmol/L can cause pancreatitis."},{id:"ecg",label:"ECG and troponin",result:"Sinus tachycardia; troponin normal.",relevance:"useful",note:"Excludes inferior myocardial infarction as a mimic."},{id:"abg",label:"Arterial blood gas",result:"pH 7.36, PaO₂ 10.1 kPa on air, lactate 2.4.",relevance:"useful",note:"Screens for respiratory failure (organ failure scoring)."},{id:"ct",label:"Contrast CT abdomen now",result:"Report: swollen pancreas with peripancreatic stranding; necrosis cannot be assessed this early.",relevance:"low",note:"Not needed when the diagnosis is clear. CT within 72 h underestimates necrosis and adds contrast to a dehydrated patient. Reserve for diagnostic doubt or failure to improve after 48–72 h."},{id:"amylase",label:"Serum amylase as well",result:"1650 U/L.",relevance:"low",note:"Adds little once lipase is available."},{id:"ercp",label:"Urgent ERCP",result:"Gastroenterology advise against: no cholangitis.",relevance:"harmful",note:"Urgent ERCP is indicated for cholangitis (or persistent biliary obstruction), not for all gallstone pancreatitis. ERCP itself can cause pancreatitis."}],differentials:[{id:"agp",name:"Acute gallstone pancreatitis",note:"Typical pain, lipase 47× ULN, gallstones on ultrasound, early ALT rise, no alcohol."},{id:"perf",name:"Perforated peptic ulcer",note:"Sudden onset with rigidity and free air; lipase can rise but rarely to this degree."},{id:"chole",name:"Acute cholecystitis",note:"RUQ pain with positive Murphy’s sign and gallbladder wall thickening; lipase normal or mildly raised."},{id:"cholang",name:"Ascending cholangitis",note:"Fever, jaundice, RUQ pain and rigors (Charcot’s triad) with a dilated duct. Monitor for it: mild icterus is present."},{id:"mi",name:"Inferior myocardial infarction",note:"ECG and troponin normal."},{id:"aaa",name:"Ruptured abdominal aortic aneurysm",note:"Back pain and shock; pulsatile mass. Not present."}],diagnosis:"agp",reasoning:[{id:"r1",text:"Two of three diagnostic criteria are met (typical pain and lipase > 3× ULN); ultrasound gallstones, an early ALT rise and no alcohol make gallstones the cause.",correct:!0},{id:"r2",text:"A CT scan is required to diagnose acute pancreatitis.",why:"Imaging is only one of the three criteria. With typical pain and lipase > 3× ULN, CT on admission adds nothing and underestimates necrosis."},{id:"r3",text:"The lipase of 2840 means this will be a severe attack.",why:"The height of lipase or amylase does not predict severity. Severity depends on organ failure and local complications."},{id:"r4",text:"Gallstones mean urgent ERCP is required tonight.",why:"Urgent ERCP is reserved for cholangitis or persistent biliary obstruction. Most gallstones pass spontaneously."}],debrief:{summary:"Mrs T. has acute gallstone pancreatitis. A small stone passing down the CBD temporarily obstructed the ampulla, triggering intra-acinar enzyme activation. Tachycardia and borderline oxygenation mean she needs close monitoring for organ failure over the next 48 hours.",redFlags:["Persistent organ failure > 48 h (severe)","SIRS on admission or persisting","Rising urea or haematocrit despite fluids","Fever, jaundice and rising bilirubin (cholangitis → ERCP)","Deterioration after the first week (infected necrosis)"],management:["Moderate, goal-directed IV fluids with Ringer’s lactate, guided by heart rate, urine output and urea; avoid aggressive fluid loading.","Adequate analgesia; early oral feeding as tolerated (no “nil by mouth” routine); enteral rather than parenteral nutrition if needed.","No prophylactic antibiotics; treat proven infection.","Cholecystectomy during the same admission for mild gallstone pancreatitis to prevent recurrence."],takeaway:"Diagnose with 2 of 3, find the cause with ultrasound and LFTs, judge severity by organ failure, and do not scan or scope by reflex."}},questions:[{id:"p1",kind:"hotspot",level:1,view:"gross",answer:"amp",concept:"Pancreatic anatomy",prompt:"Tap where a migrating gallstone most often obstructs to cause pancreatitis.",explain:{reasoning:"The CBD and main pancreatic duct share a common channel at the ampulla of Vater. A stone lodging there obstructs pancreatic outflow.",takeaway:"Gallstones cause pancreatitis at the ampulla, not in the gallbladder."}},{id:"p2",kind:"match",level:1,concept:"Exocrine and endocrine function",prompt:"Match the pancreatic product to its role.",pairs:[{left:"Trypsinogen",right:"Protease precursor activated in the duodenum"},{left:"Lipase",right:"Digests triglycerides"},{left:"Bicarbonate",right:"Neutralises gastric acid"},{left:"Insulin",right:"Lowers blood glucose"},{left:"SPINK1",right:"Inhibits prematurely activated trypsin"}],explain:{reasoning:"The exocrine pancreas makes digestive enzymes and bicarbonate; the endocrine islets make hormones. SPINK1 is one of the safeguards against premature activation.",takeaway:"The pancreas stores its most dangerous enzymes inactive."}},{id:"p3",kind:"classify",level:1,concept:"Causes of pancreatitis",prompt:"Sort these causes of acute pancreatitis by how common they are.",buckets:["Common","Less common but must check"],items:[{text:"Gallstones",bucket:0},{text:"Alcohol",bucket:0},{text:"Hypertriglyceridaemia",bucket:1},{text:"Hypercalcaemia",bucket:1},{text:"Post-ERCP",bucket:1},{text:"Drugs (e.g. azathioprine)",bucket:1}],explain:{reasoning:"Gallstones and alcohol cause most cases. Without either, check triglycerides and calcium, review drugs, and consider tumours, genetics and autoimmune pancreatitis.",takeaway:"Gallstones, alcohol, then triglycerides and calcium."}},{id:"p4",kind:"mcq",level:1,concept:"Diagnosis of acute pancreatitis",prompt:"Which combination makes the diagnosis of acute pancreatitis?",options:[{id:"a",text:"Any two of: typical pain, lipase/amylase > 3× upper limit, characteristic imaging",correct:!0},{id:"b",text:"Raised lipase alone",why:"Lipase can rise in renal failure, bowel ischaemia and other conditions. It needs typical pain or imaging alongside."},{id:"c",text:"CT findings are always required",why:"Imaging is needed only when pain and enzymes do not both fit."}],explain:{reasoning:"The revised Atlanta criteria require two of the three features.",takeaway:"Two of three: pain, enzymes > 3× ULN, imaging."}},{id:"p5",kind:"mcq",level:2,concept:"Steatorrhoea mechanism",twin:"p5b",prompt:"Why does a patient with chronic pancreatitis develop steatorrhoea?",options:[{id:"a",text:"Progressive loss of acinar tissue reduces lipase delivery to the duodenum, so dietary fat is not digested",correct:!0},{id:"b",text:"Increased bile production",why:"Bile production is not increased in chronic pancreatitis. Bile emulsifies fat, but without enough pancreatic lipase the emulsified triglyceride still cannot be broken down for absorption."},{id:"c",text:"Damage to the small-bowel villi",why:"Villous damage causes malabsorption in coeliac disease, but the small bowel is normal in chronic pancreatitis. The problem is maldigestion, not malabsorption."},{id:"d",text:"Rapid gastric emptying",why:"Gastric emptying is not the mechanism; the key deficit is enzyme delivery."}],explain:{reasoning:"Fibrosis destroys acinar cells and strictures block the duct. Once lipase output falls below about 10% of normal, triglycerides pass undigested into the colon.",science:"Lipase is the enzyme with the least back-up: gastric lipase compensates only partly, whereas protein and starch digestion have more redundancy. That is why fat maldigestion appears first.",chain:["Chronic inflammation","Acinar loss + duct obstruction","↓ Lipase delivery","Undigested fat","Steatorrhoea"],takeaway:"Steatorrhoea in chronic pancreatitis = maldigestion. Treat with enzyme replacement taken with meals."}},{id:"p5b",kind:"mcq",level:2,concept:"Steatorrhoea mechanism",prompt:"Which vitamin deficiency would you expect in untreated pancreatic exocrine insufficiency?",options:[{id:"a",text:"Vitamin D (and other fat-soluble vitamins A, E, K)",correct:!0},{id:"b",text:"Vitamin C",why:"Vitamin C is water-soluble and does not depend on fat digestion."},{id:"c",text:"Thiamine only",why:"Thiamine deficiency occurs with alcohol misuse but is not caused by exocrine insufficiency itself."}],explain:{reasoning:"Fat-soluble vitamins need micelle formation from digested fat. Undigested fat carries them out in the stool.",takeaway:"Fat maldigestion → A, D, E, K deficiency → check bone health."}},{id:"p6",kind:"order",level:2,concept:"Acute pathogenesis",prompt:"Order the cascade of acute pancreatitis.",items:["Gallstone obstructs the ampulla","Trypsinogen is activated inside acinar cells","Activated enzymes digest pancreatic tissue","Inflammatory cytokines are released","Systemic inflammatory response and capillary leak","Organ failure"],explain:{reasoning:"Local enzyme activation causes local injury; cytokine spill-over produces systemic effects. Severity depends on how far this goes.",takeaway:"It starts as an enzyme problem and becomes a systemic inflammatory problem."}},{id:"p7",kind:"mcq",level:2,concept:"Hypocalcaemia",prompt:"Why can acute pancreatitis cause hypocalcaemia?",options:[{id:"a",text:"Lipase releases fatty acids that bind calcium in areas of fat necrosis (saponification)",correct:!0},{id:"b",text:"The pancreas makes parathyroid hormone",why:"PTH comes from the parathyroid glands."},{id:"c",text:"Vomiting causes calcium loss",why:"Vomiting causes hydrogen, chloride and potassium loss, not significant calcium loss."}],explain:{reasoning:"Fat necrosis creates calcium soaps. Low albumin also lowers total calcium. Low calcium is a marker of severity.",takeaway:"Low calcium in pancreatitis = fat necrosis = a sicker patient."}},{id:"p8",kind:"mcq",level:2,deep:!0,concept:"Pain localisation",prompt:"Why does pancreatic pain radiate to the back?",options:[{id:"a",text:"The pancreas is retroperitoneal and inflammation irritates posterior structures and coeliac plexus afferents",correct:!0},{id:"b",text:"Referred pain via the phrenic nerve",why:"Phrenic irritation refers to the shoulder tip."},{id:"c",text:"Spinal metastases are common",why:"Not relevant to acute pancreatitis."}],explain:{reasoning:"The gland lies on the posterior abdominal wall in front of the coeliac axis. Leaning forward moves inflamed tissue away from the posterior wall, giving partial relief.",takeaway:"Epigastric pain boring through to the back + leaning forward = think pancreas."}},{id:"p9",kind:"mcq",level:3,concept:"Complications",stem:"Five weeks after severe necrotising pancreatitis, a man has early satiety and a palpable epigastric mass. He is afebrile. CT: a 9 cm well-defined collection containing solid debris behind the stomach.",prompt:"What is this collection?",options:[{id:"a",text:"Walled-off necrosis",correct:!0},{id:"b",text:"Pseudocyst",why:"A pseudocyst is an encapsulated collection of fluid only, after interstitial pancreatitis. Solid debris after necrotising pancreatitis indicates walled-off necrosis."},{id:"c",text:"Acute peripancreatic fluid collection",why:"“Acute” collections occur in the first 4 weeks and are not encapsulated."}],explain:{reasoning:"After 4 weeks, collections develop a wall. Fluid only = pseudocyst; necrotic solid content = walled-off necrosis. Intervention (usually endoscopic drainage) is for symptoms or infection.",takeaway:"Under 4 weeks: acute collection. Over 4 weeks: pseudocyst (fluid) or walled-off necrosis (solid)."}},{id:"p10",kind:"mcq",level:3,concept:"Fluid management",stem:"A 40-year-old with acute alcohol-related pancreatitis has HR 118, BP 110/70, urine output 20 mL/h. No organ failure yet.",prompt:"Which fluid strategy is most appropriate?",options:[{id:"a",text:"Moderate, goal-directed Ringer’s lactate with frequent reassessment of heart rate, urine output and urea",correct:!0},{id:"b",text:"Aggressive fixed infusion of 20 mL/kg bolus then 3 mL/kg/h regardless of response",why:"The WATERFALL trial (2022) found aggressive fluid resuscitation increased fluid overload without improving outcomes."},{id:"c",text:"Restrict fluids to avoid pulmonary oedema",why:"Under-resuscitation worsens pancreatic hypoperfusion and AKI. The aim is adequate, monitored fluid."}],explain:{reasoning:"Capillary leak and vomiting cause hypovolaemia. Fluids should restore perfusion while avoiding overload, using clinical end points.",takeaway:"Fluids in pancreatitis: enough, guided by end points, not maximal."}},{id:"p11",kind:"classify",level:3,concept:"Complications",prompt:"Sort these complications into local and systemic.",buckets:["Local","Systemic"],items:[{text:"Acute necrotic collection",bucket:0},{text:"Splenic vein thrombosis",bucket:0},{text:"ARDS",bucket:1},{text:"Acute kidney injury",bucket:1},{text:"Pseudoaneurysm bleeding",bucket:0},{text:"Hypocalcaemia",bucket:1},{text:"Infected necrosis",bucket:0}],explain:{reasoning:"Local complications arise in and around the pancreas (collections, vascular complications). Systemic complications reflect the inflammatory response and organ failure.",takeaway:"Severity = organ failure (systemic) + local complications."}},{id:"p12",kind:"mcq",level:3,deep:!0,concept:"Chronic pancreatitis diagnosis",stem:"A 48-year-old with 20 years of heavy drinking has recurrent epigastric pain, 8 kg weight loss, and oily stools. HbA1c 62 mmol/mol (new).",prompt:"Which test best demonstrates exocrine insufficiency?",options:[{id:"a",text:"Faecal elastase-1",correct:!0},{id:"b",text:"Serum lipase",why:"Serum lipase is often normal or low in chronic pancreatitis because the gland is burnt out."},{id:"c",text:"Serum amylase",why:"As with lipase, amylase is not useful for diagnosing chronic disease."}],explain:{reasoning:"Faecal elastase is stable through the gut and reflects pancreatic secretion; < 200 µg/g suggests insufficiency (< 100 severe). CT or MRI shows calcification and duct changes.",takeaway:"Acute: serum lipase. Chronic: faecal elastase + imaging."}}],readiness:{understand:["The pancreas makes proteases as inactive zymogens; trypsin is normally activated only in the duodenum by enteropeptidase.","Acute pancreatitis starts with premature trypsin activation inside acinar cells (gallstones at the ampulla, alcohol), leading to autodigestion, inflammation and possibly SIRS and organ failure.","Diagnosis needs 2 of 3: typical pain, lipase > 3× ULN, imaging. Severity is judged by organ failure (revised Atlanta), not enzyme level.","Chronic pancreatitis is repeated injury → stellate-cell fibrosis → loss of acini (steatorrhoea once lipase < ~10%) and islets (type 3c diabetes).","Management principles: moderate goal-directed fluids, analgesia, early feeding, no prophylactic antibiotics, cholecystectomy for gallstone cases."],listenFor:["Severity scoring your hospital uses (modified Marshall, BISAP, Glasgow–Imrie) and when to call critical care.","Indications for ERCP and timing of cholecystectomy in gallstone pancreatitis.","How chronic pancreatitis pain is managed, and when endoscopic or surgical drainage is considered."],questions:["Why does serum lipase rise in acute pancreatitis but is often normal in advanced chronic pancreatitis?","Why are patients with type 3c diabetes more prone to hypoglycaemia than people with type 2 diabetes?"],connection:"An ove n is physics. Air, fluid and solid tissue change how sound travels and how the chest moves. Learn the pattern and the signs predict the pathology.",submodules:["Symptoms: breathlessness, cough, sputum, haemoptysis, chest pain","Inspection & respiratory rate","Accessory muscles","Palpation","Percussion","Breath sounds","Wheeze, crackles, stridor","Signs → disease"],anatomy:[bm,wm],simulations:[{id:"room",name:"Bedside examination room",blurb:"Six patients. Inspect, count the respiratory rate, palpate, percuss and listen (with synthesised sounds), then name the diagnosis.",Component:Cm},{id:"predict",name:"Predict the signs",blurb:"Given the pathology, predict each sign. If you can do this, you can work backwards at the bedside.",Component:Nm},{id:"sounds",name:"Sound library",blurb:"Compare the categories of added and abnormal breath sounds side by side.",Component:Sm}],patient:{title:"Progressive breathlessness",name:"Mr Yaw B.",age:68,sex:"M",context:"Admitted from clinic. Retired mechanic, ex-smoker (40 pack-years, stopped 5 years ago).",complaint:"I get out of breath walking to the bathroom now. A month ago I could walk to the market.",vitals:[{label:"HR",value:"98 /min"},{label:"BP",value:"134/82"},{label:"RR",value:"24 /min",flag:!0},{label:"Temp",value:"37.1 °C"},{label:"SpO₂",value:"92% air",flag:!0},{label:"Weight",value:"−6 kg / 2 mo",flag:!0}],historyBudget:7,history:[{id:"onset",label:"Onset and progression of breathlessness",result:"Gradual over about 4–6 weeks, getting steadily worse. Worse lying on the right side.",relevance:"key",note:"Subacute progression fits an enlarging effusion, tumour or heart failure, not an acute event."},{id:"cough",label:"Cough, sputum, haemoptysis",result:"Dry cough. Twice I saw streaks of blood in my spit.",relevance:"key",note:"Haemoptysis in an ex-smoker is a red flag for lung cancer."},{id:"pain",label:"Chest pain: character and site",result:"Dull ache in the right side of the chest, not sharp.",relevance:"useful",note:"Dull, constant pain suggests pleural or chest-wall involvement by tumour; pleuritic pain suggests inflammation."},{id:"wt",label:"Weight loss, appetite, night sweats, fever",result:"Lost 6 kg without trying, poor appetite. No fevers; some night sweats.",relevance:"key",note:"Constitutional symptoms: malignancy or TB."},{id:"orth",label:"Orthopnoea, PND, ankle swelling",result:"No. I sleep on two pillows as always; ankles fine.",relevance:"key",note:"Argues against cardiac failure (which usually causes bilateral effusions)."},{id:"asbestos",label:"Occupational exposures (asbestos, dusts)",result:"Worked on brake linings and in a shipyard in my twenties.",relevance:"key",note:"Asbestos exposure raises mesothelioma and lung cancer risk, decades later."},{id:"tb",label:"TB contacts, previous TB, HIV risk",result:"No known TB contacts; never had TB.",relevance:"useful",note:"TB is a leading cause of exudative effusion in high-prevalence settings."},{id:"meds",label:"Medications",result:"Amlodipine.",relevance:"low"}],examBudget:5,exam:[{id:"insp",label:"Inspection: hands, cyanosis, accessory muscles",result:"Finger clubbing. No cyanosis. Mild use of accessory muscles. Right hemithorax moves less.",relevance:"key",note:"Clubbing in an ex-smoker raises lung cancer (or mesothelioma)."},{id:"trachea",label:"Trachea and apex beat",result:"Trachea deviated to the LEFT. Apex beat displaced to the left.",relevance:"key",note:"Mediastinal shift away: a large effusion (or tension pneumothorax), not collapse."},{id:"exp",label:"Chest expansion",result:"Reduced on the right.",relevance:"useful"},{id:"perc",label:"Percussion",result:"Stony dull from the right mid-zone downward, front and back.",relevance:"key",note:"Stony dullness is the hallmark of pleural fluid."},{id:"ausc",label:"Auscultation and vocal resonance",result:"Absent breath sounds right lower and mid zones; a band of bronchial breathing just above the dull area. Reduced vocal resonance over the dullness.",relevance:"key",note:"Compressed lung above an effusion can produce bronchial breathing."},{id:"nodes",label:"Lymph nodes (cervical, supraclavicular)",result:"Hard 1.5 cm right supraclavicular node.",relevance:"useful",note:"A target for biopsy if malignancy is suspected."},{id:"jvp",label:"JVP and peripheral oedema",result:"JVP not raised; no oedema.",relevance:"useful"}],investigations:[{id:"cxr",label:"Chest X-ray (PA)",result:"Large right pleural effusion with a meniscus, occupying two-thirds of the hemithorax; mediastinum shifted to the left.",relevance:"key",note:"Confirms the effusion and its size; mediastinal shift away shows it is space-occupying."},{id:"us",label:"Thoracic ultrasound",result:"Large echogenic effusion with septations; pleural nodularity.",relevance:"key",note:"Guides safe aspiration and suggests malignancy (nodularity) or complexity."},{id:"tap",label:"Diagnostic pleural aspiration (fluid + serum)",result:"Blood-stained fluid. Light’s criteria met: exudate.",labs:[{name:"Pleural protein",value:"46",unit:"g/L"},{name:"Serum protein",value:"68",unit:"g/L"},{name:"Protein ratio",value:"0.68",ref:"> 0.5 = exudate",flag:"!"},{name:"Pleural LDH",value:"620",unit:"U/L"},{name:"Serum LDH",value:"250",unit:"U/L",ref:"ULN 250"},{name:"LDH ratio",value:"2.5",ref:"> 0.6 = exudate",flag:"!"},{name:"Pleural pH",value:"7.36",ref:"< 7.2 suggests infection/drain",flag:"N"},{name:"Cytology",value:"Pending",flag:"N"}],relevance:"key",note:"Light’s criteria separate exudates (local disease: malignancy, infection, TB) from transudates (systemic: heart, liver, kidney failure)."},{id:"bloods",label:"FBC, U&E, LFT, CRP, albumin",result:"Hb 118, WCC 9.1, CRP 34, albumin 31 g/L, renal and liver function normal.",relevance:"useful",note:"Serum values are needed for Light’s criteria; normal renal/liver function argues against a transudate."},{id:"ct",label:"Contrast CT chest (after drainage)",result:"Right hilar mass with nodular pleural thickening; mediastinal lymphadenopathy.",relevance:"useful",note:"Best done after draining the fluid, so the underlying lung and pleura can be seen."},{id:"bnp",label:"NT-proBNP",result:"210 ng/L (low).",relevance:"useful",note:"Makes heart failure unlikely."},{id:"ddimer",label:"D-dimer",result:"Raised at 1.4 mg/L.",relevance:"low",note:"Non-specific: raised by cancer and effusions. The clinical picture did not point to PE."},{id:"abg",label:"Arterial blood gas",result:"pH 7.44, PaO₂ 8.9 kPa, PaCO₂ 4.6 kPa on air.",relevance:"low",note:"Not required with SpO₂ 92% and no hypercapnia risk features."},{id:"drain",label:"Immediate large-bore chest drain to dryness",result:"Senior review requested: hold until ultrasound and diagnostic sample done.",relevance:"harmful",note:"Draining > 1.5 L at once risks re-expansion pulmonary oedema. Diagnostic sampling and controlled therapeutic aspiration come first."}],differentials:[{id:"mal",name:"Malignant pleural effusion",note:"Exudate, blood-stained, weight loss, haemoptysis, clubbing, smoker, nodularity on ultrasound, hilar mass on CT. Cytology/pleural biopsy confirm."},{id:"meso",name:"Mesothelioma",note:"Plausible given asbestos exposure; pleural biopsy needed to distinguish from lung cancer metastatic to the pleura."},{id:"para",name:"Parapneumonic effusion / empyema",note:"Would expect fever, raised inflammatory markers, low pleural pH or glucose, purulent fluid."},{id:"tbeff",name:"Tuberculous pleural effusion",note:"Lymphocytic exudate, often in younger patients; ADA raised. Remains on the list in endemic areas."},{id:"hf",name:"Heart failure (transudate)",note:"Usually bilateral, with orthopnoea, oedema, raised JVP and high BNP. Light’s criteria show a transudate."},{id:"collapse",name:"Right lower lobe collapse",note:"Trachea would move TOWARD the affected side. Here it moved away."}],diagnosis:"mal",reasoning:[{id:"r1",text:"Stony dullness, absent breath sounds and reduced vocal resonance with the trachea pushed away indicate a large effusion; an exudate by Light’s criteria with weight loss, haemoptysis, clubbing and a hilar mass points to malignancy.",correct:!0},{id:"r2",text:"Dull percussion means consolidation, so this is pneumonia.",why:"Consolidation gives dull (not stony dull) percussion, bronchial breathing and INCREASED vocal resonance, with a central trachea."},{id:"r3",text:"Any effusion in an older man is heart failure until proven otherwise.",why:"Heart failure effusions are usually bilateral transudates with signs of fluid overload. This is a unilateral exudate."},{id:"r4",text:"The trachea is deviated, so this must be a lobar collapse.",why:"Collapse pulls the trachea toward the affected side. Movement away implies a space-occupying process."}],debrief:{summary:"Mr B. has a large right exudative pleural effusion, most likely malignant (primary lung cancer or mesothelioma given asbestos exposure). The examination localised it before any imaging: stony dull, silent, with mediastinal shift away.",redFlags:["Haemoptysis in a smoker or ex-smoker","Unintentional weight loss","Clubbing","Hypoxia, rising RR, or tracheal deviation with haemodynamic compromise","Stridor (upper airway obstruction)"],management:["Ultrasound-guided diagnostic aspiration: protein, LDH, pH, glucose, cytology, microbiology (± ADA in TB-endemic areas).","Therapeutic aspiration for symptoms, removing no more than about 1.5 L at a time.","CT chest after drainage; tissue diagnosis (pleural biopsy, node biopsy); MDT discussion.","For recurrent malignant effusion: indwelling pleural catheter or pleurodesis."],takeaway:"Trachea + percussion + breath sounds + vocal resonance localise the problem. Light’s criteria then split local (exudate) from systemic (transudate) causes."}},questions:[{id:"r1",kind:"hotspot",level:1,view:"surface",answer:"angle",concept:"Surface landmarks",prompt:"Tap the landmark used to count ribs, which lies at the level of the carina.",explain:{reasoning:"The sternal angle (of Louis) is level with the 2nd costal cartilage and T4/5, where the trachea divides.",takeaway:"Find the sternal angle, slide sideways onto the 2nd rib, then count down."}},{id:"r2",kind:"hotspot",level:1,view:"surface",answer:"rml",concept:"Lung lobes",prompt:"A patient has crackles heard only at the right lower anterior chest beside the sternum. Tap the most likely lobe.",explain:{reasoning:"Anteriorly, below the horizontal fissure (4th costal cartilage) on the right is the middle lobe. Lower lobes are mainly heard from behind.",takeaway:"Front = upper (and right middle) lobes; back = lower lobes; axilla = all."}},{id:"r3",kind:"match",level:1,concept:"Added sounds",prompt:"Match each sound to its mechanism.",pairs:[{left:"Wheeze",right:"Air through narrowed airways"},{left:"Fine crackles",right:"Small airways snapping open late in inspiration"},{left:"Stridor",right:"Narrowing of the larynx or upper trachea"},{left:"Bronchial breathing",right:"Sound conducted through solid lung"},{left:"Pleural rub",right:"Inflamed pleural surfaces sliding"}],explain:{reasoning:"Each sound reflects a physical event: oscillating narrowed airways (wheeze), reopening airways (crackles), extrathoracic narrowing (stridor), conduction through consolidation (bronchial), friction (rub).",takeaway:"Name the physics and you can name the pathology."}},{id:"r4",kind:"classify",level:1,concept:"Signs of respiratory distress",prompt:"Sort these into signs of increased work of breathing and other findings.",buckets:["Increased work of breathing","Other finding"],items:[{text:"Accessory muscle use",bucket:0},{text:"Intercostal recession",bucket:0},{text:"Tracheal tug",bucket:0},{text:"Tripod positioning",bucket:0},{text:"Finger clubbing",bucket:1},{text:"Tar staining",bucket:1},{text:"Nasal flaring",bucket:0}],explain:{reasoning:"Work-of-breathing signs show the patient is generating large negative pressures or recruiting extra muscles. Clubbing and tar staining are chronic clues, not signs of effort.",takeaway:"Respiratory rate plus work of breathing tell you how sick the patient is right now."}},{id:"r5",kind:"mcq",level:2,concept:"Bronchial breathing",twin:"r5b",prompt:"Why is breathing bronchial over consolidated lung?",options:[{id:"a",text:"Solid (fluid-filled) alveoli transmit the high-frequency sounds of patent bronchi straight to the chest wall",correct:!0},{id:"b",text:"The bronchi are narrowed by inflammation",why:"Narrowing produces wheeze, not bronchial breathing."},{id:"c",text:"Air in the pleural space amplifies sound",why:"Air in the pleura (pneumothorax) reduces breath sounds."}],explain:{reasoning:"Normal aerated lung filters out high frequencies, giving soft vesicular sounds. Consolidated lung conducts sound well, so the harsh tracheobronchial sound reaches the stethoscope, provided the airway is open.",chain:["Alveoli fill with exudate","Lung becomes solid","Better sound conduction","Bronchial breathing + ↑ vocal resonance"],takeaway:"Bronchial breathing needs an open airway; if the bronchus is blocked (collapse), sounds are reduced instead."}},{id:"r5b",kind:"mcq",level:2,concept:"Bronchial breathing",prompt:"Over a large pleural effusion, vocal resonance is reduced. Why?",options:[{id:"a",text:"Fluid between lung and chest wall reflects and damps sound transmission",correct:!0},{id:"b",text:"The vocal cords are paralysed",why:"Vocal resonance tests transmission of the patient’s voice, not cord function."},{id:"c",text:"The underlying lung is consolidated",why:"Consolidation increases vocal resonance."}],explain:{reasoning:"Sound passes poorly across a fluid–air interface. Effusions therefore mute breath sounds and vocal resonance.",takeaway:"Effusion: stony dull, quiet. Consolidation: dull, loud."}},{id:"r6",kind:"mcq",level:2,concept:"Tracheal deviation",prompt:"The trachea is deviated to the right. Which finding fits?",options:[{id:"a",text:"Right upper lobe collapse",correct:!0},{id:"b",text:"Large right pleural effusion",why:"A large effusion pushes the trachea AWAY, to the left."},{id:"c",text:"Right tension pneumothorax",why:"Tension pushes the mediastinum away, to the left."}],explain:{reasoning:"Volume loss (collapse, fibrosis, pneumonectomy) pulls the trachea toward the lesion. Space-occupying processes under pressure push it away.",takeaway:"Pulled toward = volume loss. Pushed away = fluid or air."}},{id:"r7",kind:"mcq",level:2,concept:"Wheeze vs stridor",prompt:"Why is stridor mainly inspiratory while asthmatic wheeze is mainly expiratory?",options:[{id:"a",text:"Extrathoracic airways narrow further on inspiration (negative internal pressure); intrathoracic airways narrow further on expiration (positive pleural pressure)",correct:!0},{id:"b",text:"Stridor is caused by mucus and wheeze by smooth muscle",why:"Both reflect narrowing; the phase depends on where the narrowing is relative to the thorax."},{id:"c",text:"Inspiration is louder than expiration in everyone",why:"This does not explain the pattern of abnormal sounds."}],explain:{reasoning:"During inspiration, pressure inside the upper airway falls below atmospheric, collapsing a narrowed extrathoracic segment. During expiration, positive pleural pressure compresses intrathoracic airways.",takeaway:"Inspiratory noise → above the chest. Expiratory noise → inside the chest."}},{id:"r8",kind:"mcq",level:2,deep:!0,concept:"Clubbing",prompt:"Which respiratory condition is NOT typically associated with finger clubbing?",options:[{id:"a",text:"Uncomplicated COPD",correct:!0},{id:"b",text:"Lung cancer",why:"Lung cancer (especially non-small cell) is a classic cause."},{id:"c",text:"Bronchiectasis",why:"Chronic suppurative lung disease causes clubbing."},{id:"d",text:"Idiopathic pulmonary fibrosis",why:"IPF commonly causes clubbing."}],explain:{reasoning:"Clubbing is not a feature of COPD. A COPD patient with new clubbing needs investigation for lung cancer or bronchiectasis.",takeaway:"COPD + clubbing = look for something else."}},{id:"r9",kind:"mcq",level:3,concept:"Interpreting signs",stem:"A 30-year-old is breathless after a car crash. RR 32, HR 128, BP 82/50, SpO₂ 86%. Trachea deviated to the left. Right chest hyper-resonant with absent breath sounds. Neck veins distended.",prompt:"What is the immediate action?",options:[{id:"a",text:"Immediate decompression of the right chest (needle or finger thoracostomy), then chest drain",correct:!0},{id:"b",text:"Urgent chest X-ray to confirm before acting",why:"Tension pneumothorax is a clinical diagnosis. Delaying for imaging in a shocked patient can be fatal."},{id:"c",text:"Large-volume IV fluid only",why:"The shock is obstructive (impaired venous return), not due to hypovolaemia alone. Decompression is what restores output."}],explain:{reasoning:"Hyper-resonance + absent sounds + tracheal shift away + hypotension + distended neck veins = tension pneumothorax. Rising intrathoracic pressure kinks great veins and impairs venous return.",chain:["One-way valve air leak","Rising pleural pressure","Mediastinal shift","↓ Venous return","Obstructive shock"],takeaway:"Tension pneumothorax: diagnose clinically, decompress immediately."}},{id:"r10",kind:"mcq",level:3,concept:"Light’s criteria",stem:"A pleural fluid sample: protein 24 g/L (serum 70), LDH 90 U/L (serum 200, ULN 250). The patient has bilateral effusions, raised JVP and pitting oedema.",labs:[{name:"Protein ratio",value:"0.34",ref:"> 0.5 exudate"},{name:"LDH ratio",value:"0.45",ref:"> 0.6 exudate"},{name:"Pleural LDH",value:"90",unit:"U/L",ref:"> 167 (2/3 ULN) exudate"}],prompt:"How do you classify the fluid?",options:[{id:"a",text:"Transudate, consistent with heart failure",correct:!0},{id:"b",text:"Exudate, consistent with malignancy",why:"None of the three Light’s criteria are met."},{id:"c",text:"Empyema",why:"Empyema is frank pus or a positive Gram stain/culture, usually with low pH."}],explain:{reasoning:"An effusion is an exudate if ANY criterion is met: protein ratio > 0.5, LDH ratio > 0.6, or pleural LDH > 2/3 of the serum ULN. None are met here.",science:"Transudates arise from imbalance of hydrostatic and oncotic pressure (heart failure, cirrhosis, nephrotic syndrome); the pleura itself is healthy. Exudates arise from leaky, diseased pleura.",takeaway:"Bilateral transudate + signs of fluid overload = heart failure. Treat the cause, not the fluid."}},{id:"r11",kind:"classify",level:3,deep:!0,concept:"Interpreting signs",prompt:"Sort these examination findings by the pathology they point to.",buckets:["Consolidation","Effusion","Pneumothorax"],items:[{text:"Increased vocal resonance",bucket:0},{text:"Stony dull percussion",bucket:1},{text:"Hyper-resonant percussion",bucket:2},{text:"Bronchial breathing",bucket:0},{text:"Trachea pushed away + dullness",bucket:1},{text:"Sudden pleuritic pain in a tall young man",bucket:2}],explain:{reasoning:"Consolidation conducts (bronchial breathing, ↑ VR). Fluid insulates and is stony dull. Air is hyper-resonant and quiet.",takeaway:"Percussion note tells you what is there (air, fluid, solid); breath sounds and VR tell you how well sound travels through it."}}],readiness:{understand:["Surface anatomy: sternal angle = 2nd rib and carina (T4/5); horizontal fissure at the 4th costal cartilage on the right; lower lobes lie mainly posteriorly.","Respiratory rate and work of breathing (accessory muscles, recession, tracheal tug) are the quickest measures of how unwell a patient is.","Percussion tells you what lies beneath (air: hyper-resonant; fluid: stony dull; solid: dull).","Breath sounds and vocal resonance tell you how sound travels: consolidation conducts (bronchial, ↑ VR); effusion and pneumothorax insulate (↓ sounds, ↓ VR).","Wheeze = intrathoracic narrowing (expiratory); stridor = extrathoracic narrowing (inspiratory); fine crackles = fibrosis/oedema; coarse crackles = secretions."],listenFor:["How your lecturer structures the history of breathlessness, cough and haemoptysis, and the red flags they emphasise.","The order of examination they expect in OSCEs (e
