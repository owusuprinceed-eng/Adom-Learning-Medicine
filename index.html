<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdominal Trauma: PBL Assessment</title>
<style>
:root{--ink:#16202c;--muted:#5b6878;--line:#dfe4ea;--bg:#f5f3ee;--navy:#173a5e;--red:#b42318;--redbg:#fdecea;--amber:#a15c07;--amberbg:#fef4e2;--green:#1f7a4d;--greenbg:#e8f5ee}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--navy);transition:width .3s}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.head{background:var(--navy);color:#fff;padding:16px 18px}
.head small{opacity:.75;letter-spacing:.12em;text-transform:uppercase;font-size:11.5px}
.head h1{font-family:Georgia,serif;font-weight:normal;font-size:24px;margin:4px 0 2px}
.head div{opacity:.85;font-size:14px}
.body{padding:14px 18px 18px}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
p{margin:6px 0}
ul{margin:4px 0;padding-left:20px}
li{margin:3px 0}
.hl{background:#fff3b0;padding:0 3px;border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
td.v{font-weight:700;white-space:nowrap}
td.n{color:var(--muted);font-size:13px}
tr.h td.v{color:var(--red)} tr.b td.v{color:var(--amber)}
.f{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
tr.h .f{color:var(--red);background:var(--redbg)} tr.b .f{color:var(--amber);background:var(--amberbg)} tr.ok .f{color:var(--green);background:var(--greenbg)}
.img{background:#f2f5f9;border-left:4px solid var(--navy);padding:8px 12px;border-radius:0 6px 6px 0;font-size:15px}
button{font:inherit;cursor:pointer;border-radius:8px}
.voice{margin-top:12px;border:1px solid #6b4fa0;color:#6b4fa0;background:#fff;padding:7px 13px;font-size:14px}
.voice.on{background:#6b4fa0;color:#fff}
.q{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:none}
.q.show{display:block}
.update{background:var(--amberbg);border-left:4px solid var(--amber);padding:9px 12px;border-radius:0 6px 6px 0;margin-bottom:10px;font-size:15px}
.update b:first-child{color:var(--amber)}
.qt{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);padding:10px 12px;margin:7px 0;font-size:15px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--greenbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.exp{display:none;margin-top:8px;padding:10px 12px;border-radius:8px;font-size:14.5px;background:#f4f7fa}
.exp.show{display:block}
.exp .verdict{font-weight:700}
.exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
.term{color:var(--navy);font-weight:600}
.pearl{display:none;margin-top:16px;background:var(--navy);color:#fff;border-radius:8px;padding:11px 14px;font-size:15px}
.pearl.show{display:block}
.pearl b{color:#ffd27a}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.nav button{padding:10px 18px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:15px}
.nav button.next{background:var(--navy);color:#fff}
.nav button:disabled{opacity:.35;cursor:default}
.end{text-align:center;padding:30px 20px}
.end .big{font-family:Georgia,serif;font-size:44px;color:var(--navy)}
.end ul{text-align:left;max-width:520px;margin:14px auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><span id="where"></span><span id="score"></span></div>
  <div class="prog"><i id="pbar"></i></div>
  <div id="stage"></div>
  <div class="nav">
    <button id="prev">◂ Previous</button>
    <button id="next" class="next">Next case ▸</button>
  </div>
</div>

<script>
/* v: [label, value, normal, flag h|b|ok] */
const CASES=[
{
  title:"The okada rider", setting:"ED, Kumasi · arrived 2 h after injury",
  pc:"Kwame, 24 M, motorbike rider, skidded into a gutter. <span class='hl'>Left upper abdominal pain spreading to the left shoulder tip.</span>",
  exam:["Cold, clammy; capillary refill 4 s","<span class='hl'>Tender left lower ribs (9–11)</span>","LUQ tenderness with guarding","GCS 14, confused"],
  v:[["Heart rate","132/min","60–100","h"],["Blood pressure","84/50","SBP ≥ 90","h"],["Resp. rate","28/min","12–20","h"],["Hb","8.6 g/dL","13–17","h"],["Lactate","5.4 mmol/L","< 2","h"],["Base deficit","−8","−2 to +2","h"]],
  img:"FAST: <span class='hl'>free fluid in LUQ and pelvis</span>.",
  qs:[
    {q:"Which ATLS class of hemorrhagic shock is he in?",o:["Class I","Class II","Class III","Class IV"],a:2,
     e:"HR 120–140, falling BP, confusion and base deficit −6 to −10 together mean <b>Class III</b>, about 30–40% blood loss. Class IV would show HR >140 and lethargy."},
    {q:"Which organ is most likely injured?",o:["Liver","Spleen","Left kidney","Pancreas"],a:1,
     e:"The spleen sits under the left ribs 9–11 and is the <b>commonest organ injured in blunt trauma</b>. The shoulder pain is <span class='term'>Kehr's sign</span>: blood irritating the diaphragm, felt in the shoulder."},
    {upd:"After 1 L fluid + 2 units blood, HR drops to 112 and then <b>rises back to 136</b>. BP 78/46.",
     q:"What is the next step?",o:["CT abdomen to grade the injury","Admit for observation","Immediate laparotomy + massive transfusion + TXA","Diagnostic peritoneal lavage"],a:2,
     e:"<b>Unstable + positive FAST = laparotomy.</b> He is a <span class='term'>transient responder</span> (improves then worsens), so he is still bleeding. Give balanced blood products and <span class='term'>tranexamic acid</span> within 3 h. An unstable patient never goes to CT."}
  ],
  pearl:"After splenectomy, vaccinate against pneumococcus, meningococcus and Hib."
},
{
  title:"The belted passenger", setting:"ED · head-on collision",
  pc:"Ama, 35 F, front-seat passenger. RUQ and periumbilical pain.",
  exam:["Alert, talking","<span class='hl'>Seatbelt-shaped bruise across lower abdomen</span>","RUQ tenderness, <b>no</b> guarding"],
  v:[["Heart rate","98/min","60–100","ok"],["Blood pressure","124/78","~120/80","ok"],["Hb","11.4 g/dL","12–15","b"],["ALT","410 U/L","7–56","h"],["WBC","9.0","4–11","ok"]],
  img:"FAST equivocal. CT: <span class='hl'>Grade III liver laceration</span>, no contrast blush, no free air.",
  qs:[
    {q:"Best management now?",o:["Laparotomy and liver repair","Non-operative management with serial exams","Discharge with analgesia","Pringle manoeuvre"],a:1,
     e:"She is <b>stable</b> with no peritonitis, and CT shows no active bleeding (<span class='term'>blush</span> = contrast leaking from a vessel). Most liver injuries are managed <span class='term'>non-operatively (NOM)</span> with repeated exams and Hb checks."},
    {q:"The seatbelt bruise should make you worry about…",o:["Splenic rupture","Bowel injury and lumbar spine fracture","Diaphragm rupture","Urethral injury"],a:1,
     e:"The seatbelt sign raises the risk of <b>hollow-organ (bowel) injury</b> and a lumbar <span class='term'>Chance fracture</span>. CT findings in bowel injury can be subtle."},
    {upd:"20 h later: temp <b>38.4 °C</b>, HR <b>118</b>, <b>diffuse guarding and rebound</b>, WBC <b>17.8</b>. Hb unchanged at 11.0.",
     q:"What has happened?",o:["Liver re-bleeding","Delayed small-bowel perforation","Normal post-injury inflammation","Pancreatitis"],a:1,
     e:"Hb is stable, so it isn't bleeding. Fever, high WBC and generalised peritonitis mean bowel contents are leaking. <b>Generalised peritonitis is an indication for laparotomy.</b>"}
  ],
  pearl:"NOM is not 'no management'. Repeated examination is the test."
},
{
  title:"The handlebar", setting:"District hospital · 11-year-old boy",
  pc:"Kofi, 11, fell off his bicycle; <span class='hl'>handlebar hit his upper abdomen</span>. Seen 3 h later, walking, mild pain.",
  exam:["Playful, alert","<span class='hl'>Small round epigastric bruise</span>","Soft abdomen, mild tenderness"],
  v:[["Heart rate","104/min","70–110 (age 11)","ok"],["Blood pressure","108/68","normal for age","ok"],["Amylase","82 U/L","30–110","ok"]],
  img:"No imaging done. He was sent home.",
  qs:[
    {q:"Does the normal amylase rule out pancreatic injury?",o:["Yes, normal amylase excludes it","No, amylase may be normal early","Yes, if the child looks well","Only if lipase is also normal"],a:1,
     e:"Amylase can be <b>normal in the first hours</b>. The pancreas is <span class='term'>retroperitoneal</span> (behind the abdominal lining), so signs come late. <b>Children also compensate well</b> until they crash."},
    {upd:"Returns <b>48 h later</b>: vomiting, pain boring to the back, HR 126, temp 38.2 °C, <b>amylase 940</b>. CT: <span class='hl'>pancreatic body transection</span> + duodenal hematoma.",
     q:"Which test best shows whether the main pancreatic duct is injured?",o:["Repeat FAST","Plain abdominal X-ray","MRCP / ERCP","Serum lipase"],a:2,
     e:"<span class='term'>MRCP</span> (MRI of the ducts) or <span class='term'>ERCP</span> (dye via an endoscope) defines duct injury. Distal duct injury → <b>distal pancreatectomy</b>, spleen-preserving in children where possible."}
  ],
  pearl:"Handlebar to the epigastrium means pancreas and duodenum until proven otherwise."
},
{
  title:"The crush at the site", setting:"ED · pelvis crushed by a reversing truck",
  pc:"Yaw, 42 M. Severe pelvic pain. <span class='hl'>Can't pass urine.</span>",
  exam:["<span class='hl'>Blood at the urethral meatus</span>","<span class='hl'>Butterfly bruise on perineum/scrotum</span>","Unstable pelvis","Nurse about to insert a urinary catheter"],
  v:[["Heart rate","118/min","60–100","h"],["Blood pressure","98/64","~120/80","b"],["Hb","10.8 g/dL","13–17","h"]],
  img:"Pelvic X-ray: <span class='hl'>open-book pelvic fracture</span>.",
  qs:[
    {q:"What should happen with the urinary catheter?",o:["Insert it to monitor urine output","Insert with extra lubricant","Stop: do a retrograde urethrogram first","Insert a smaller catheter"],a:2,
     e:"Blood at the meatus + perineal bruise + inability to void suggests <b>urethral injury</b>. A catheter can turn a partial tear into a complete one. Confirm with a <span class='term'>retrograde urethrogram</span> (dye up the urethra) and drain with a <span class='term'>suprapubic catheter</span>."},
    {q:"Immediate step to reduce pelvic bleeding?",o:["Pelvic binder","Repeated pelvic springing","Urgent CT","Tight abdominal bandage"],a:0,
     e:"A <span class='term'>pelvic binder</span> at the level of the greater trochanters closes the open pelvic ring and limits bleeding. Examine the pelvis once only, because repeated springing restarts bleeding."},
    {upd:"Cystogram: contrast <b>spreads around bowel loops</b> in the abdomen.",
     q:"This bladder injury needs…",o:["Catheter drainage only","Surgical repair","Antibiotics only","Observation"],a:1,
     e:"Contrast in the abdominal cavity means an <span class='term'>intraperitoneal</span> rupture, which <b>needs surgery</b>. An extraperitoneal rupture (leak only around the bladder) usually heals with catheter drainage."}
  ],
  pearl:"Look at the meatus before the catheter. Blood there means STOP."
},
{
  title:"The knife below the ribs", setting:"ED, Accra · Saturday night",
  pc:"Kojo, 28 M, one stab wound: <span class='hl'>left 7th intercostal space, anterior axillary line</span>.",
  exam:["Comfortable, talking","No evisceration","Tender only around the wound, no peritonitis"],
  v:[["Heart rate","92/min","60–100","ok"],["Blood pressure","128/80","~120/80","ok"],["SpO₂","96%","≥ 95%","ok"]],
  img:"Chest X-ray normal. FAST negative.",
  qs:[
    {q:"Which structure is most at risk of being missed here?",o:["Right kidney","Left hemidiaphragm","Bladder","Appendix"],a:1,
     e:"This is a <span class='term'>thoracoabdominal</span> wound (between the nipple line and costal margin). <b>Diaphragm injuries are commoner on the left</b> and are easily missed on X-ray and CT."},
    {q:"Best next step?",o:["Immediate laparotomy","Discharge home","Diagnostic laparoscopy","Repeat FAST only"],a:2,
     e:"He is stable with no peritonitis, so there is no need for open surgery. A <span class='term'>laparoscopy</span> (keyhole camera) lets you look directly at the diaphragm."},
    {upd:"Laparoscopy: <b>2 cm tear in the left diaphragm</b>, nothing else.",
     q:"Why must it be repaired?",o:["It causes immediate bleeding","Bowel can herniate into the chest later and strangulate","It always causes pneumothorax","It doesn't need repair"],a:1,
     e:"Diaphragm injuries <b>may present months or years later</b> with stomach or colon herniation. They <b>always require operative repair</b>. (Note: if he had arrived with <span class='term'>evisceration</span>, that alone would mean laparotomy.)"}
  ],
  pearl:"Gunshot wounds carry higher morbidity than stab wounds, so the threshold for surgery is lower."
},
{
  title:"The long night in theatre", setting:"Theatre · gunshot wound, 90 min into laparotomy",
  pc:"Mensah, 31 M. Multiple bowel holes, liver bleed. <span class='hl'>12 units red cells given, little plasma</span>. Diffuse oozing from all raw surfaces.",
  exam:["Surgeon plans to repair every hole and do two anastomoses","Patient cold to touch"],
  v:[["Core temp","34.6 °C","36.5–37.5","h"],["pH","7.11","7.35–7.45","h"],["INR","2.3","0.8–1.2","h"],["Platelets","68","150–400","h"],["Ionised Ca","0.86 mmol/L","1.1–1.3","h"]],
  img:"Intra-operative decision. No imaging.",
  qs:[
    {q:"Hypothermia + acidosis + coagulopathy is called…",o:["SIRS","The lethal triad","Cushing's triad","Beck's triad"],a:1,
     e:"The <b>lethal triad</b>: cold stops clotting enzymes working, acid weakens clotting and the heart, and bleeding worsens both. Each feeds the others."},
    {q:"What should the surgeon do?",o:["Complete all repairs and anastomoses","Damage control: pack, control contamination, temporary closure","Close the abdomen fully and wait","Give crystalloid and continue"],a:1,
     e:"<span class='term'>Damage control surgery</span>: stop bleeding (packing), stop contamination (staple off the bowel), temporary closure. Then warm and correct in ICU, and return for definitive repair."},
    {upd:"ICU day 1: abdomen tense, <b>bladder pressure 27 mmHg</b>, urine output 5 mL/h, airway pressures rising.",
     q:"Diagnosis and treatment?",o:["Sepsis, so antibiotics","Abdominal compartment syndrome, so decompressive laparotomy","Kidney failure, so dialysis","Pneumothorax, so chest drain"],a:1,
     e:"Raised <span class='term'>intra-abdominal pressure</span> (measured via the bladder; normal ~5–7 mmHg) with organ failure is <b>abdominal compartment syndrome</b>. Treat it by re-opening the abdomen."}
  ],
  pearl:"Replace calcium. Citrate in stored blood binds it."
},
{
  title:"The grandma who's 'fine'", setting:"ED · fell down 4 steps at home",
  pc:"Mrs Esi, 74 F. Left flank pain. Says she 'doesn't want to bother anyone'.",
  exam:["On <span class='hl'>warfarin</span> (AF) and <span class='hl'>bisoprolol</span> (beta-blocker)","<span class='hl'>Usual BP 165/95</span>","Left flank bruise, loin tenderness","Urine dipstick: blood ++"],
  v:[["Heart rate","84/min","60–100","ok"],["Blood pressure","112/70","her usual 165/95","b"],["INR","3.6","target 2–3","h"],["Hb","10.2 g/dL","12–15","h"]],
  img:"Not done yet.",
  qs:[
    {q:"How should you read her vital signs?",o:["Reassuring, she can go home","Possibly shocked: relative hypotension and the beta-blocker masks tachycardia","Normal for her age","Only the INR matters"],a:1,
     e:"A BP ~50 mmHg below <i>her</i> baseline is <span class='term'>relative hypotension</span>. <b>Beta-blockers stop the heart speeding up</b>, so a normal HR hides shock."},
    {q:"Best plan?",o:["Discharge with follow-up","CT, reverse anticoagulation, admit","Immediate laparotomy","Repeat bloods in a week"],a:1,
     e:"Elderly patient + anticoagulant means a <b>lower threshold for imaging and admission</b>. Reverse warfarin (vitamin K + PCC or FFP)."},
    {upd:"CT: <b>Grade III left kidney laceration</b>, no active bleeding. Stable.",
     q:"Management?",o:["Nephrectomy","Conservative management with monitoring","Laparotomy to explore","Discharge"],a:1,
     e:"<b>Most renal injuries are managed conservatively</b>. The amount of <span class='term'>hematuria</span> (blood in urine) <b>doesn't correlate with severity</b>, so trust the CT grade and the vitals."}
  ],
  pearl:"Normal numbers can lie in the elderly. Compare with their own baseline."
}
];

const state=CASES.map(c=>c.qs.map(()=>null));
let cur=0, speaking=null;
const $=id=>document.getElementById(id);

function scoreTxt(){
  let r=0,t=0;state.forEach(c=>c.forEach(a=>{if(a!==null){t++;if(a.ok)r++;}}));
  const total=state.reduce((s,c)=>s+c.length,0);
  return `Score ${r}/${t} · ${total} questions`;
}

function show(i){
  if(speaking)speechSynthesis.cancel();
  cur=i;
  window.scrollTo({top:0});
  $('prev').disabled=i===0;
  if(i===CASES.length){return showEnd();}
  $('next').textContent=i===CASES.length-1?'Finish ▸':'Next case ▸';
  $('next').style.display='';
  const c=CASES[i];
  $('where').textContent=`Case ${i+1} of ${CASES.length}`;
  $('pbar').style.width=((i+1)/CASES.length*100)+'%';
  $('score').textContent=scoreTxt();
  const vit=c.v.map(x=>`<tr class="${x[3]}"><td>${x[0]}</td><td class="v">${x[1]}</td><td class="n">${x[2]}</td><td><span class="f">${x[3]==='h'?'HIGH RISK':x[3]==='b'?'BORDERLINE':'NORMAL'}</span></td></tr>`).join('');
  const qs=c.qs.map((q,j)=>`
    <div class="q" id="q${j}">
      ${q.upd?`<div class="update"><b>Update:</b> ${q.upd}</div>`:''}
      <div class="qt">Q${j+1}. ${q.q}</div>
      ${q.o.map((o,k)=>`<button class="opt" data-q="${j}" data-k="${k}">${String.fromCharCode(65+k)}. ${o}</button>`).join('')}
      <div class="exp" id="e${j}"></div>
    </div>`).join('');
  $('stage').innerHTML=`
  <div class="card">
    <div class="head"><small>Patient report</small><h1>${c.title}</h1><div>${c.setting}</div></div>
    <div class="body">
      <div id="rep">
        <p>${c.pc}</p>
        <h3>Findings</h3><ul>${c.exam.map(e=>`<li>${e}</li>`).join('')}</ul>
        <h3>Numbers</h3><table>${vit}</table>
        <h3>Imaging</h3><div class="img">${c.img}</div>
      </div>
      <button class="voice" id="vbtn">🔊 Listen to report</button>
      ${qs}
      <div class="pearl" id="pearl"><b>Take-home:</b> ${c.pearl}</div>
    </div>
  </div>`;
  $('vbtn').onclick=()=>speak($('vbtn'));
  // restore answered state
  let open=0;
  c.qs.forEach((q,j)=>{
    if(state[i][j]!==null){paint(j,state[i][j].k);open=j+1;}
  });
  for(let j=0;j<=Math.min(open,c.qs.length-1);j++)$('q'+j).classList.add('show');
  if(open===c.qs.length)$('pearl').classList.add('show');
}

function paint(j,k){
  const q=CASES[cur].qs[j];
  document.querySelectorAll(`.opt[data-q="${j}"]`).forEach(b=>{
    b.disabled=true;const bk=+b.dataset.k;
    if(bk===q.a)b.classList.add('right');else if(bk===k)b.classList.add('wrong');
  });
  const ok=k===q.a;
  const e=$('e'+j);
  e.innerHTML=`<span class="verdict ${ok?'ok':'no'}">${ok?'✓ Correct.':'✗ Not quite. Answer: '+String.fromCharCode(65+q.a)+'.'}</span> ${q.e}`;
  e.classList.add('show');
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('.opt');if(!b||b.disabled)return;
  const j=+b.dataset.q,k=+b.dataset.k;
  state[cur][j]={k,ok:k===CASES[cur].qs[j].a};
  paint(j,k);
  $('score').textContent=scoreTxt();
  const nq=$('q'+(j+1));
  if(nq){nq.classList.add('show');setTimeout(()=>nq.scrollIntoView({behavior:'smooth',block:'nearest'}),250);}
  else{$('pearl').classList.add('show');}
});

function showEnd(){
  let r=0,t=0;state.forEach(c=>c.forEach(a=>{t++;if(a&&a.ok)r++;}));
  $('where').textContent='Done';$('pbar').style.width='100%';$('score').textContent='';
  $('next').style.display='none';
  $('stage').innerHTML=`<div class="card"><div class="end">
    <div class="big">${r} / ${t}</div>
    <p>Five things to remember for tomorrow:</p>
    <ul>
      <li><b>Unstable + positive FAST → laparotomy.</b> Stable → CT.</li>
      <li><b>Laparotomy indications:</b> instability, generalised peritonitis, evisceration, free air under the diaphragm.</li>
      <li><b>NOM</b> needs stability, serial exams, CT and blood available.</li>
      <li><b>Lethal triad</b> (cold, acid, bleeding) → damage control surgery.</li>
      <li>Children compensate, the elderly hide shock, and blood at the meatus means no catheter.</li>
    </ul>
    <button class="voice" onclick="location.reload()">↺ Start again</button>
  </div></div>`;
}

function speak(btn){
  if(!('speechSynthesis' in window)){alert('Voice-over needs Chrome or Edge.');return;}
  if(speaking){speechSynthesis.cancel();return;}
  const rows=[...document.querySelectorAll('#rep tr')].map(r=>{const c=[...r.children].map(t=>t.innerText);return `${c[0]}: ${c[1]}, normal ${c[2]}, ${c[3].toLowerCase()}.`;}).join(' ');
  const rep=$('rep').cloneNode(true);rep.querySelector('table').remove();
  rep.querySelectorAll('li').forEach(l=>l.textContent=l.textContent+'. ');
  let t=CASES[cur].title+'. '+rep.innerText.replace('Numbers','Numbers. '+rows).replace(/Findings|Imaging/g,m=>m+'. ');
  t=t.replace(/(\d)\/(\d)/g,'$1 over $2').replace(/\/min/g,' per minute').replace(/g\/dL/g,'grams per decilitre').replace(/mmol\/L/g,'millimoles per litre').replace(/U\/L/g,'units per litre').replace(/°C/g,' degrees').replace(/−/g,'minus ').replace(/≥/g,'at least ').replace(/</g,'less than ').replace(/~/g,'about ').replace(/\bSBP\b/g,'systolic').replace(/SpO₂/g,'oxygen saturation');
  const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.lang='en-GB';
  const v=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
  btn.textContent='⏹ Stop';btn.classList.add('on');speaking=u;
  u.onend=u.onerror=()=>{btn.textContent='🔊 Listen to report';btn.classList.remove('on');speaking=null;};
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window)speechSynthesis.getVoices();

$('prev').onclick=()=>show(cur-1);
$('next').onclick=()=>show(cur+1);
show(0);
</script>
</body>
</html>
