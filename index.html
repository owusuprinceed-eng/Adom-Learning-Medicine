tairs",name:"Mr Kojo D.",age:63,sex:"M",context:"Respiratory clinic referral. Retired bus driver.",complaint:"I have to stop halfway up the stairs now, and I cough up phlegm every morning.",vitals:[{label:"HR",value:"88 /min"},{label:"BP",value:"138/86"},{label:"RR",value:"20 /min"},{label:"Temp",value:"36.8 °C"},{label:"SpO₂",value:"94% air"},{label:"BMI",value:"23"}],historyBudget:7,history:[{id:"smoke",label:"Smoking history (pack-years) and exposures",result:"20 a day from age 18 until 58: about 40 pack-years. Also cooked over a charcoal stove indoors for years.",relevance:"key",note:"Tobacco and biomass smoke are the main COPD risk factors."},{id:"course",label:"Pattern over time: progressive or episodic?",result:"Slowly worse over 5 years. Never completely clears, even on good days.",relevance:"key",note:"Persistent, progressive symptoms favour COPD; variable, episodic symptoms favour asthma."},{id:"exac",label:"Flare-ups needing antibiotics, steroids or admission",result:"Two chest infections last winter treated with antibiotics and prednisolone. No admissions.",relevance:"key",note:"Two or more moderate exacerbations a year changes treatment (GOLD group E)."},{id:"child",label:"Childhood asthma, eczema, hay fever, allergies",result:"No childhood asthma, no allergies.",relevance:"key",note:"Atopy and childhood onset support asthma."},{id:"mmrc",label:"Breathlessness grade (mMRC)",result:"I walk slower than people my age on the flat because of breathlessness.",relevance:"useful",note:"mMRC grade 2."},{id:"red",label:"Haemoptysis, weight loss, chest pain",result:"No blood, weight stable.",relevance:"useful",note:"Red flags for lung cancer, which shares the same risk factor."},{id:"ankle",label:"Ankle swelling, orthopnoea",result:"No.",relevance:"useful",note:"Peripheral oedema could indicate cor pulmonale or heart failure."},{id:"pets",label:"Pets at home",result:"A dog.",relevance:"low"}],examBudget:4,exam:[{id:"insp",label:"Inspection: chest shape, pursed lips, accessory muscles",result:"Barrel-shaped chest, pursed-lip breathing on exertion, mild accessory muscle use.",relevance:"key",note:"Hyperinflation; pursed lips create back-pressure that splints small airways open."},{id:"hands",label:"Hands: clubbing, tar staining, flap",result:"Tar staining; no clubbing; no CO₂ retention flap.",relevance:"key",note:"Clubbing is NOT a feature of COPD and would prompt a search for cancer or bronchiectasis."},{id:"perc",label:"Percussion and cardiac dullness",result:"Hyper-resonant; loss of cardiac and liver dullness.",relevance:"useful"},{id:"ausc",label:"Auscultation",result:"Quiet breath sounds with prolonged expiration and scattered expiratory wheeze.",relevance:"key"},{id:"cricoid",label:"Cricosternal distance",result:"Two finger-breadths (reduced).",relevance:"useful",note:"A short cricosternal distance suggests hyperinflation."},{id:"legs",label:"Legs: oedema",result:"None.",relevance:"low"}],investigations:[{id:"spiro",label:"Spirometry with bronchodilator reversibility",result:"Persistent airflow limitation, minimal reversibility.",labs:[{name:"FEV1 post-BD",value:"1.71",unit:"L",ref:"pred 3.05 (56%)",flag:"L"},{name:"FVC post-BD",value:"3.30",unit:"L",ref:"pred 3.95 (84%)",flag:"N"},{name:"FEV1/FVC post-BD",value:"0.52",ref:"≥ 0.70",flag:"L"},{name:"ΔFEV1",value:"+110 mL (7%)",ref:"≥ 12% and 200 mL",flag:"N"}],relevance:"key",note:"Post-BD FEV1/FVC < 0.7 confirms COPD; FEV1 56% = GOLD grade 2."},{id:"cxr",label:"Chest X-ray",result:"Hyperinflated lungs (> 7 anterior ribs), flattened diaphragms, no mass or consolidation.",relevance:"key",note:"Excludes alternative diagnoses and lung cancer; supports hyperinflation."},{id:"fbc",label:"Full blood count with eosinophils",result:"Hb 168 g/L (upper normal); eosinophils 0.35 ×10⁹/L (350 cells/µL).",relevance:"useful",note:"Eosinophils ≥ 300/µL predict benefit from adding an inhaled corticosteroid in patients with exacerbations."},{id:"a1at",label:"Alpha-1 antitrypsin level",result:"1.3 g/L (normal).",relevance:"useful",note:"WHO recommends screening all patients with COPD once, especially if young or with basal emphysema."},{id:"bmi",label:"BMI and oxygen saturation",result:"BMI 23; SpO₂ 94% at rest.",relevance:"useful",note:"Low BMI predicts worse prognosis; resting SpO₂ ≤ 92% would trigger blood gases for oxygen assessment."},{id:"ecg",label:"ECG",result:"Sinus rhythm, no right heart strain.",relevance:"useful",note:"Screens for cardiac comorbidity common in COPD."},{id:"ct",label:"High-resolution CT chest",result:"Centrilobular emphysema, upper-zone predominant.",relevance:"low",note:"Not needed for diagnosis; used for unexplained symptoms, suspected bronchiectasis, lung cancer concern or before volume-reduction procedures."},{id:"ige",label:"Total IgE and skin prick testing",result:"IgE normal; skin prick tests negative.",relevance:"low",note:"Not routine in COPD without features suggesting asthma."},{id:"abg",label:"Arterial blood gas",result:"Not indicated: saturation 94% and stable.",relevance:"low",note:"Reserved for SpO₂ ≤ 92% or suspected hypercapnia."}],differentials:[{id:"copd",name:"COPD",note:"Heavy smoking and biomass exposure, progressive persistent symptoms, chronic sputum, post-BD FEV1/FVC 0.52 with little reversibility."},{id:"asthma",name:"Asthma",note:"Would expect variable symptoms, atopy, earlier onset and significant reversibility (≥ 12% and 200 mL, often much more)."},{id:"bx",name:"Bronchiectasis",note:"Daily large-volume purulent sputum, recurrent infections, coarse crackles, clubbing; HRCT shows dilated bronchi."},{id:"hf",name:"Heart failure",note:"Orthopnoea, oedema, raised JVP, cardiomegaly; spirometry is not obstructive."},{id:"ca",name:"Lung cancer",note:"Shares the risk factor. No haemoptysis, weight loss, clubbing or mass on CXR, but keep a low threshold for imaging."},{id:"ild",name:"Interstitial lung disease",note:"Restrictive spirometry, fine crackles, clubbing."}],diagnosis:"copd",reasoning:[{id:"r1",text:"A heavy smoker with progressive breathlessness and chronic sputum, a post-bronchodilator FEV1/FVC of 0.52 and minimal reversibility has COPD (GOLD grade 2, two exacerbations a year).",correct:!0},{id:"r2",text:"Wheeze on auscultation means asthma.",why:"Wheeze occurs in both. The persistent course, smoking history, no atopy and minimal reversibility point to COPD."},{id:"r3",text:"The FEV1/FVC ratio is low, so this could be a restrictive disease.",why:"Restriction lowers FVC proportionally with FEV1, so the ratio is normal or high. A low ratio means obstruction."},{id:"r4",text:"COPD is diagnosed on CT when emphysema is seen.",why:"COPD is a spirometric diagnosis (persistent airflow limitation). CT can show emphysema in people without obstruction and vice versa."}],debrief:{summary:"Mr D. has COPD: smoke-induced small-airway inflammation and emphysema causing persistent airflow limitation. Hyperinflation explains his barrel chest, quiet breath sounds and exertional breathlessness. Two exacerbations last year place him in GOLD group E.",redFlags:["Haemoptysis or weight loss (lung cancer)","Clubbing (not COPD: look for cancer or bronchiectasis)","Resting SpO₂ ≤ 92%, cyanosis or oedema (respiratory failure, cor pulmonale)","Drowsiness or a CO₂ retention flap in an exacerbation"],management:["Stop smoking (already done) and reduce biomass exposure; vaccinations (influenza, pneumococcal, COVID-19, RSV where available).","Long-acting bronchodilators: LAMA + LABA; with ≥ 2 moderate exacerbations and eosinophils ≥ 300/µL, consider adding an inhaled corticosteroid (triple therapy).","Pulmonary rehabilitation; check inhaler technique at every visit; written exacerbation action plan.","Review comorbidities (cardiovascular disease, osteoporosis, anxiety/depression)."],takeaway:"COPD is a spirometric diagnosis: post-bronchodilator FEV1/FVC < 0.7 in someone with symptoms and exposure. Reversibility helps separate it from asthma, but the two can overlap."}},questions:[{id:"o1",kind:"hotspot",level:1,view:"airway",answer:"sm",concept:"Airway wall anatomy",prompt:"Tap the structure that salbutamol relaxes.",explain:{reasoning:"β2-agonists stimulate β2 receptors on airway smooth muscle, raising cAMP and relaxing the muscle. That widens the lumen within minutes.",takeaway:"Bronchodilators work on smooth muscle; inhaled corticosteroids work on inflammation."}},{id:"o2",kind:"classify",level:1,concept:"Asthma vs COPD",twin:"o2b",prompt:"Sort the features toward asthma or COPD.",buckets:["Favours asthma","Favours COPD"],items:[{text:"Onset in childhood",bucket:0},{text:"40 pack-year smoking history",bucket:1},{text:"Symptoms vary day to day",bucket:0},{text:"Persistent, progressive breathlessness",bucket:1},{text:"Large bronchodilator response",bucket:0},{text:"Daily morning sputum",bucket:1},{text:"Eczema and hay fever",bucket:0}],explain:{reasoning:"Asthma: variable, often atopic, early onset, reversible. COPD: exposure (smoking, biomass), later onset, persistent and progressive, limited reversibility.",takeaway:"Variability and reversibility point to asthma; exposure and persistence point to COPD."}},{id:"o2b",kind:"mcq",level:1,concept:"Asthma vs COPD",prompt:"Which inflammatory cell dominates typical (type 2) asthma?",options:[{id:"a",text:"Eosinophils",correct:!0},{id:"b",text:"Neutrophils",why:"Neutrophils dominate COPD (and some severe asthma)."},{id:"c",text:"Plasma cells",why:"Not the dominant airway cell in either condition."}],explain:{reasoning:"Th2 cytokines (IL-4, IL-5, IL-13) drive IgE production, eosinophil recruitment and mucus. Steroids suppress this pathway effectively.",takeaway:"Eosinophils = steroid-responsive inflammation."}},{id:"o3",kind:"match",level:1,concept:"Spirometry terms",prompt:"Match the spirometry term to its meaning.",pairs:[{left:"FEV1",right:"Volume exhaled in the first second"},{left:"FVC",right:"Total volume exhaled forcefully after full inspiration"},{left:"FEV1/FVC < 0.7",right:"Airflow obstruction"},{left:"PEF",right:"Highest flow reached early in forced expiration"}],explain:{reasoning:"Obstruction slows emptying, so FEV1 falls more than FVC and the ratio drops. Restriction lowers both, so the ratio stays normal.",takeaway:"Low ratio = obstruction. Low FVC with normal ratio = possible restriction."}},{id:"o4",kind:"mcq",level:1,concept:"Bronchiectasis",prompt:"Which feature best describes bronchiectasis?",options:[{id:"a",text:"Permanent dilatation of bronchi with chronic productive cough and recurrent infection",correct:!0},{id:"b",text:"Reversible bronchospasm triggered by allergens",why:"That describes asthma."},{id:"c",text:"Destruction of alveolar walls",why:"That describes emphysema."}],explain:{reasoning:"A vicious cycle of infection, inflammation and impaired clearance destroys bronchial wall support, leaving dilated, mucus-filled airways. Causes include post-infection (TB, pertussis), cystic fibrosis, immune deficiency, ABPA and primary ciliary dyskinesia.",takeaway:"Bronchiectasis: daily purulent sputum, coarse crackles, often clubbing; diagnose on HRCT."}},{id:"o5",kind:"mcq",level:2,concept:"Wheeze mechanism",prompt:"Why does airway obstruction produce wheezing?",options:[{id:"a",text:"Air forced through a narrowed airway makes its walls oscillate, producing a musical tone",correct:!0},{id:"b",text:"Mucus bubbles burst in the alveoli",why:"Bubbling secretions produce crackles, not musical wheeze."},{id:"c",text:"The vocal cords vibrate with each breath",why:"Vocal cord dysfunction can mimic wheeze, but asthmatic wheeze comes from intrathoracic airways."}],explain:{reasoning:"Narrowing raises airflow velocity; the airway wall flutters at a frequency set by its size and stiffness. Many airways at different calibres give polyphonic wheeze. Wheeze is louder on expiration because intrathoracic airways narrow further as pleural pressure rises.",chain:["Narrowed airway","↑ Velocity of airflow","Wall flutter (oscillation)","Musical expiratory wheeze"],takeaway:"A silent chest in severe asthma means too little airflow to wheeze: an emergency."}},{id:"o6",kind:"order",level:2,concept:"Air trapping",prompt:"Order the chain from emphysema to breathlessness on exertion.",items:["Proteases destroy alveolar walls and elastic fibres","Loss of radial traction on small airways","Small airways collapse during expiration","Air is trapped; end-expiratory lung volume rises","Exercise shortens expiratory time → dynamic hyperinflation","Flattened diaphragm and high work of breathing → breathlessness"],explain:{reasoning:"Without elastic tethering, small airways close early in expiration. Faster breathing gives even less time to empty, so volume ratchets up.",chain:["Elastin loss","↓ Tethering","Expiratory collapse","Air trapping","Dynamic hyperinflation","Dyspnoea"],takeaway:"In COPD, exercise breathlessness is largely a volume problem, which is why bronchodilators that improve emptying help even when FEV1 barely changes."}},{id:"o7",kind:"mcq",level:2,concept:"Poiseuille",prompt:"An airway’s radius falls by half. Approximately how much does its resistance to laminar airflow rise?",options:[{id:"a",text:"About 16-fold",correct:!0},{id:"b",text:"About 2-fold",why:"Resistance is not linear with radius; it scales with 1/r⁴."},{id:"c",text:"About 4-fold",why:"That would be 1/r², which applies to cross-sectional area, not resistance."}],explain:{reasoning:"Poiseuille’s law: R ∝ 1/r⁴. (1/0.5)⁴ = 16.",takeaway:"Small changes in airway calibre produce large changes in resistance, so modest bronchodilation can bring large relief."}},{id:"o8",kind:"mcq",level:2,deep:!0,concept:"α1-antitrypsin",prompt:"Why does α1-antitrypsin deficiency cause emphysema in young adults?",options:[{id:"a",text:"Neutrophil elastase is not inhibited and digests alveolar elastin",correct:!0},{id:"b",text:"It increases mucus production",why:"Mucus hypersecretion is not the mechanism."},{id:"c",text:"It causes bronchospasm",why:"It affects the protease–antiprotease balance, not smooth muscle."}],explain:{reasoning:"α1-antitrypsin, made by the liver, is the main inhibitor of neutrophil elastase in the lung. Deficiency leaves elastin unprotected; smoking adds more elastase and inactivates residual antitrypsin. Emphysema is typically panacinar and basal.",takeaway:"Emphysema under 45, basal predominance, or with liver disease: check α1-antitrypsin."}},{id:"o9",kind:"mcq",level:3,concept:"Spirometry interpretation",stem:"A 28-year-old has intermittent wheeze. Pre-BD: FEV1 2.60 L, FVC 4.10 L. Post-BD: FEV1 3.25 L, FVC 4.25 L.",labs:[{name:"FEV1/FVC pre",value:"0.63",ref:"≥ 0.70",flag:"L"},{name:"ΔFEV1",value:"+650 mL (25%)",ref:"≥ 12% and 200 mL",flag:"!"}],prompt:"How do you interpret this?",options:[{id:"a",text:"Obstruction with significant bronchodilator responsiveness, supporting asthma",correct:!0},{id:"b",text:"COPD, because the ratio is below 0.7",why:"Post-BD the ratio is 0.76; the obstruction is largely reversible and the patient is young without exposure."},{id:"c",text:"Restrictive defect",why:"FVC is normal and the ratio is low: obstructive, not restrictive."}],explain:{reasoning:"Ratio 0.63 pre-BD = obstruction. FEV1 rises 650 mL (25%), far above the 12% and 200 mL threshold, and the post-BD ratio normalises.",takeaway:"Large reversibility + variability + atopy = asthma. A normal spirometry does not exclude asthma between attacks."}},{id:"o10",kind:"mcq",level:3,concept:"Acute severe asthma",stem:"A 19-year-old with asthma: cannot complete sentences, RR 30, HR 125, PEF 40% of best, SpO₂ 93%. Widespread wheeze.",prompt:"What is the correct classification and first treatment?",options:[{id:"a",text:"Acute severe asthma: oxygen to SpO₂ 94–98%, nebulised salbutamol (back-to-back), ipratropium, and oral prednisolone or IV hydrocortisone",correct:!0},{id:"b",text:"Moderate asthma: increase the inhaled corticosteroid and review next week",why:"Inability to complete sentences, RR ≥ 25, HR ≥ 110 and PEF 33–50% define acute severe asthma needing hospital treatment."},{id:"c",text:"Life-threatening asthma: immediate intubation",why:"Life-threatening features are PEF < 33%, SpO₂ < 92%, silent chest, cyanosis, exhaustion, confusion, arrhythmia or hypotension. Not present yet, but watch closely."}],explain:{reasoning:"Severity criteria (BTS/SIGN) guide treatment intensity. A normal or rising PaCO₂ in an asthma attack is a near-fatal sign: the patient is tiring.",takeaway:"In asthma attacks, a “normal” CO₂ is not reassuring."}},{id:"o11",kind:"mcq",level:3,concept:"COPD exacerbation",stem:"A 70-year-old with COPD is drowsy with increased breathlessness and purulent sputum. ABG on 4 L/min oxygen:",labs:[{name:"pH",value:"7.28",ref:"7.35–7.45",flag:"L"},{name:"PaCO₂",value:"8.9",unit:"kPa",ref:"4.7–6.0",flag:"H"},{name:"PaO₂",value:"11.5",unit:"kPa",ref:"> 10",flag:"N"},{name:"HCO₃⁻",value:"31",unit:"mmol/L",ref:"22–26",flag:"H"}],prompt:"What is the most appropriate step?",options:[{id:"a",text:"Reduce oxygen to target SpO₂ 88–92% and start non-invasive ventilation, with bronchodilators, steroids and antibiotics",correct:!0},{id:"b",text:"Increase oxygen to 15 L/min via a non-rebreather mask",why:"Excess oxygen worsens hypercapnia in COPD (V/Q mismatch, Haldane effect). Target 88–92%."},{id:"c",text:"Give IV sedation for agitation",why:"Sedation will worsen hypoventilation and acidosis."}],explain:{reasoning:"Acute-on-chronic hypercapnic respiratory failure (high HCO₃⁻ shows chronic compensation, low pH shows acute decompensation). NIV is indicated when pH < 7.35 and PaCO₂ > 6.5 kPa despite optimal medical therapy.",takeaway:"COPD exacerbation: controlled oxygen 88–92%, and NIV for respiratory acidosis."}},{id:"o12",kind:"mcq",level:3,deep:!0,concept:"Asthma treatment",stem:"A 25-year-old uses a salbutamol inhaler alone, 3–4 times a week, and wakes at night with cough twice a month.",prompt:"What does current GINA guidance recommend?",options:[{id:"a",text:"Start an inhaled corticosteroid-containing regimen (e.g. as-needed or maintenance-and-reliever ICS–formoterol); SABA-only treatment is not recommended",correct:!0},{id:"b",text:"Continue SABA alone; it is mild asthma",why:"SABA-only treatment increases the risk of severe exacerbations and asthma death. GINA recommends ICS-containing therapy for all adults and adolescents."},{id:"c",text:"Start a long-acting β2-agonist alone",why:"LABA without ICS increases asthma mortality and is contraindicated."}],explain:{reasoning:"Asthma is inflammatory, so all patients need anti-inflammatory therapy. ICS–formoterol as needed (or as maintenance and reliever) reduces severe exacerbations compared with SABA alone.",takeaway:"Never treat asthma with a reliever alone."}}],readiness:{understand:["Airflow resistance rises with 1/r⁴, so modest narrowing from muscle, oedema or mucus causes large symptoms.","Asthma: type 2 (eosinophilic) inflammation and hyper-responsive smooth muscle → variable, largely reversible obstruction; ICS is the foundation.","COPD: smoke-driven neutrophilic inflammation, small-airway disease and emphysema → persistent obstruction; loss of tethering causes air trapping and hyperinflation.","Spirometry: FEV1/FVC < 0.7 (or < LLN) = obstruction; COPD requires post-BD ratio < 0.7; significant BD response supports asthma.","Bronchiectasis is permanent bronchial dilatation with chronic purulent sputum, diagnosed on HRCT."],listenFor:["How your lecturer uses GOLD groups (A, B, E) and blood eosinophils to choose COPD inhalers.","The GINA treatment tracks and why SABA-only treatment is no longer recommended.","Severity criteria for acute asthma and COPD exacerbations, and indications for NIV."],questions:["Why might a patient with COPD feel much less breathless after a bronchodilator even though their FEV1 barely changes?","If both asthma and COPD cause wheeze, what single test result most helps you tell them apart, and what are its limits?"],connection:"A smoker with breathlessness on the stairs and a yo t:"I have been coughing for six weeks, I sweat at night and my trousers are loose. This morning there was blood in my sputum.",vitals:[{label:"HR",value:"102 /min"},{label:"BP",value:"118/72"},{label:"RR",value:"22 /min"},{label:"Temp",value:"38.1 °C"},{label:"SpO₂",value:"95% air"},{label:"Weight",value:"58 kg (was 65)"}],historyBudget:7,history:[{id:"cough",label:"Cough: duration, sputum, blood",result:"Productive cough for 6 weeks, yellow sputum, streaks of blood twice this week.",relevance:"key",note:"Cough ≥ 2 weeks is the classic TB screening trigger; haemoptysis suggests cavitation."},{id:"constit",label:"Fever, night sweats, weight loss",result:"Evening fevers, drenching night sweats, lost about 7 kg in two months.",relevance:"key",note:"Constitutional symptoms from TNF-α and other cytokines released by granulomatous inflammation."},{id:"contact",label:"TB contacts and living conditions",result:"A co-worker was treated for TB last year. Crowded, poorly ventilated room at home.",relevance:"key",note:"Close, prolonged contact in poorly ventilated spaces drives transmission."},{id:"hiv",label:"HIV risk, previous HIV test",result:"Never tested. No known risk, but open to testing.",relevance:"key",note:"Every person with TB should be offered an HIV test: HIV changes risk, presentation and management."},{id:"prev",label:"Previous TB treatment",result:"Never treated for TB.",relevance:"key",note:"Previous treatment is a major risk factor for drug resistance."},{id:"dm",label:"Diabetes, smoking, alcohol, steroids",result:"Smokes 5 cigarettes a day; drinks at weekends. No diabetes known, no steroids.",relevance:"useful",note:"Smoking, alcohol, diabetes and immunosuppression all raise the risk of active TB."},{id:"extra",label:"Back pain, neck swelling, headache",result:"None.",relevance:"useful",note:"Screens for spinal, nodal and meningeal TB."},{id:"travel",label:"Recent foreign travel",result:"No travel outside the region.",relevance:"low"},{id:"diet",label:"Diet and favourite foods",result:"Eats normally, but appetite has dropped.",relevance:"low"}],examBudget:4,exam:[{id:"gen",label:"General: wasting, pallor, lymph nodes",result:"Thin, mildly pale. No palpable cervical or axillary lymph nodes.",relevance:"key",note:"Lymphadenopathy would point toward nodal TB or HIV."},{id:"chest",label:"Chest: expansion, percussion, auscultation",result:"Slightly reduced expansion at the right apex; bronchial breathing and coarse crackles over the right upper zone.",relevance:"key",note:"Upper-zone signs fit post-primary (reactivation) TB."},{id:"hands",label:"Hands: clubbing",result:"No clubbing.",relevance:"useful",note:"Clubbing is uncommon in TB; consider bronchiectasis, empyema or cancer."},{id:"mouth",label:"Mouth: oral thrush, candidiasis",result:"No oral thrush.",relevance:"useful",note:"Oral candidiasis hints at HIV-related immunosuppression."},{id:"abdo",label:"Abdomen: liver, spleen, ascites",result:"Soft, no organomegaly.",relevance:"low"},{id:"eyes",label:"Fundoscopy",result:"Normal.",relevance:"low",note:"Choroidal tubercles are rare and mainly seen in miliary TB."}],investigations:[{id:"xpert",label:"Sputum Xpert MTB/RIF Ultra",result:"MTB detected (medium). Rifampicin resistance not detected.",relevance:"key",note:"WHO-recommended initial test: confirms TB and screens for rifampicin resistance within about 2 hours."},{id:"cxr",label:"Chest X-ray",result:"Right upper lobe consolidation with a 3 cm thick-walled cavity. No effusion.",relevance:"key",note:"Classic post-primary pattern. CXR supports, but does not confirm, TB."},{id:"hivt",label:"HIV test",result:"Negative.",relevance:"key",note:"Routine for every person with presumptive or confirmed TB."},{id:"smear",label:"Sputum smear microscopy (Ziehl–Neelsen)",result:"Acid-fast bacilli seen (2+).",relevance:"useful",note:"Cheap and fast; positivity marks high infectiousness and is used to monitor response."},{id:"culture",label:"Sputum culture and drug-susceptibility testing",result:"Pending (liquid culture takes 1–6 weeks).",relevance:"useful",note:"Gold standard; gives full susceptibility results."},{id:"lft",label:"Baseline LFTs, creatinine, glucose",result:"ALT 28 U/L, bilirubin normal, creatinine 74 µmol/L, HbA1c 5.4%.",relevance:"useful",note:"Baselines before hepatotoxic drugs; diabetes screening."},{id:"igra",label:"IGRA or tuberculin skin test",result:"IGRA positive.",relevance:"low",note:"IGRA/TST show immune memory of infection; they cannot distinguish latent from active TB and are not used to diagnose active disease."},{id:"ct",label:"CT chest",result:"Cavitating right upper lobe consolidation with tree-in-bud nodules.",relevance:"low",note:"Not needed when CXR and Xpert already answer the question."},{id:"bronch",label:"Bronchoscopy with lavage",result:"Not needed: sputum already positive.",relevance:"harmful",note:"Invasive, aerosol-generating, and unnecessary when sputum is diagnostic."}],differentials:[{id:"tb",name:"Pulmonary tuberculosis",note:"Subacute cough, night sweats, weight loss, haemoptysis, upper-lobe cavity, TB contact; confirmed by Xpert."},{id:"ca",name:"Lung cancer",note:"Smoker with haemoptysis and weight loss; cavitating squamous carcinoma can mimic TB. Less likely at 34; microbiology answers it."},{id:"abscess",name:"Lung abscess",note:"Usually follows aspiration; air–fluid level in a dependent segment, foul sputum."},{id:"cap",name:"Bacterial pneumonia",note:"Acute onset over days; would not explain six weeks of weight loss."},{id:"ntm",name:"Non-tuberculous mycobacteria",note:"Can look identical; Xpert MTB/RIF is specific for M. tuberculosis complex."},{id:"fungal",name:"Chronic fungal infection (e.g. aspergillosis)",note:"Often colonises old TB cavities rather than causing the first illness."}],diagnosis:"tb",reasoning:[{id:"r1",text:"Subacute cough with constitutional symptoms, a TB contact, an upper-lobe cavity and a positive Xpert confirm rifampicin-susceptible pulmonary TB.",correct:!0},{id:"r2",text:"The positive IGRA confirms active TB.",why:"IGRA shows immune memory of infection, positive in latent and active TB alike. Active TB is confirmed microbiologically (Xpert, smear, culture)."},{id:"r3",text:"The cavity on the X-ray is enough to diagnose TB without sputum tests.",why:"Cavities also occur in cancer, abscess, NTM and fungal disease. Microbiological confirmation and drug-resistance testing are essential."},{id:"r4",text:"Haemoptysis in a smoker means cancer until proven otherwise, so TB is unlikely.",why:"Cancer must be considered, but at 34 with a TB contact and a positive Xpert the diagnosis is TB."}],debrief:{summary:"Mr A. has bacteriologically confirmed, rifampicin-susceptible pulmonary TB with an upper-lobe cavity. He is highly infectious (smear-positive), and his wife, children and co-workers are contacts.",redFlags:["Massive haemoptysis (eroded vessel or Rasmussen aneurysm)","Headache, confusion or neck stiffness (TB meningitis)","Back pain with leg weakness (spinal TB compressing the cord)","Breathlessness and hypoxia (miliary TB or large effusion)","Jaundice or vomiting on treatment (drug-induced hepatitis)"],management:["Standard regimen for drug-susceptible TB: 2 months isoniazid, rifampicin, pyrazinamide and ethambutol (2HRZE), then 4 months isoniazid and rifampicin (4HR). WHO also allows a 4-month rifapentine–moxifloxacin regimen (2HPZM/2HPM) for people aged 12 and over.","Pyridoxine with isoniazid to prevent neuropathy; check visual acuity and colour vision for ethambutol; warn about orange urine with rifampicin and its drug interactions.","Notify the TB programme; airborne precautions until on effective treatment and clinically improving; trace and screen household and work contacts, offering TB preventive treatment where indicated.","Adherence support (DOT or video-observed therapy, social and nutritional support); repeat sputum at the end of the intensive phase and later per programme protocol."],takeaway:"Diagnose active TB microbiologically (Xpert first), test for rifampicin resistance and HIV, then treat for at least 4–6 months while protecting contacts."}},questions:[{id:"t1",kind:"hotspot",level:1,view:"lungs",answer:"apex",concept:"Post-primary TB site",twin:"t1b",prompt:"Tap the region where reactivation (post-primary) TB typically forms cavities.",hint:"Think about where oxygen tension is highest.",explain:{reasoning:"Apical and posterior segments of the upper lobes have a high ventilation-to-perfusion ratio, so alveolar oxygen is highest there. The aerobic bacillus thrives, and relatively poor lymphatic clearance helps it persist.",chain:["High V/Q at apex","↑ Alveolar O₂","Aerobic bacilli multiply","Caseation → cavity"],takeaway:"Upper-lobe cavity in a person with cough and weight loss: think TB."}},{id:"t1b",kind:"hotspot",level:1,view:"lungs",answer:"ghon",concept:"Primary TB site",prompt:"Tap the usual site of the Ghon focus in primary infection.",explain:{reasoning:"Inhaled droplet nuclei follow airflow, which is greatest to the mid and lower zones, so the first focus of primary infection is usually subpleural in the lower part of the upper lobe or upper part of the lower lobe.",takeaway:"Primary TB: lower/mid zone focus + hilar nodes. Post-primary TB: apices."}},{id:"t2",kind:"hotspot",level:1,view:"granuloma",answer:"giant",concept:"Granuloma histology",prompt:"Tap the Langhans giant cell.",explain:{reasoning:"Langhans giant cells form when activated macrophages fuse. Their nuclei sit in a horseshoe at the periphery of the cell.",takeaway:"Caseating granuloma with Langhans giant cells and acid-fast bacilli is the histological picture of TB."}},{id:"t3",kind:"match",level:1,concept:"Key terms",prompt:"Match each term to its meaning.",pairs:[{left:"Ghon complex",right:"Primary lung focus plus involved hilar lymph nodes"},{left:"Latent TB infection",right:"Persistent immune response to TB without active disease; not infectious"},{left:"Miliary TB",right:"Haematogenous spread producing countless tiny nodules"},{left:"Pott disease",right:"Tuberculous spondylitis (spinal TB)"}],explain:{reasoning:"These terms trace the natural history: primary infection (Ghon complex) is usually contained (latent infection), but bacilli can spread through blood (miliary TB) or seed distant sites like the spine (Pott disease).",takeaway:"Know the vocabulary: your lecturer will use it."}},{id:"t4",kind:"mcq",level:1,concept:"Transmission",prompt:"How is pulmonary TB transmitted?",options:[{id:"a",text:"Airborne droplet nuclei expelled when a person with pulmonary TB coughs, sings or speaks",correct:!0},{id:"b",text:"Contact with contaminated surfaces and shared utensils",why:"Fomites play essentially no role. TB is airborne."},{id:"c",text:"Faecal–oral route",why:"Ingestion of unpasteurised milk can transmit M. bovis, but human pulmonary TB spreads through the air."}],explain:{reasoning:"Droplet nuclei of 1–5 µm stay suspended for hours and reach the alveoli. A few bacilli can establish infection. Ventilation, sunlight and early treatment reduce transmission.",takeaway:"TB is airborne: ventilation and early effective treatment are the strongest controls."}},{id:"t5",kind:"order",level:2,concept:"Pathogenesis",prompt:"Put the steps of TB pathogenesis in order.",items:["Droplet nuclei are inhaled and reach the alveoli","Alveolar macrophages ingest bacilli, which survive by blocking phagolysosome fusion","Bacilli multiply and spread to hilar nodes (and silently via the blood)","Th1 cells release IFN-γ, activating macrophages","A caseating granuloma walls off the infection","Weakened immunity years later allows reactivation and cavitation"],explain:{reasoning:"Cell-mediated immunity takes 3–8 weeks to develop; before that, bacilli multiply and disseminate. Once Th1 immunity forms, granulomas contain infection, often for life. Anything that weakens Th1 or TNF-α responses allows reactivation.",chain:["Inhalation","Macrophage survival","Dissemination","Th1 / IFN-γ","Granuloma","Reactivation if immunity falls"],takeaway:"The granuloma is a stalemate, not a cure."}},{id:"t6",kind:"classify",level:2,concept:"Latent vs active TB",twin:"t6b",prompt:"Sort each finding: latent TB infection or active TB disease?",buckets:["Latent infection","Active disease"],items:[{text:"Positive IGRA, normal CXR, no symptoms",bucket:0},{text:"Sputum Xpert positive",bucket:1},{text:"Not infectious to others",bucket:0},{text:"Night sweats and weight loss",bucket:1},{text:"Treated with preventive therapy (e.g. 3HP or 6H)",bucket:0},{text:"Treated with a multi-drug regimen for ≥ 4–6 months",bucket:1}],explain:{reasoning:"Latent infection: immune evidence of infection only (IGRA/TST), no symptoms, normal imaging, no bacilli in sputum. Active disease: symptoms, imaging changes and/or microbiological confirmation.",takeaway:"Always exclude active TB before starting preventive therapy, or you risk monotherapy and resistance."}},{id:"t6b",kind:"mcq",level:2,concept:"Latent vs active TB",prompt:"A healthy contact has a positive IGRA and a normal chest X-ray with no symptoms. What does this mean?",options:[{id:"a",text:"Probable latent TB infection: consider preventive treatment",correct:!0},{id:"b",text:"Active TB: start 2HRZE/4HR",why:"No symptoms, normal CXR and no microbiological evidence: this is not active disease."},{id:"c",text:"A false positive, so no action is needed",why:"IGRA is specific for M. tuberculosis complex (not affected by BCG). The contact likely has latent infection."}],explain:{reasoning:"IGRA measures IFN-γ release by T cells exposed to TB-specific antigens (ESAT-6, CFP-10). It shows infection, not disease.",takeaway:'IGRA/TST answer "infected?"; Xpert/culture answer "active disease?".'}},{id:"t7",kind:"match",level:2,concept:"Drug toxicity",prompt:"Match each drug to its key adverse effect.",pairs:[{left:"Isoniazid",right:"Peripheral neuropathy (prevent with pyridoxine) and hepatitis"},{left:"Rifampicin",right:"Orange body fluids and many drug interactions (enzyme inducer)"},{left:"Pyrazinamide",right:"Hepatotoxicity and hyperuricaemia (gout)"},{left:"Ethambutol",right:"Optic neuritis: red–green colour vision loss"}],explain:{reasoning:"Isoniazid depletes pyridoxine. Rifampicin induces cytochrome P450, reducing levels of contraceptives, warfarin and some antiretrovirals. Pyrazinamide reduces urate excretion. Ethambutol is toxic to the optic nerve, so check vision.",takeaway:"Three of the four first-line drugs are hepatotoxic: isoniazid, rifampicin, pyrazinamide."}},{id:"t8",kind:"mcq",level:2,deep:!0,concept:"Immunology",prompt:"Why do TNF-α inhibitors (e.g. infliximab) raise the risk of TB reactivation?",options:[{id:"a",text:"TNF-α is needed to form and maintain granulomas",correct:!0},{id:"b",text:"They block antibody production against TB",why:"Protection against TB is cell-mediated, not antibody-mediated."},{id:"c",text:"They directly stimulate mycobacterial growth",why:"They act on host immunity, not on the bacteria."}],explain:{reasoning:"TNF-α recruits cells and holds the granuloma together. Blocking it lets the structure break down and dormant bacilli multiply. Screen for latent TB (IGRA ± CXR) before starting biologics.",takeaway:"Before biologics or long-term steroids: screen for latent TB."}},{id:"t9",kind:"mcq",level:3,concept:"Diagnostic test choice",stem:"A 40-year-old has had cough, fever and weight loss for 5 weeks. CXR shows right upper lobe infiltrates.",prompt:"Which is the best initial diagnostic test?",options:[{id:"a",text:"Sputum Xpert MTB/RIF (Ultra)",correct:!0},{id:"b",text:"IGRA",why:"IGRA cannot distinguish latent from active TB and is not a diagnostic test for active disease."},{id:"c",text:"CT chest",why:"Imaging supports but does not confirm TB, and gives no resistance information."},{id:"d",text:"Wait for sputum culture before any other test",why:"Culture is the gold standard but takes weeks; start with a rapid molecular test and send culture alongside."}],explain:{reasoning:"WHO recommends a rapid molecular test such as Xpert MTB/RIF Ultra as the initial test for presumptive TB. It detects M. tuberculosis DNA and rifampicin-resistance mutations (rpoB) in about 2 hours.",takeaway:"Presumptive TB: Xpert first, plus culture and an HIV test."}},{id:"t10",kind:"mcq",level:3,concept:"TB meningitis",stem:"A 26-year-old with HIV has 2 weeks of headache, fever and now confusion. CSF results:",labs:[{name:"Opening pressure",value:"28",unit:"cmH₂O",ref:"10–20",flag:"H"},{name:"WCC",value:"250",unit:"/µL",ref:"< 5",flag:"H"},{name:"Lymphocytes",value:"85%",flag:"!"},{name:"Protein",value:"2.4",unit:"g/L",ref:"0.15–0.45",flag:"H"},{name:"CSF:serum glucose",value:"0.25",ref:"> 0.6",flag:"L"}],prompt:"What is the most likely diagnosis?",options:[{id:"a",text:"Tuberculous meningitis",correct:!0},{id:"b",text:"Viral meningitis",why:"Viral meningitis is lymphocytic, but glucose is normal and protein only mildly raised."},{id:"c",text:"Acute bacterial meningitis",why:"Bacterial meningitis is usually acute (hours to days) with neutrophils predominating."}],explain:{reasoning:"Subacute onset, lymphocytes, very high protein and low glucose are the classic CSF picture of TB meningitis. Cryptococcal meningitis is the main alternative in HIV, so send CSF cryptococcal antigen too. Treat TB meningitis with longer therapy plus adjunctive corticosteroids.",takeaway:"Lymphocytes + high protein + low glucose + subacute = TB meningitis until proven otherwise."}},{id:"t11",kind:"mcq",level:3,concept:"Pleural TB",stem:"A 24-year-old has a 3-week fever and a moderate left pleural effusion. Pleural fluid: exudate, lymphocytes 90%, ADA 72 U/L. Sputum Xpert negative.",prompt:"What is the most likely diagnosis?",options:[{id:"a",text:"Tuberculous pleuritis",correct:!0},{id:"b",text:"Parapneumonic effusion",why:"Parapneumonic effusions are usually neutrophil-predominant."},{id:"c",text:"Heart failure",why:"Heart failure gives a transudate."}],explain:{reasoning:"TB pleuritis is a delayed hypersensitivity reaction to few bacilli, so fluid is often smear- and culture-negative. A lymphocytic exudate with high adenosine deaminase in a young person from a high-burden setting strongly suggests TB; pleural biopsy has the highest yield.",takeaway:"Lymphocytic exudate + high ADA in a young adult: think pleural TB."}},{id:"t12",kind:"mcq",level:3,deep:!0,concept:"Drug-resistant TB",stem:"Xpert on a patient previously treated for TB shows: MTB detected, rifampicin resistance DETECTED.",prompt:"What is the next step?",options:[{id:"a",text:"Treat as rifampicin-resistant TB with a WHO-recommended regimen (e.g. 6-month BPaLM) and send further drug-susceptibility testing",correct:!0},{id:"b",text:"Start the standard 2HRZE/4HR regimen",why:"Rifampicin is the backbone of first-line therapy; using it in resistant disease leads to failure and amplifies resistance."},{id:"c",text:"Add streptomycin to the standard regimen",why:"Adding a single drug to a failing regimen breeds more resistance; injectables are no longer preferred."}],explain:{reasoning:"Rifampicin resistance usually accompanies isoniazid resistance (MDR-TB). WHO recommends the all-oral 6-month BPaLM regimen (bedaquiline, pretomanid, linezolid, moxifloxacin) for most people aged 14 and over with MDR/RR-TB; fluoroquinolone resistance testing determines whether moxifloxacin is kept.",takeaway:"Rifampicin resistance changes everything: never add a single drug to a failing regimen."}}],readiness:{understand:["TB is airborne: droplet nuclei reach alveoli, macrophages fail to kill the bacilli, and Th1/IFN-γ and TNF-α build a granuloma that usually contains, but rarely clears, infection.","Primary TB involves the mid/lower zones and hilar nodes (Ghon complex); post-primary TB favours the oxygen-rich apices and cavitates.","Latent infection (IGRA/TST positive, no disease, not infectious) differs from active TB (symptoms, imaging, microbiology).","Diagnosis of active TB is microbiological: Xpert MTB/RIF Ultra first (with rifampicin resistance), smear, culture and DST, plus an HIV test.","Drug-susceptible TB is treated with 2HRZE/4HR (or a WHO 4-month option), with monitoring for hepatotoxicity, neuropathy and optic neuritis, and with contact tracing."],listenFor:["The local national TB programme algorithm: which test is used first and how results are reported.","How extrapulmonary TB (lymph node, pleural, spinal, meningeal, abdominal) is sampled and how long it is treated.","TB–HIV integration: when to start antiretroviral therapy after TB treatment begins, and the IRIS risk."],questions:["Why does extrapulmonary TB often give negative smears and cultures, and how does that change the diagnostic approach?","If a granuloma usually contains TB, why can someone develop active TB decades after infection, and what clinical conditions raise that risk?"],connection:"The man with six weeks of cough, the young woman with a lymphocytic pleural effusion and the confused HIV-positive patient all have the same organism. Where it lands and how strong host immunity is determine the presentation, the sample you take and the length of treatment."},recap:[{q:"Mode of transmission?",a:"Airborne droplet nuclei (1–5 µm)."},{q:"Why the apices in reactivation?",a:"Highest V/Q → highest O₂ for an aerobic bacillus."},{q:"Ghon complex?",a:"Primary lung focus + hilar node involvement."},{q:"Key cytokines for the granuloma?",a:"IFN-γ (Th1) and TNF-α."},{q:"IGRA tells you?",a:"Infection, not whether disease is active."},{q:"First test for presumptive TB?",a:"Xpert MTB/RIF (Ultra): TB + rifampicin resistance."},{q:"Standard regimen?",a:"2HRZE / 4HR."},{q:"Ethambutol toxicity?",a:"Optic neuritis (colour vision)."},{q:"TB meningitis CSF?",a:"Lymphocytes, high protein, low glucose."}],references:[{label:"World Health Organization. WHO consolidated guidelines on tuberculosis. Module 3: Diagnosis – rapid diagnostics for tuberculosis detection (2024 update)."},{label:"World Health Organization. WHO consolidated guidelines on tuberculosis. Module 4: Treatment and care (2025).",note:"drug-susceptible and drug-resistant regimens; check the latest version"},{label:"World Health Organization. WHO consolidated guidelines on tuberculosis. Module 1: Prevention – tuberculosis preventive treatment (2024)."},{label:"Nahid P et al. Official ATS/CDC/IDSA Clinical Practice Guidelines: Treatment of Drug-Susceptible Tuberculosis. Clin Infect Dis 2016."},{label:"Kumar V, Abbas AK, Aster JC. Robbins & Cotran Pathologic Basis of Disease",note:"granuloma pathology"},{label:"Davidson’s Principles and Practice of Medicine; Kumar & Clark’s Clinical Medicine",note:"clinical features (reference priority)"},{label:"Your national TB programme guidelines",note:"local algorithms take precedence in your clinical setting"}],modelNote:"The bacillus journey and reactivation simulation are simplified teaching models, not quantitative predictions. Chest X-ray films are drawn illustrations of typical patterns, not real radiographs."},Wl=[Zp,rm,pm,vm,Am,Rm,Wm],zm={liver:"liver",gerd:"stomach",diarrhoea:"intestine",pancreas:"pancreas",respexam:"chest",obstructive:"airways",tb:"tb"};function tu(){const r=location.hash.replace("#","");return{id:Wl.some(p=>p.id===r)?r:null}}function Gm(){const{state:r,toasts:p}=xt(),[o,u]=L.useState(()=>({...tu(),n:0}));L.useEffect(()=>{const f=()=>u(b=>({...tu(),n:b.n+1}));return window.addEventListener("hashchange",f),()=>window.removeEventListener("hashchange",f)},[]);const c=(f,b)=>{u(w=>({id:f,stage:b&&Ke.some(x=>x.id===b)?b:void 0,n:w.n+1}));try{history.replaceState(null,"",`#${f}`)}catch{}window.scrollTo({top:0})},d=()=>{u(f=>({id:null,n:f.n+1}));try{history.replaceState(null,"",location.pathname+location.search)}catch{}window.scrollTo({top:0})},h=Wl.find(f=>f.id===o.id),g=Math.floor(r.xp/250)+1;return a.jsxs("div",{className:"min-h-full",children:[a.jsx("header",{className:"sticky top-0 z-30 border-b border-white/[0.06] bg-navy-950/85 backdrop-b
