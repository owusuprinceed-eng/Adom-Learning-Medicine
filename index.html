 and eyes",result:"Excoriation marks on forearms and shins. Xanthelasma around both eyes. No jaundice.",relevance:"key",note:"Xanthelasma reflect the hypercholesterolaemia of cholestasis."},{id:"stig",label:"Stigmata of chronic liver disease",result:"No spider naevi, palmar erythema, gynaecomastia or asterixis.",relevance:"key",note:"Absence suggests no established cirrhosis yet."},{id:"abdo",label:"Abdomen: liver, spleen, ascites",result:"Liver edge palpable 2 cm, smooth, non-tender. No splenomegaly, no shifting dullness.",relevance:"key"},{id:"thyroid",label:"Thyroid examination",result:"Small diffuse goitre, no nodules.",relevance:"useful"},{id:"murphy",label:"Murphy’s sign",result:"Negative.",relevance:"low"}],investigations:[{id:"lft",label:"Liver blood tests",result:"Cholestatic pattern: R ≈ 0.4.",labs:[{name:"ALP",value:"410",unit:"U/L",ref:"30–130",flag:"H"},{name:"GGT",value:"320",unit:"U/L",ref:"< 40",flag:"H"},{name:"ALT",value:"58",unit:"U/L",ref:"< 40",flag:"H"},{name:"Bilirubin",value:"16",unit:"µmol/L",ref:"< 21",flag:"N"},{name:"Albumin",value:"40",unit:"g/L",ref:"35–50",flag:"N"}],relevance:"key",note:"Defines the pattern and reveals preserved synthetic function."},{id:"us",label:"Abdominal ultrasound",result:"Normal-sized liver, normal echotexture. Intra- and extrahepatic ducts NOT dilated (CBD 4 mm). No gallstones, no focal lesion.",relevance:"key",note:"First test in cholestasis: excludes extrahepatic obstruction."},{id:"ama",label:"Anti-mitochondrial antibody (AMA)",result:"Positive, titre 1:320 (anti-M2).",relevance:"key",note:"AMA + cholestatic ALP is enough to diagnose PBC without biopsy."},{id:"igs",label:"Immunoglobulins",result:"IgM 4.1 g/L (0.4–2.3) raised; IgG normal.",relevance:"useful",note:"Raised IgM supports PBC; high IgG would point toward AIH or overlap."},{id:"inr",label:"INR and platelets",result:"INR 1.0; platelets 240 ×10⁹/L.",relevance:"useful",note:"Normal platelets and INR argue against cirrhosis/portal hypertension."},{id: g a biopsy.",correct:!0},{id:"r2",text:"The raised ALT shows this is hepatitis, so autoimmune hepatitis is most likely.",why:"ALT is only mildly raised while ALP and GGT dominate. The R ratio is about 0.4: cholestatic. AIH would also usually have a high IgG."},{id:"r3",text:"Cholestasis always means a blocked bile duct, so ERCP is the next step.",why:"Normal-calibre ducts on ultrasound point to intrahepatic cholestasis. ERCP is invasive and not diagnostic here."},{id:"r4",text:"Pruritus with xanthelasma means familial hypercholesterolaemia.",why:"The high cholesterol is secondary to cholestasis, and the itch is a cholestatic symptom."}],debrief:{summary:"Mrs O. has primary biliary cholangitis: autoimmune destruction of small intrahepatic bile ducts. Retained bile constituents explain the itch, cholesterol rise and xanthelasma. Her normal bilirubin, albumin, INR and platelets suggest early disease.",redFlags:["Rising bilirubin (marks advanced PBC)","Signs of portal hypertension: splenomegaly, low platelets, varices","Fever and RUQ pain with cholestasis (cholangitis)","Encephalopathy or coagulopathy (liver failure)"],management:["Ursodeoxycholic acid 13–15 mg/kg/day, lifelong; assess biochemical response at 12 months.","Second-line for inadequate response: obeticholic acid or PPAR agonists (e.g. bezafibrate, elafibranor, seladelpar), depending on availability.","Pruritus: cholestyramine first-line; rifampicin, naltrexone or sertraline as alternatives.","Bone density (osteoporosis risk), fat-soluble vitamins, thyroid screening; transplant for end-stage disease."],takeaway:"Cholestatic LFTs → ultrasound first. Ducts normal → think intrahepatic: AMA for PBC, MRCP for PSC, drug history for DILI."}},questions:[{id:"l1",kind:"hotspot",level:1,view:"lobule",answer:"cv",concept:"Lobule anatomy",prompt:"Tap the vessel that drains blood out of the lobule.",explain:{reasoning:"Blood from the portal vein and hepatic artery mixes in the sinusoids and drains centrally into the central vein, then hepatic veins and IVC.",science:"Hepatocytes nearest the central vein (zone 3) receive the least oxygen, so they suffer first in hypoxia, paracetamol toxicity and MASH.",takeaway:"Zone 3 = last in line for oxygen = first to be injured."}},{id:"l2",kind:"match",level:1,concept:"Normal liver function",prompt:"Match the liver function to what you see when it fails.",pairs:[{left:"Albumin synthesis",right:"Oedema and ascites"},{left:"Clotting factor synthesis",right:"Prolonged INR"},{left:"Bilirubin conjugation and excretion",right:"Jaundice"},{left:"Ammonia → urea",right:"Hepatic encephalopathy"},{left:"Hormone (oestrogen) metabolism",right:"Spider naevi, gynaecomastia"}],explain:{reasoning:"Each clinical sign of liver failure is the loss of a normal function.",takeaway:"Read liver failure as a list of missing jobs. Albumin and INR measure synthetic function; ALT and ALP do not."}},{id:"l3",kind:"classify",level:1,concept:"Hepatocellular vs cholestatic",twin:"l3b",prompt:"Sort these features by the liver-test pattern they suggest.",buckets:["Hepatocellular","Cholestatic"],items:[{text:"ALT 900 U/L, ALP normal",bucket:0},{text:"ALP and GGT raised, ALT near normal",bucket:1},{text:"Anti-mitochondrial antibody positive",bucket:1},{text:"Anti-smooth muscle antibody, high IgG",bucket:0},{text:"Beaded bile ducts on MRCP",bucket:1},{text:"Paracetamol overdose",bucket:0}],explain:{reasoning:"Hepatocyte injury releases transaminases (ALT, AST). Bile duct injury or obstruction raises ALP and GGT. AIH and toxic injury are hepatocellular; PBC and PSC are cholestatic.",takeaway:"ALT points to the hepatocyte; ALP + GGT point to the bile ducts."}},{id:"l3b",kind:"mcq",level:1,concept:"Hepatocellular vs cholestatic",prompt:"ALP is raised but GGT is normal. Where is the ALP most likely coming from?",options:[{id:"a",text:"Bone (e.g. growth, Paget’s, metastases, healing fracture)",correct:!0},{id:"b",text:"Bile ducts",why:"Biliary ALP rises with GGT. A normal GGT makes a biliary source unlikely."},{id:"c",text:"Hepatocytes",why:"Hepatocyte injury raises ALT/AST, not isolated ALP."}],explain:{reasoning:"GGT confirms a hepatobiliary source of ALP. Isolated ALP with normal GGT suggests bone (or placenta in pregnancy).",takeaway:"Use GGT to check whether a raised ALP is really from the liver."}},{id:"l4",kind:"mcq",level:1,concept:"MASLD definition",prompt:"Which statement best defines MASLD?",options:[{id:"a",text:"Hepatic steatosis plus at least one cardiometabolic risk factor, without another cause",correct:!0},{id:"b",text:"Any fatty liver in a patient who drinks no alcohol at all",why:"The new definition is positive: it requires a cardiometabolic risk factor (e.g. raised BMI/waist, dysglycaemia, hypertension, dyslipidaemia). Small amounts of alcohol are allowed."},{id:"c",text:"Liver inflammation with ballooning on biopsy",why:"That describes MASH (steatohepatitis), the progressive subtype."}],explain:{reasoning:"MASLD (metabolic dysfunction-associated steatotic liver disease) replaced NAFLD in the 2023 multisociety nomenclature. It requires steatosis plus ≥ 1 of five cardiometabolic criteria.",takeaway:"MASLD = fat + metabolic risk. MASH = fat + injury (ballooning, inflammation)."}},{id:"l5",kind:"order",level:2,concept:"MASLD progression",prompt:"Order the steps from insulin resistance to cirrhosis.",items:["Insulin resistance increases fatty acid delivery to the liver","Triglyceride accumulates in hepatocytes (steatosis)","Lipotoxicity injures hepatocytes (ballooning, inflammation)","Kupffer cells release TGF-β","Stellate cells become myofibroblasts and lay down collagen","Bridging fibrosis and regenerative nodules (cirrhosis)"],explain:{reasoning:"Fat itself is fairly inert; lipotoxic injury and the inflammation it triggers activate stellate cells, which produce the scar.",chain:["Insulin resistance","Steatosis","Lipotoxic injury","Inflammation","Stellate activation","Fibrosis"],takeaway:"Fibrosis stage, not fat or ALT level, predicts liver outcomes in MASLD."}},{id:"l6",kind:"mcq",level:2,concept:"Cholestatic pruritus",prompt:"Why does cholestasis cause pruritus?",options:[{id:"a",text:"Substances normally excreted in bile accumulate and act on itch pathways (bile acids and lysophosphatidic acid via autotaxin are implicated)",correct:!0},{id:"b",text:"High bilirubin deposits in the skin and causes itch",why:"Bilirubin causes jaundice, not itch. Many itchy PBC patients have a normal bilirubin, as in this module’s case."},{id:"c",text:"Histamine release from liver mast cells",why:"Cholestatic itch responds poorly to antihistamines, which argues against histamine as the main mediator."}],explain:{reasoning:"Retained pruritogens act on sensory nerves. Bile acids and the autotaxin–lysophosphatidic acid pathway are the best-supported mediators, but the full mechanism is not settled.",chain:["Impaired bile flow","Retained pruritogens","Activation of itch nerves","Pruritus (palms, soles, night)"],takeaway:"Itch can precede jaundice by years. Bilirubin level does not predict itch."}},{id:"l7",kind:"mcq",level:2,concept:"Portal hypertension",prompt:"In cirrhosis, why does the platelet count fall?",options:[{id:"a",text:"Portal hypertension causes splenomegaly and platelet sequestration, and the liver makes less thrombopoietin",correct:!0},{id:"b",text:"The liver normally produces platelets",why:"Platelets come from megakaryocytes in the bone marrow; the liver makes thrombopoietin, which stimulates them."},{id:"c",text:"Varices consume platelets by constant bleeding",why:"Bleeding can lower platelets acutely, but chronic thrombocytopenia in cirrhosis is mainly sequestration and low thrombopoietin."}],explain:{reasoning:"Increased resistance in a fibrotic liver raises portal pressure; the spleen enlarges and pools platelets. Reduced hepatic thrombopoietin adds to it.",takeaway:"A low platelet count is one of the earliest blood clues to cirrhosis, which is why it is in FIB-4."}},{id:"l8",kind:"mcq",level:2,concept:"PSC associations",prompt:"A 28-year-old man with ulcerative colitis has a raised ALP. Which test best confirms the most likely diagnosis?",options:[{id:"a",text:"MRCP",correct:!0},{id:"b",text:"Anti-mitochondrial antibody",why:"AMA is for PBC, which mostly affects middle-aged women and does not alter cholangiography."},{id:"c",text:"Liver biopsy",why:"Biopsy is reserved for suspected small-duct PSC or overlap; MRCP usually establishes the diagnosis."}],explain:{reasoning:"Young man + UC + cholestasis = PSC until proven otherwise. MRCP shows multifocal strictures and dilatations.",science:"PSC raises the risk of cholangiocarcinoma, gallbladder cancer and colorectal cancer, so patients need surveillance.",takeaway:"Cholestasis in a patient with UC: order an MRCP."}},{id:"l9",kind:"mcq",level:2,deep:!0,concept:"AIH immunology",prompt:"Which finding most supports autoimmune hepatitis over viral hepatitis?",options:[{id:"a",text:"Raised IgG with positive anti-smooth muscle antibodies",correct:!0},{id:"b",text:"ALT 800 U/L",why:"Very high ALT occurs in viral, toxic and ischaemic hepatitis as well."},{id:"c",text:"Jaundice",why:"Jaundice is non-specific."}],explain:{reasoning:"AIH is characterised by hypergammaglobulinaemia (raised IgG), autoantibodies (ANA, ASMA, anti-LKM1), interface hepatitis on biopsy and response to steroids; viral serology must be negative.",takeaway:"AIH: hepatocellular pattern + high IgG + autoantibodies + biopsy. It responds dramatically to steroids."}},{id:"l10",kind:"mcq",level:3,concept:"Fibrosis assessment",stem:"A 58-year-old man with type 2 diabetes and BMI 33 has an ultrasound showing a bright liver. AST 46 U/L, ALT 40 U/L, platelets 160 ×10⁹/L.",labs:[{name:"AST",value:"46",unit:"U/L",ref:"< 40",flag:"H"},{name:"ALT",value:"40",unit:"U/L",ref:"< 40",flag:"N"},{name:"Platelets",value:"160",unit:"×10⁹/L",ref:"150–400",flag:"N"}],prompt:"His FIB-4 is about 2.6. What is the most appropriate next step?",options:[{id:"a",text:"Transient elastography (FibroScan) or ELF test",correct:!0},{id:"b",text:"Reassure: ALT is normal so the liver is healthy",why:"ALT can be normal even with advanced fibrosis. Normal ALT does not exclude MASH or fibrosis."},{id:"c",text:"Liver biopsy for everyone with a fatty liver",why:"Biopsy is invasive. Non-invasive tests triage who needs specialist assessment."}],explain:{reasoning:"FIB-4 = (58 × 46) ÷ (160 × √40) ≈ 2.6, in the indeterminate band (1.3–2.67). Guidelines recommend a second-line test such as elastography to stratify fibrosis risk.",takeaway:"Use FIB-4 first, elastography second, and refer if advanced fibrosis is likely."}},{id:"l11",kind:"mcq",level:3,concept:"AIH presentation",stem:"A 22-year-old woman has jaundice and fatigue for 3 weeks. Viral hepatitis A, B, C and E serology is negative. No drugs or alcohol.",labs:[{name:"ALT",value:"960",unit:"U/L",ref:"< 40",flag:"H"},{name:"ALP",value:"160",unit:"U/L",ref:"30–130",flag:"H"},{name:"Bilirubin",value:"88",unit:"µmol/L",ref:"< 21",flag:"H"},{name:"IgG",value:"28",unit:"g/L",ref:"7–16",flag:"H"},{name:"ANA",value:"1:640",flag:"!"},{name:"INR",value:"1.3",ref:"0.8–1.2",flag:"H"}],prompt:"What is the most likely diagnosis and key next step?",options:[{id:"a",text:"Autoimmune hepatitis: liver biopsy and start corticosteroids",correct:!0},{id:"b",text:"Primary biliary cholangitis: start ursodeoxycholic acid",why:"The pattern is hepatocellular (R ≈ 19), not cholestatic, and PBC rarely presents acutely in a 22-year-old."},{id:"c",text:"Gilbert’s syndrome: reassure",why:"Gilbert’s causes isolated unconjugated hyperbilirubinaemia with normal transaminases."}],explain:{reasoning:"Hepatocellular injury, very high IgG, positive ANA and negative viral screen = AIH. Biopsy confirms interface hepatitis; steroids induce remission. A rising INR means urgency: acute severe AIH can progress to liver failure.",takeaway:"Always consider AIH in unexplained hepatitis, especially with high IgG. It is treatable."}},{id:"l12",kind:"mcq",level:3,deep:!0,concept:"Cirrhosis complications",stem:"A man with known MASH cirrhosis has new confusion and constipation. Asterixis is present. No GI bleeding.",prompt:"Which treatment directly addresses the mechanism?",options:[{id:"a",text:"Lactulose (and treat precipitant), adding rifaximin for recurrence",correct:!0},{id:"b",text:"High-dose IV dexamethasone",why:"Hepatic encephalopathy is not due to cerebral oedema from inflammation; steroids do not help."},{id:"c",text:"Strict protein restriction for weeks",why:"Protein restriction worsens sarcopenia and is no longer recommended."}],explain:{reasoning:"Failing hepatocytes and portosystemic shunting let gut-derived ammonia reach the brain. Lactulose acidifies the colon (NH3 → NH4+, trapped) and speeds transit. Constipation, infection, bleeding, electrolytes and sedatives are common precipitants.",chain:["Gut bacteria make NH₃","Failing liver + shunts","NH₃ reaches the brain","Astrocyte swelling","Encephalopathy"],takeaway:"In confusion with cirrhosis, look for the precipitant and give lactulose."}}],readiness:{understand:["The lobule: blood flows inward (portal triad → central vein), bile flows outward. Zone 3 gets the least oxygen and is injured first.","MASLD is steatosis plus a cardiometabolic risk factor; MASH adds lipotoxic injury, which activates stellate cells and drives fibrosis.","Fibrosis stage predicts outcome. FIB-4 (age, AST, ALT, platelets) is the first triage test, followed by elastography.","AIH attacks hepatocytes (hepatocellular pattern, high IgG, ANA/ASMA). PBC destroys small ducts (cholestatic, AMA). PSC strictures large ducts (cholestatic, MRCP beading, UC).","Cholestasis needs an ultrasound first to separate extrahepatic obstruction (dilated ducts) from intrahepatic causes."],listenFor:["Your lecturer’s preferred second-line PBC therapies and how treatment response is judged at 12 months.","How steroid-sparing therapy and remission are defined in autoimmune hepatitis.","Which MASLD patients need specialist referral, and any pharmacological MASH therapy now available locally."],questions:["Why can a patient have cirrhosis with a completely normal ALT?","If PBC and PSC both cause cholestasis, why does only one show abnormal ducts on MRCP?"],connection:"A middle-aged woman with itch and a raised ALP is classic PBC; a young man with ulcerative colitis and raised ALP is classic PSC. Both appear frequently in outpatient clinics and exams."},recap:[{q:"Which zone of the lobule is most vulnerable to hypoxia and MASH?",a:"Zone 3 (pericentral)."},{q:"MASLD in one line?",a:"Steatosis + ≥ 1 cardiometabolic risk factor, no other cause."},{q:"Key fibrogenic cell?",a:"Hepatic stellate cell (becomes a myofibroblast)."},{q:"FIB-4 formula?",a:"(Age × AST) ÷ (platelets × √ALT). < 1.3 low risk; > 2.67 high risk."},{q:"Antibody for PBC?",a:"Anti-mitochondrial antibody (AMA)."},{q:"PSC is associated with?",a:"Ulcerative colitis; cholangiocarcinoma and colorectal cancer risk."},{q:"AIH labs?",a:"Hepatocellular pattern, high IgG, ANA/ASMA (or anti-LKM1)."},{q:"First test in cholestasis?",a:"Abdominal ultrasound for duct dilatation."}],references:[{label:"Rinella ME et al. A multisociety Delphi consensus statement on new fatty liver disease nomenclature. Hepatology / J Hepatol 2023.",note:"MASLD/MASH/MetALD definitions"},{label:"Rinella ME et al. AASLD Practice Guidance on the clinical assessment and management of NAFLD. Hepatology 2023.",note:"FIB-4 → elastography pathway"},{label:"EASL–EASD–EASO Clinical Practice Guidelines on MASLD. J Hepatol 2024."},{label:"Lindor KD et al. Primary Biliary Cholangitis: 2018 Practice Guidance from AASLD. Hepatology 2019."},{label:"EASL Clinical Practice Guidelines: The diagnosis and management of patients with primary biliary cholangitis. J Hepatol 2017."},{label:"Bowlus CL et al. AASLD practice guidance on primary sclerosing cholangitis and cholangiocarcinoma. Hepatology 2023."},{label:"Mack CL et al. Diagnosis and Management of Autoimmune Hepatitis in Adults and Children: 2019 AASLD Practice Guidance. Hepatology 2020."},{label:"Kwo PY et al. ACG Clinical Guideline: Evaluation of Abnormal Liver Chemistries. Am J Gastroenterol 2017.",note:"R ratio, pattern approach"},{label:"Robbins and Cotran Pathologic Basis of Disease; Guyton and Hall",note:"lobule, zonation, fibrosis biology (reference priority)"}],modelNote:"The progression slider is a qualitative model; FIB-4 uses the published formula and cut-offs and is a triage tool, not a diagnosis."},Qe=({x:r,y:p,tx:o,ty:u,t:c,anchor:d="start",show:h})=>h?a.jsxs("g",{children:[a.jsx("path",{className:"label-line",d:`M${r} ${p}L${o} ${u}`}),a.jsx("text",{className:"label",x:o+(d==="start"?3:d==="end"?-3:0),y:u+4,textAnchor:d,children:c})]}):null,gn="M150 0 C150 70 154 150 166 236",Yp="M190 270 C176 252 168 236 164 214 C158 170 152 120 151 70",Jp={id:"gross",name:"Oesophagus → stomach",viewBox:"0 0 420 440",diseaseLabel:"GERD + hiatus hernia",caption:"Anterior view. Normal: the LES and the crural diaphragm overlap to form the anti-reflux barrier. Disease: a sliding hiatus hernia separates them, the LES is hypotonic, and acid refluxes upward.",structures:[{id:"oeso",name:"Oesophagus",fn:"Muscular tube (~25 cm) that moves food by peristalsis. Lined by non-keratinised stratified squamous epithelium, which tolerates friction but not acid.",disease:"Repeated acid and pepsin exposure inflames the distal squamous mucosa (reflux oesophagitis). Chronic injury can heal as columnar intestinal metaplasia (Barrett’s oesophagus).",deep:"Upper third is striated muscle, lower third smooth muscle. Secondary peristalsis and swallowed salivary bicarbonate clear refluxed acid; impaired clearance prolongs acid contact."},{id:"les",name:"Lower oesophageal sphincter",fn:"A 3–4 cm zone of tonically contracted smooth muscle that keeps the GOJ closed at rest and relaxes on swallowing.",disease:"Most GERD episodes happen during transient LES relaxations (TLESRs) not triggered by swallowing. A persistently low resting pressure also lets reflux occur.",deep:"Resting pressure is roughly 10–30 mmHg above gastric pressure. TLESRs are vagally mediated, triggered by gastric distension, and are more frequent after large fatty meals."},{id:"crus",name:"Diaphragmatic crura",fn:"The right crus forms a sling around the oesophageal hiatus. It squeezes the GOJ externally, especially during inspiration and straining: the “external sphincter”.",disease:"In a sliding hiatus hernia the GOJ moves above the crura, so the crural pinch no longer reinforces the LES."},{id:"goj",name:"Gastro-oesophageal junction & Z-line",fn:"Where squamous oesophageal epithelium meets columnar gastric epithelium. The irregular junction line is the Z-line (squamocolumnar junction).",disease:"In Barrett’s oesophagus the Z-line migrates upward as salmon-coloured columnar mucosa replaces squamous mucosa."},{id:"his",name:"Angle of His",fn:"Acute angle between the oesophagus and gastric fundus. It acts like a flap valve: a full fundus presses against the GOJ.",disease:"A hiatus hernia flattens the angle, weakening the flap valve."},{id:"hernia",name:"Hiatus hernia",fn:"Not present in the normal state. Switch to the disease state to see it.",disease:"Sliding hernia: the GOJ and proximal stomach slide through the hiatus into the thorax. It traps an “acid pocket” above the diaphragm that refluxes easily."},{id:"fundus",name:"Fundus",fn:"Dome above the GOJ. Receptive relaxation lets it store a meal at low pressure. Usually contains swallowed air.",deep:"After a meal, a layer of unbuffered acid floats on the food just below the GOJ: the post-prandial “acid pocket”."},{id:"body",name:"Body (corpus)",fn:"Largest region. Its oxyntic glands contain parietal cells (HCl, intrinsic factor) and chief cells (pepsinogen). Rugae let it expand.",disease:"Corpus-predominant H. pylori gastritis can cause atrophy, low acid, gastric ulcers and a higher gastric cancer risk."},{id:"antrum",name:"Antrum",fn:"Grinds and mixes food. Its glands hold G cells (gastrin) and D cells (somatostatin), which regulate acid.",disease:"H. pylori classically colonises the antrum first. Antral gastritis reduces somatostatin, so gastrin and acid rise, which predisposes to duodenal ulcers."},{id:"pylorus",name:"Pylorus",fn:"Thick sphincter regulating gastric emptying into the duodenum in small, neutralisable squirts.",disease:"Chronic ulceration near the pylorus can scar and narrow it, causing gastric outlet obstruction (vomiting of undigested food, succussion splash)."},{id:"duod",name:"Duodenal bulb",fn:"First part of the duodenum. Receives acid chyme; Brunner glands and pancreatic bicarbonate neutralise it.",disease:"Commonest site of peptic ulcers. Posterior bulb ulcers can erode the gastroduodenal artery (major bleeding); anterior ulcers can perforate."}],render:({mode:r,animate:p,showLabels:o,hot:u})=>{const c=r==="disease";return a.jsxs("g",{children:[a.jsxs("defs",{children:[a.jsxs("linearGradient",{id:"g-stom",x1:"0",x2:"1",y1:"0",y2:"1",children:[a.jsx("stop",{offset:"0",stopColor:"#d48c78"}),a.jsx("stop",{offset:"1",stopColor:"#a8594d"})]}),a.jsxs("linearGradient",{id:"g-oeso",x1:"0",x2:"1",children:[a.jsx("stop",{offset:"0",stopColor:"#b9786c"}),a.jsx("stop",{offset:".5",stopColor:"#e2a596"}),a.jsx("stop",{offset:"1",stopColor:"#b9786c"})]}),a.jsxs("radialGradient",{id:"g-inflam",children:[a.jsx("stop",{offset:"0",stopColor:"#ff3b2f",stopOpacity:".75"}),a.jsx("stop",{offset:"1",stopColor:"#ff3b2f",stopOpacity:"0"})]})]}),a.jsx("text",{x:"404",y:"28",textAnchor:"end",className:"label",style:{fill:"#64748b"},children:"THORAX"}),a.jsx("text",{x:"404",y:"440",textAnchor:"end",className:"label",style:{fill:"#64748b"},children:"ABDOMEN"}),a.jsxs("g",{...u("oeso"),children:[a.jsx("path",{d:c?"M150 0 C150 70 154 130 162 176":gn,stroke:"url(#g-oeso)",strokeWidth:"28",fill:"none",strokeLinecap:"round"}),a.jsx("path",{d:c?"M150 0 C150 70 154 130 162 176":gn,stroke:"#7a3c37" &a.jsx(Ae,{tone:u.decision.options[w].ok?"teal":"coral",children:u.decision.options[w].why})]}):a.jsx(re,{disabled:ha.some(T=>!h[T.id]?.length),onClick:()=>{b(!0),r(15,"endoscopy report")},children:ha.some(T=>!h[T.id]?.length)?`Document all ${ha.length} stations to finish`:"Sign off report"})})]})]})]})}const rm={id:"gerd",slot:2,time:"09:00–10:00",title:"GERD, Gastritis and Peptic Ulcer Disease",shortTitle:"GERD & PUD",system:"Gastroenterology & Hepatology",difficulty:"Intermediate",quickMin:15,deepMin:30,organ:vp,tagline:"Acid is not the enemy; a failed barrier is. Follow the anti-reflux barrier, the gastric mucosal defences, and what happens when H. pylori or NSAIDs tip the balance.",submodules:["Gastro-oesophageal reflux disease","Gastritis","Peptic ulcer disease","H. pylori","NSAID injury","Ulcer complications","Alarm features"],anatomy:[Jp,em],simulations:[{id:"reflux",name:"LES & reflux",blurb:"Change the anti-reflux barrier and the forces that challenge it. Watch acid exposure and the injury it causes.",Component:tm},{id:"barrier",name:"Mucosal barrier",blurb:"Introduce H. pylori, NSAIDs or critical illness and see how the balance between aggressive and defensive factors tips toward gastritis, erosions or ulcers.",Component:am},{id:"acid",name:"Acid secretion",blurb:"Switch stimuli and acid-suppressing drugs on and off at the parietal cell.",Component:im},{id:"endo",name:"Virtual endoscopy",blurb:"Advance the scope through five stations, document what you see, then make the endoscopist’s decision. Three cases.",Component:nm}],patient:{title:"Recurrent epigastric pain",name:"Mr Kwame A.",age:45,sex:"M",context:"Taxi driver attending the outpatient clinic. Walked in, looks well.",complaint:"I keep getting a burning pain here in the upper stomach. It has been coming and going for about three months.",vitals:[{label:"HR",value:"92 /min"},{label:"BP",value:"128/80"},{label:"RR",value:"16 /min"},{label:"Temp",value:"36.8 °C"},{label:"SpO₂",value:"98%"},{label:"BMI",value:"24"}],historyBudget:7,history:[{id:"timing",label:"Relation of pain to meals and time of day",result:"Worse 2–3 hours after meals and wakes me around 2 a.m. Eating or antacids ease it for a while.",relevance:"key",note:"Pain when the stomach empties, relieved by food or antacid, and nocturnal waking are classic for duodenal ulcer."},{id:"nsaid",label:"Medications, especially NSAIDs or aspirin",result:"Only paracetamol occasionally for headaches. No ibuprofen, diclofenac or aspirin.",relevance:"key",note:"NSAIDs and aspirin are, with H. pylori, the two main causes of peptic ulcer. Their absence points toward H. pylori."},{id:"bleed",label:"Vomiting blood, black stools, dizziness",result:"No vomiting of blood. Stools sometimes look darker than usual, but not tarry. Slightly more tired lately.",relevance:"key",note:"Screening for GI bleeding is mandatory in dyspepsia. Fatigue with darker stools suggests slow occult bleeding."},{id:"weight",label:"Weight loss, appetite, dysphagia, vomiting",result:"Appetite is fine. No weight loss, swallowing problems or persistent vomiting.",relevance:"key",note:"Alarm feature screen: their absence lowers (but does not remove) concern for malignancy or obstruction."},{id:"heartburn",label:"Heartburn or acid regurgitation",result:"Occasional heartburn after big meals, not the main problem.",relevance:"useful",note:"Helps separate predominant reflux from ulcer-type dyspepsia."},{id:"radiation",label:"Radiation of pain, relation to exertion",result:"Stays in the upper middle abdomen. Not brought on by walking or climbing stairs. No radiation to the back or arm.",relevance:"useful",note:"Epigastric pain can be cardiac; back radiation would raise posterior ulcer penetration or pancreatitis."},{id:"smoke",label:"Smoking and alcohol",result:"Smokes 10 cigarettes a day. Drinks 2–3 beers at weekends.",relevance:"useful",note:"Smoking impairs ulcer healing. Heavy alcohol would raise pancreatitis and gastritis."},{id:"family",label:"Family history of GI cancer",result:"No family history of stomach or bowel cancer. His brother “had an ulcer”.",relevance:"useful",note:"H. pylori clusters in families (shared childhood acquisition)."},{id:"fever",label:"Fever, travel, diarrhoea",result:"No fever, no recent travel, bowels normal.",relevance:"low"},{id:"urine",label:"Urinary symptoms",result:"None.",relevance:"low"}],examBudget:4,exam:[{id:"general",label:"General inspection: pallor, jaundice, lymph nodes",result:"Mild conjunctival pallor. No jaundice. No supraclavicular (Virchow’s) node.",relevance:"key",note:"Pallor supports anaemia. A left supraclavicular node would suggest gastric malignancy."},{id:"abdo",label:"Abdominal palpation",result:"Soft. Mild epigastric tenderness, no guarding or rigidity. No masses, no organomegaly.",relevance:"key",note:"Rigidity or rebound would suggest perforation. A mass raises malignancy."},{id:"splash",label:"Succussion splash",result:"Absent.",relevance:"useful",note:"Present in gastric outlet obstruction."},{id:"pr",label:"Digital rectal examination (with consent)",result:"Brown stool on glove, no melaena.",relevance:"useful",note:"Melaena would indicate significant upper GI bleeding."},{id:"murphy",label:"Murphy’s sign",result:"Negative.",relevance:"low",note:"Helpful for cholecystitis but the history does not suggest biliary pain."},{id:"chest",label:"Chest auscultation",result:"Clear, normal heart sounds.",relevance:"low"}],investigations:[{id:"fbc",label:"Full blood count",result:"Microcytic anaemia.",labs:[{name:"Haemoglobin",value:"112",unit:"g/L",ref:"130–170",flag:"L"},{name:"MCV",value:"74",unit:"fL",ref:"80–100",flag:"L"},{name:"Platelets",value:"410",unit:"×10⁹/L",ref:"150–400",flag:"H"},{name:"WCC",value:"7.2",unit:"×10⁹/L",ref:"4–11",flag:"N"}],relevance:"key",note:"Reveals anaemia, an alarm feature that changes management."},{id:"ferritin",label:"Ferritin / iron studies",result:"Iron deficiency.",labs:[{name:"Ferritin",value:"9",unit:"µg/L",ref:"30–400",flag:"L"},{name:"Transferrin saturation",value:"8",unit:"%",ref:"20–50",flag:"L"}],relevance:"key",note:"Iron-deficiency anaemia in an adult man warrants GI investigation for blood loss."},{id:"ogd",label:"Upper GI endoscopy (OGD) with biopsies",result:"8 mm clean-based ulcer, anterior duodenal bulb. Patchy antral erythema. Rapid urease (CLO) test from antrum and body: POSITIVE. Oesophagus normal.",relevance:"key",note:"Indicated because of iron-deficiency anaemia. Confirms the ulcer and H. pylori in one procedure."},{id:"hpsa",label:"H. pylori stool antigen or urea breath test",result:"Positive (stool antigen).",relevance:"useful",note:"Ideal non-invasive test if no endoscopy is needed. PPIs should be stopped 2 weeks before to avoid false negatives."},{id:"ecg",label:"12-lead ECG",result:"Sinus rhythm, rate 90, no ischaemic changes.",relevance:"useful",note:"Reasonable in a smoker with epigastric pain to exclude an inferior ischaemic presentation."},{id:"lipase",label:"Serum lipase",result:"42 U/L (ref < 60).",relevance:"useful",note:"Normal: argues against pancreatitis."},{id:"lft",label:"Liver function tests",result:"Within normal limits.",relevance:"low",note:"Not unreasonable, but nothing pointed to hepatobiliary disease."},{id:"serology",label:"H. pylori serology (IgG)",result:"Positive.",relevance:"low",note:"Serology stays positive after eradication, so it cannot distinguish current from past infection. Breath or stool tests are preferred."},{id:"gastrin",label:"Fasting serum gastrin",result:"Mildly raised (patient happens to be taking an over-the-counter antacid).",relevance:"low",note:"Reserved for suspected gastrinoma (Zollinger–Ellison): multiple, distal or refractory ulcers, ulcers with diarrhoea, H. pylori- and NSAID-negative ulcers."},{id:"ct",label:"CT abdomen with contrast",result:"No abnormality.",relevance:"low",note:"Radiation and cost with no question to answer here. CT is for suspected perforation, pancreatitis or malignancy staging."},{id:"barium",label:"Barium meal",result:"Possible duodenal bulb deformity.",relevance:"low",note:"Largely replaced by endoscopy, which allows biopsy and H. pylori testing."}],differentials:[{id:"du",name:"Duodenal ulcer (H. pylori)",note:"Hunger pain relieved by food, nocturnal waking, iron deficiency, no NSAIDs, family clustering: all fit. Confirmed at OGD."},{id:"gerd",name:"Gastro-oesophageal reflux disease",note:"Heartburn is occasional and not the dominant symptom. Normal oesophagus at OGD."},{id:"fd",name:"Functional dyspepsia",note:"A diagnosis of exclusion. Not appropriate with anaemia and an ulcer found."},{id:"ca",name:"Gastric cancer",note:"Must be considered with anaemia, which is why endoscopy was done. No mass, weight loss or nodes, and the gastric mucosa showed no malignant lesion."},{id:"panc",name:"Chronic pancreatitis",note:"Pain would typically radiate to the back, with heavy alcohol use and possibly steatorrhoea. Lipase normal."},{id:"biliary",name:"Biliary colic",note:"Biliary pain is right upper quadrant/epigastric, constant for hours after fatty meals, not relieved by food. Murphy’s negative."},{id:"acs",name:"Inferior myocardial ischaemia",note:"Always consider in epigastric pain with risk factors. Not exertional, ECG normal."}],diagnosis:"du",reasoning:[{id:"r1",text:"Epigastric pain relieved by eating with nocturnal waking, no NSAID exposure and iron-deficiency anaemia; endoscopy shows a duodenal ulcer with a positive urease test, so H. pylori is the cause.",correct:!0},{id:"r2",text:"Any epigastric burning pain is GERD until proven otherwise, so an empirical PPI is all that is needed.",why:"Epigastric pain with anaemia is not simple reflux. Iron deficiency is an alarm feature requiring endoscopy, and a PPI alone would leave H. pylori untreated, so the ulcer would likely recur."},{id:"r3",text:"Raised gastrin proves a gastrinoma, which explains the ulcer.",why:"Gastrin rises with acid suppression (including antacids and PPIs) and with H. pylori itself. A solitary bulb ulcer with H. pylori does not justify a gastrinoma work-up."},{id:"r4",text:"Mild pallor and anaemia mean this is gastric cancer until a CT proves otherwise.",why:"Anaemia demands endoscopy to exclude malignancy, and that was done. CT is not the first test, and the endoscopy found a benign-appearing duodenal ulcer."}],debrief:{summary:"Mr A. has an H. pylori-associated duodenal ulcer with chronic occult blood loss causing iron-deficiency anaemia. The classic pattern (pain when the stomach empties, relief with food) reflects acid hitting an unprotected duodenal ulcer. The anaemia was the clue that moved him from “test and treat” to endoscopy.",redFlags:["Haematemesis or melaena","Iron-deficiency anaemia","Progressive dysphagia or odynophagia","Unintentional weight loss","Persistent vomiting","Epigastric mass or Virchow’s node","New dyspepsia at an older age (≥ 60 per ACG/CAG; ≥ 55 with weight loss in NICE)","Sudden severe pain with rigidity (perforation)"],management:["Eradicate H. pylori: 14 days of bismuth quadruple therapy (PPI + bismuth + tetracycline + metronidazole) is a recommended first-line regimen where clarithromycin resistance is common or unknown.","Confirm eradication with a urea breath test or stool antigen ≥ 4 weeks after antibiotics and ≥ 2 weeks off PPI.","PPI to heal the ulcer; oral iron to replace stores, then recheck Hb.","Stop smoking; avoid NSAIDs. Uncomplicated duodenal ulcers do not need routine repeat endoscopy (gastric ulcers do)."],takeaway:"Dyspepsia + an alarm feature = scope. Ulcer found = ask “H. pylori or NSAID?” every time, because removing the cause is what prevents recurrence."}},questions:[{id:"g1",kind:"hotspot",level:1,view:"gross",answer:"les",concept:"Anti-reflux barrier anatomy",prompt:"Tap the structure whose transient relaxations cause most reflux episodes in GERD.",hint:"It is an intrinsic smooth-muscle zone at the bottom of the oesophagus.",twin:"g1b",explain:{reasoning:"The lower oesophageal sphincter is a 3–4 cm high-pressure zone. Most reflux in GERD happens during transient LES relaxations (TLESRs), not swallow-induced, triggered by gastric distension.",science:"The barrier has two parts: the intrinsic LES and the extrinsic crural diaphragm. When they overlap at the hiatus, the barrier is strongest.",chain:["Gastric distension","Vagal reflex","Transient LES relaxation","Acid refluxes"],takeaway:"GERD is mostly a disorder of timing (too many TLESRs), not of acid production."}},{id:"g1b",kind:"hotspot",level:1,view:"gross",answer:"crus",concept:"Anti-reflux barrier anatomy",prompt:"Tap the structure that acts as the “external sphincter”, reinforcing the LES during inspiration.",explain:{reasoning:"The right crus of the diaphragm forms a sling around the hiatus and pinches the GOJ, especially on inspiration and straining.",science:"In a sliding hiatus hernia the GOJ moves above the crura, separating the two components of the barrier.",takeaway:"Hiatus hernia worsens reflux because it splits the LES from its crural support."}},{id:"g2",kind:"match",level:1,concept:"Gastric cell types",prompt:"Match each gastric cell to its main secretion.",pairs:[{left:"Parietal cell",right:"HCl and intrinsic factor"},{left:"Chief cell",right:"Pepsinogen"},{left:"G cell",right:"Gastrin"},{left:"D cell",right:"Somatostatin"},{left:"ECL cell",right:"Histamine"}],explain:{reasoning:"Parietal cells make acid and intrinsic factor; chief cells make pepsinogen; antral G cells make gastrin; D cells make somatostatin (the brake); ECL cells make histamine.",science:"Gastrin mainly stimulates acid indirectly by releasing ECL histamine. Somatostatin from D cells is released when acid is high and switches gastrin off.",takeaway:"Lose the D-cell brake (antral H. pylori) and gastrin and acid rise."}},{id:"g3",kind:"classify",level:1,concept:"Alarm features",prompt:"Sort these dyspepsia features: which are alarm features requiring prompt endoscopy?",buckets:["Alarm feature","Not an alarm feature on its own"],items:[{text:"Progressive dysphagia",bucket:0},{text:"Melaena",bucket:0},{text:"Iron-deficiency anaemia",bucket:0},{text:"Unintentional weight loss",bucket:0},{text:"Heartburn after large meals",bucket:1},{text:"Bloating",bucket:1},{text:"Persistent vomiting",bucket:0},{text:"Pain relieved by antacids",bucket:1}],explain:{reasoning:"Dysphagia, GI bleeding, iron-deficiency anaemia, weight loss and persistent vomiting point to malignancy, bleeding ulcer or obstruction. Heartburn, bloating and antacid relief are common in benign disease.",takeaway:"Ask every dyspeptic patient about the alarm features. They decide who needs a scope."}},{id:"g4",kind:"mcq",level:1,concept:"Erosion vs ulcer",prompt:"What separates a peptic ulcer from an erosion?",options:[{id:"a",text:"An ulcer extends through the muscularis mucosae; an erosion does not",correct:!0},{id:"b",text:"An ulcer is larger than 5 mm; an erosion is smaller",why:"Size is used in endoscopic description, but the defining feature is depth. A small lesion through the muscularis mucosae is still an ulcer."},{id:"c",text:"Ulcers are caused by H. pylori and erosions by NSAIDs",why:"Both causes can produce either lesion. The distinction is histological depth."},{id:"d",text:"Erosions only occur in the oesophagus",why:"Erosions occur in the stomach and duodenum too (e.g. NSAID erosive gastropathy)."}],explain:{reasoning:"Erosions are confined to the mucosa. Ulcers breach the muscularis mucosae into the submucosa or deeper, where larger vessels lie.",science:"Because ulcers reach submucosal arteries and can extend through the wall, they bleed heavily and can perforate. Erosions heal without scarring.",chain:["Mucosal injury","Breach of muscularis mucosae","Submucosal arteries exposed","Bleeding / perforation risk"],takeaway:"Depth defines danger: erosions ooze, ulcers can haemorrhage or perforate."}},{id:"g5",kind:"hotspot",level:1,view:"gland",answer:"parietal",deep:!0,concept:"Gastric cell types",prompt:"Tap the cell that PPIs act on.",explain:{reasoning:"PPIs irreversibly inhibit the H+/K+-ATPase in the parietal cell’s secretory canaliculus.",science:"They are prodrugs activated by acid in the canaliculus, so they work best when pumps are active: 30–60 minutes before a meal.",takeaway:"Take the PPI before breakfast, not at bedtime on an empty stomach."}},{id:"g6",kind:"order",level:2,concept:"H. pylori → duodenal ulcer",prompt:"Put the mechanism in order: how does antral H. pylori cause a duodenal ulcer?",items:["H. pylori colonises the antrum","Antral inflammation reduces D-cell somatostatin","Gastrin release is disinhibited","Parietal cells secrete more acid","Excess acid enters the duodenum → gastric metaplasia","H. pylori colonises the metaplasia → duodenal ulcer"],hint:"Start with the bacterium and the brake on gastrin.",twin:"g6b",explain:{reasoning:"Antral gastritis removes the somatostatin brake, so gastrin and acid rise. The acid-damaged duodenum develops gastric metaplasia that H. pylori can then colonise, causing duodenitis and ulceration.",chain:["Antral H. pylori","↓ Somatostatin","↑ Gastrin","↑ Acid","Duodenal gastric metaplasia","Duodenal ulcer"],takeaway:"Antral-predominant H. pylori = high acid = duodenal ulcer. Corpus-predominant = low acid = gastric ulcer and cancer risk."}},{id:"g6b",kind:"mcq",level:2,concept:"H. pylori → duodenal ulcer",prompt:"A patient has corpus-predominant H. pylori gastritis with atrophy. What happens to acid secretion and why?",options:[{id:"a",text:"Acid falls, because parietal cells in the corpus are lost",correct:!0},{id:"b",text:"Acid rises, because gastrin is disinhibited",why:"That is the antral pattern. In corpus gastritis the acid-producing cells themselves are damaged, so acid falls even if gastrin is high."},{id:"c",text:"Acid is unchanged; H. pylori does not affect secretion",why:"H. pylori alters acid secretion in both directions depending on its distribution."}],explain:{reasoning:"Corpus gastritis destroys parietal cells (atrophy). Acid falls; gastrin rises in response. The weakened mucosa is prone to gastric ulcer, and atrophy with intestinal metaplasia raises gastric adenocarcinoma risk.",takeaway:"Where H. pylori lives decides whether acid goes up (antrum) or down (corpus)."}},{id:"g7",kind:"mcq",level:2,concept:"NSAID injury",prompt:"Why do NSAIDs cause gastric ulcers even when given intravenously or rectally?",options:[{id:"a",text:"Systemic COX-1 inhibition reduces mucosal prostaglandins, weakening mucus, bicarbonate and blood flow",correct:!0},{id:"b",text:"NSAIDs stimulate gastrin release",why:"NSAIDs do not primarily act through gastrin. Their key effect is loss of prostaglandin-mediated protection."},{id:"c",text:"NSAIDs are excreted in bile which refluxes into the stomach",why:"Bile reflux can injure the stomach, but this is not the main NSAID mechanism and does not explain the systemic effect."},{id:"d",text:"They only cause ulcers by direct contact, so non-oral routes are safe",why:"Topical injury is one mechanism, but the dominant mechanism is systemic: any route that inhibits COX-1 removes prostaglandin protection."}],explain:{reasoning:"Prostaglandins (PGE2, PGI2) made by COX-1 maintain mucus and bicarbonate secretion, mucosal blood flow and epithelial renewal, and reduce acid. NSAIDs inhibit COX-1 systemically, so the route of administration does not protect the stomach.",chain:["NSAID","COX-1 inhibition","↓ Prostaglandins","↓ Mucus, ↓ HCO₃⁻, ↓ blood flow","Acid–pepsin injury","Gastric ulcer"],takeaway:"NSAID ulcers are a systemic drug effect, so co-prescribe a PPI in high-risk patients regardless of route."}},{id:"g8",kind:"mcq",level:2,concept:"Ulcer bleeding anatomy",prompt:"A posterior duodenal bulb ulcer presents with massive haematemesis. Which vessel is most likely eroded?",options:[{id:"a",text:"Gastroduodenal artery",correct:!0},{id:"b",text:"Left gastric artery",why:"The left gastric artery runs along the lesser curvature of the stomach and bleeds from lesser-curve gastric ulcers."},{id:"c",text:"Splenic artery",why:"The splenic artery runs along the upper border of the pancreas, away from the duodenal bulb."},{id:"d",text:"Superior mesenteric artery",why:"The SMA is posterior to the third/fourth part of the duodenum, not the bulb."}],explain:{reasoning:"The gastroduodenal artery runs directly behind the first part of the duodenum. A posterior bulb ulcer that erodes deeply can open it, causing major bleeding.",science:"Anterior ulcers have no major vessel behind them; they tend to perforate into the peritoneal cavity instead.",takeaway:"Posterior duodenal ulcers bleed (GDA); anterior ones perforate."}},{id:"g9",kind:"mcq",level:2,concept:"GERD symptoms",prompt:"Why can GERD cause a chronic cough in a non-smoker?",options:[{id:"a",text:"Refluxate stimulates oesophageal vagal afferents (reflex cough) and can reach the larynx (microaspiration)",correct:!0},{id:"b",text:"Acid destroys the alveoli",why:"Large aspiration can cause pneumonitis, but chronic reflux cough is not due to alveolar destruction."},{id:"c",text:"The enlarged stomach compresses the lungs",why:"Gastric distension does not cause chronic cough by compression."}],explain:{reasoning:"The oesophagus and airways share vagal innervation. Distal acid triggers an oesophago-tracheobronchial reflex; proximal reflux to the larynx irritates it directly.",chain:["Reflux episode","Oesophageal vagal afferents ± laryngeal contact","Reflex cough / laryngitis"],takeaway:"Think of GERD in chronic cough, hoarseness and poorly controlled asthma. Extra-oesophageal reflux is real but over-diagnosed; objective testing helps."}},{id:"g10",kind:"mcq",level:2,deep:!0,concept:"Barrett’s oesophagus",prompt:"Barrett’s oesophagus is best described as:",options:[{id:"a",text:"Replacement of distal squamous epithelium by columnar epithelium with intestinal metaplasia",correct:!0},{id:"b",text:"A pre-malignant squamous dysplasia caused by smoking",why:"That describes a precursor of squamous cell carcinoma. Barrett’s is columnar (glandular) and predisposes to adenocarcinoma."},{id:"c",text:"A benign stricture caused by healing oesophagitis",why:"That is a peptic stricture, which causes dysphagia but is not metaplasia."}],explain:{reasoning:"Chronic reflux injury heals with acid-resistant columnar epithelium containing goblet cells (intestinal metaplasia). It can progress through dysplasia to oesophageal adenocarcinoma.",chain:["Chronic reflux","Repeated squamous injury","Columnar intestinal metaplasia","Dysplasia","Adenocarcinoma (rare)"],takeaway:"Barrett’s = salmon tongues above the GOJ at endoscopy; confirmed by biopsy; surveillance based on length and dysplasia."}},{id:"g11",kind:"mcq",level:3,concept:"Dyspepsia work-up",twin:"g11b",stem:"A 34-year-old woman has 2 months of epigastric discomfort and early satiety. No weight loss, bleeding, dysphagia or vomiting. No NSAIDs. FBC normal. Examination unremarkable.",prompt:"What is the most appropriate initial strategy?",options:[{id:"a",text:"Non-invasive H. pylori test (breath or stool antigen); treat if positive",correct:!0},{id:"b",text:"Urgent upper GI endoscopy",why:"She is young with no alarm features. Guidelines favour test-and-treat for H. pylori in this group; endoscopy is for older age or alarm features."},{id:"c",text:"H. pylori serology",why:"Serology cannot distinguish current from past infection and has lower accuracy. Breath or stool antigen tests are preferred."},{id:"d",text:"CT abdomen",why:"No indication: CT does not assess the mucosa and adds radiation."}],explain:{reasoning:"For dyspepsia in younger patients without alarm features, a test-and-treat strategy for H. pylori is recommended, followed by PPI trial if negative or persistent.",science:"PPIs, bismuth and antibiotics suppress H. pylori and cause false-negative breath/stool tests, so they should be stopped beforehand (PPI 2 weeks, antibiotics/bismuth 4 weeks).",takeaway:"Young + no alarm features → test and treat H. pylori. Old or alarm features → scope."}},{id:"g11b",kind:"mcq",level:3,concept:"Dyspepsia work-up",stem:"A 67-year-old man has new-onset dyspepsia for 6 weeks and has lost 5 kg without trying.",prompt:"What is the most appropriate next step?",options:[{id:"a",text:"Prompt upper GI endoscopy",correct:!0},{id:"b",text:"H. pylori stool antigen and treat if positive",why:"Test-and-treat is for younger patients without alarm features. Age and weight loss require direct visualisation and biopsy to exclude malignancy."},{id:"c",text:"Empirical PPI for 8 weeks and review",why:"A PPI can heal a malignant ulcer superficially and delay diagnosis of cancer."}],explain:{reasoning:"Older age and unintentional weight loss raise the probability of upper GI malignancy enough to justify endoscopy first.",takeaway:"PPIs can mask gastric cancer. Scope first when alarm features are present."}},{id:"g12",kind:"mcq",level:3,concept:"Upper GI bleeding",stem:"A 70-year-old on naproxen presents with melaena. HR 112, BP 98/60. Hb 78 g/L (was 135 three months ago). Urea 18 mmol/L (ref 2.5–7.8), creatinine 90 µmol/L.",labs:[{name:"Haemoglobin",value:"78",unit:"g/L",ref:"130–170",flag:"L"},{name:"Urea",value:"18.0",unit:"mmol/L",ref:"2.5–7.8",flag:"H"},{name:"Creatinine",value:"90",unit:"µmol/L",ref:"60–110",flag:"N"}],prompt:"Which statement about his initial management is correct?",options:[{id:"a",text:"Resuscitate (IV access, fluids), transfuse to a restrictive Hb threshold (around 70–80 g/L), and arrange endoscopy within 24 hours",correct:!0},{id:"b",text:"Give tranexamic acid and avoid endoscopy until he is stable for 72 hours",why:"Tranexamic acid is not recommended for upper GI bleeding (HALT-IT trial showed no mortality benefit and more thrombosis). Early endoscopy is diagnostic and therapeutic."},{id:"c",text:"Transfuse to a target Hb above 120 g/L",why:"A liberal threshold increases rebleeding and mortality compared with a restrictive strategy."},{id:"d",text:"Discharge with oral PPI because creatinine is normal",why:"He is tachycardic and hypotensive with a high Glasgow-Blatchford score. Only very low scores (0–1) are suitable for outpatient management."}],explain:{reasoning:"A high urea with normal creatinine reflects digested blood protein absorbed from the gut, typical of upper GI bleeding. Tachycardia and hypotension show significant volume loss. Priorities: resuscitate, restrictive transfusion, risk-stratify (Glasgow-Blatchford), and endoscopy within 24 h.",chain:["Ulcer erodes artery","Blood digested in gut","↑ Urea (protein load)","Hypovolaemia: ↑HR, ↓BP"],takeaway:"High urea:creatinine ratio + melaena = think upper GI bleed. Resuscitate first, scope within 24 hours."}},{id:"g13",kind:"classify",level:3,concept:"Ulcer complications",prompt:"Match each presentation to the ulcer complication it suggests.",buckets:["Bleeding","Perforation","Gastric outlet obstruction"],items:[{text:"Coffee-ground vomit, melaena",bucket:0},{text:"Sudden severe pain, board-like rigidity",bucket:1},{text:"Free air under the diaphragm on erect CXR",bucket:1},{text:"Projectile vomiting of food eaten the day before",bucket:2},{text:"Succussion splash",bucket:2},{text:"Raised urea with normal creatinine",bucket:0},{text:"Hypokalaemic hypochloraemic metabolic alkalosis",bucket:2}],explain:{reasoning:"Bleeding: haematemesis, melaena, raised urea. Perforation: acid spills into the peritoneum causing chemical peritonitis and pneumoperitoneum. Obstruction: pyloric scarring causes retention of food and vomiting of HCl, producing metabolic alkalosis with low K⁺ and Cl⁻.",takeaway:"Bleed, perforate, obstruct, penetrate: the four ulcer complications each have a signature."}},{id:"g14",kind:"mcq",level:3,deep:!0,concept:"H. pylori testing",stem:"A patient treated for H. pylori 6 weeks ago (finished antibiotics 4 weeks ago) is still taking omeprazole daily. You want to confirm eradication.",prompt:"What is the best plan?",options:[{id:"a",text:"Stop omeprazole for 2 weeks, then perform a urea breath test",correct:!0},{id:"b",text:"Repeat H. pylori serology now",why:"Serology remains positive for months to years after successful eradication."},{id:"c",text:"Urea breath test today while on omeprazole",why:"PPIs suppress urease activity and bacterial load, causing false negatives."}],explain:{reasoning:"Test of cure uses a urea breath test or stool antigen at least 4 weeks after antibiotics and 2 weeks off PPI.",science:"The breath test detects labelled CO2 from bacterial urease splitting labelled urea. Fewer bacteria (PPI suppression) means a falsely negative result.",takeaway:"Always confirm eradication, and stop the PPI first."}}],readiness:{understand:["The anti-reflux barrier is the LES plus the crural diaphragm. Most reflux happens during transient LES relaxations, and a hiatus hernia separates the two components.","Gastric acid is controlled by ACh, gastrin and histamine acting on the parietal cell; PPIs block the final common pathway (H+/K+-ATPase).","Ulcers form when aggressive factors (acid, pepsin) overcome defensive ones (mucus, bicarbonate, prostaglandins, blood flow). H. pylori and NSAIDs are the two main causes.","Antral H. pylori increases acid (duodenal ulcer); corpus H. pylori reduces acid (gastric ulcer, atrophy, cancer risk).","Alarm features (bleeding, anaemia, weight loss, dysphagia, persistent vomiting, older age) move a dyspeptic patient from test-and-treat to endoscopy."],listenFor:["Which H. pylori eradication regimen your lecturer recommends locally, and why (antibiotic resistance patterns).","How GERD is confirmed when the endoscopy is normal (ambulatory pH monitoring, Lyon criteria) and when surgery is considered.","Risk scores and timing in upper GI bleeding (Glasgow-Blatchford, Rockall, Forrest classification)."],questions:["Why might a long-term PPI user develop hypergastrinaemia, and should that worry us?","If H. pylori increases acid in some patients and decreases it in others, why might eradication occasionally worsen reflux symptoms?"],connection:"A 70-year-old on naproxen for arthritis with new melaena and a high urea is the classic emergency version of this lecture. Recognising NSAID ulcer bleeding, resuscitating, and scoping within 24 hours is core foundation-year work."},recap:[{q:"Two components of the anti-reflux barrier?",a:"Intrinsic LES and extrinsic crural diaphragm (plus the angle of His)."},{q:"Main mechanism of reflux episodes in GERD?",a:"Transient LES relaxations, not triggered by swallowing."},{q:"How do NSAIDs cause ulcers?",a:"COX-1 inhibition → ↓ prostaglandins → ↓ mucus, HCO₃⁻, blood flow."},{q:"Antral H. pylori: acid up or down?",a:"Up (↓ somatostatin → ↑ gastrin) → duodenal ulcer."},{q:"Ulcer vs erosion?",a:"Ulcer breaches the muscularis mucosae."},{q:"Posterior duodenal ulcer bleeds from?",a:"Gastroduodenal artery."},{q:"Best test of H. pylori cure?",a:"Urea breath test or stool antigen ≥ 4 weeks after antibiotics, 2 weeks off PPI."},{q:"Barrett’s oesophagus?",a:"Columnar intestinal metaplasia of the distal oesophagus; risk of adenocarcinoma."}],references:[{label:"Katz PO et al. ACG Clinical Guideline for the Diagnosis and Management of GERD. Am J Gastroenterol 2022.",note:"PPI optimisation, endoscopy indications"},{label:"Gyawali CP et al. Updates to the modern diagnosis of GERD: Lyon Consensus 2.0. Gut 2024.",note:"Objective diagnosis of GERD"},{label:"Chey WD et al. ACG Clinical Guideline: Treatment of Helicobacter pylori Infection. Am J Gastroenterol 2024.",note:"Eradication regimens, test of cure"},{label:"Malfertheiner P et al. Management of H. pylori infection: Maastricht VI/Florence consensus. Gut 2022."},{label:"Moayyedi P et al. ACG and CAG Clinical Guideline: Management of Dyspepsia. Am J Gastroenterol 2017.",note:"Test-and-treat vs endoscopy"},{label:"Laine L et al. ACG Clinical Guideline: Upper GI and Ulcer Bleeding. Am J Gastroenterol 2021.",note:"Risk stratification, endoscopic therapy, PPI"},{label:"Guyton and Hall Textbook of Medical Physiology",note:"gastric secretion physiology (reference priority)"},{label:"Robbins and Cotran Pathologic Basis of Disease",note:"gastritis, peptic ulcer pathology (reference priority)"}],modelNote:"The reflux and mucosal-balance simulators are qualitative teaching models: numbers on sliders show direction, not measured physiological values."},lm={id:"gut",name:"Small & large intestine",viewBox:"0 0 420 430",diseaseLabel:"Inflammatory colitis",caption:"Fluid handling per day (approximate): about 9 L enters the duodenum (oral intake plus secretions), the small bowel absorbs about 7.5 L, the colon about 1.3 L, leaving 100–200 mL in stool. Small changes in absorption overwhelm the colon’s reserve.",structures:[{id:"duod",name:"Duodenum",fn:"Receives chyme, bile and pancreatic enzymes. Main site of iron and calcium absorption.",disease:"Coeliac disease affects the proximal small bowel most, so iron deficiency is a common presentation."},{id:"jej",name:"Jejunum",fn:"Bulk of nutrient absorption: sugars, amino acids, fats, folate. Most of the daily fluid load is absorbed here and in the ileum.",disease:"Villous atrophy (coeliac) or infection (Giardia) causes malabsorption and osmotic diarrhoea."},{id:"ileum",name:"Terminal ileum",fn:"Absorbs vitamin B12 (with intrinsic factor) and reabsorbs bile acids (enterohepatic circulation).",disease:"Crohn’s disease or resection → B12 deficiency and bile acids spilling into the colon, which triggers secretory (bile acid) diarrhoea."},{id:"caecum",name:"Caecum & ileocaecal valve",fn:"Regulates flow into the colon and limits backflow of colonic bacteria.",disease:"A classic site for Crohn’s, TB and Yersinia (right iliac fossa pain)."},{id:"colon",name:"Colon",fn:"Absorbs remaining water and sodium (up to about 4–5 L/day if needed), and ferments fibre into short-chain fatty acids.",disease:"Inflammation (ulcerative colitis, Shigella, Campylobacter, C. difficile) causes exudation of blood, mucus and protein, impaired absorption, and urgency."},{id:"rectum",name:"Rectum",fn:"Stores faeces; distension triggers the urge to defecate.",disease:"Proctitis causes urgency, tenesmus and small-volume bloody stools."},{id:"stomach",name:"Stomach",fn:"Delivers chyme in controlled amounts; acid is a barrier against ingested pathogens.",disease:"Acid suppression (PPIs) raises the risk of enteric infections including C. difficile."}],render:({mode:r,animate:p,showLabels:o,hot:u})=>{const c=r==="disease",d="M110 360 L110 150 C110 120 130 110 160 110 L290 110 C320 110 330 120 330 150 L330 330 C330 360 310 372 280 372 L240 372 C215 372 205 390 210 412";return a.jsxs("g",{children:[a.jsxs("g",{...u("stomach"),children:[a.jsx("path",{d:"M210 20 C206 34 214 44 226 44 C238 44 240 30 256 30 C272 30 282 46 276 66 C270 88 244 98 222 94 C210 92 206 84 212 78",fill:"#c9776a"}),a.jsx("path",{className:"hl",d:"M210 20 C206 34 214 44 226 44 C238 44 240 30 256 30 C272 30 282 46 276 66 C270 88 244 98 222 94 C210 92 206 84 212 78 Z"})]}),a.jsxs("g",{...u("colon"),children:[a.jsx("path",{d,stroke:c?"#e0574a":"#b9786a",strokeWidth:"26",fill:"none",strokeLinecap:"round",strokeLinejoin:"round"}),[150,190,230,270].map(h=>a.jsx("line",{x1:h,y1:"98",x2:h,y2:"122",stroke:"#7a4036",strokeWidth:"2"},h)),[160,200,240,280,320].map(h=>a.jsx("line",{x1:"318",y1:h,x2:"342",y2:h,stroke:"#7a4036",strokeWidth:"2"},h)),[170,220,270,320].map(h=>a.jsx("line",{x1:"98",y1:h,x2:"122",y2:h,stroke:"#7a4036",strokeWidth:"2"},h)),c&&Array.from({length:14},(h,g)=>a.jsx("circle",{cx:g<7?330+(g%2*6-3):160+(g-7)*22,cy:g<7?150+g*30:110+(g%2*6-3),r:"4",fill:"#fff",opacity:".7"},g)),a.jsx("path",{className:"hl",d,stroke:"#7fe3d6",strokeOpacity:"0",strokeWidth:"30",fill:"none"})]}),a.jsxs("g",{...u("duod"),children:[a.jsx("path",{d:"M212 80 C196 90 180 96 176 116 C172 140 196 156 222 150",stroke:"#d99a86",strokeWidth:"14",fill:"none",strokeLinecap:"round"}),a.jsx("path",{className:"hl",d:"M212 80 C196 90 180 96 176 116 C172 140 196 156 222 150",stroke:"#7fe3d6",strokeOpacity:"0",strokeWidth:"18",fill:"none"})]}),a.jsxs("g",{...u("jej"),children:[a.jsx("path",{d:"M222 150 C260 150 290 160 290 180 C290 200 150 196 150 216 C150 236 290 232 290 252",stroke:"#e0a493",strokeWidth:"13",fill:"none",strokeLinecap:"round"}),a.jsx("path",{className:"hl",d:"M222 150 C260 150 290 160 290 180 C290 200 150 196 150 216 C150 236 290 232 290 252",stroke:"#7fe3d6",strokeOpacity:"0",strokeWidth:"18",fill:"none"})]}),a.jsxs("g",{...u("ileum"),children:[a.jsx("path",{d:"M290 252 C290 272 150 268 150 288 C150 308 230 306 230 322 C230 338 150 330 124 330",stroke:"#e8b4a4",strokeWidth:"12",fill:"none",strokeLinecap:"round"}),a.jsx("path",{className:"hl",d:"M290 252 C290 272 150 268 150 288 C150 308 230 306 230 322 C230 338 150 330 124 330",stroke:"#7fe3d6",strokeOpacity:"0",strokeWidth:"18",fill:"none"})]}),a.jsxs("g",{...u("caecum"),children:[a.jsx("circle",{cx:"110",cy:"352",r:"18",fill:"#b9786a"}),a.jsx("path",{d:"M104 368 C100 384 106 392 112 394",stroke:"#b9786a",strokeWidth:"5",fill:"none"}),a.jsx("circle",{className:"hl",cx:"110",cy:"352",r:"22"})]}),a.jsxs("g",{...u("rectum"),children:[a.jsx("path",{d:"M210 400 L210 428",stroke:c?"#e0574a":"#a8675a",strokeWidth:"22"}),a.jsx("rect",{className:"hl",x:"196",y:"396",width:"28",height:"34"})]}),p&&[0,1,2,3].map(h=>a.jsxs("circle",{r:"4",fill:"#60a5fa",opacity:".9",children:[a.jsx("animateMotion",{dur:"8s",begin:`${h*2}s`,repeatCount:"indefinite",path:"M212 80 C196 90 180 96 176 116 C172 140 196 156 222 150 C260 150 290 160 290 180 C290 200 150 196 150 216 C150 236 290 232 290 252 C290 272 150 268 150 288 C150 308 230 306 230 322 C230 338 150 330 124 330 L110 352 L110 150 C110 120 130 110 160 110 L290 110 C320 110 330 120 330 150 L330 330 C330 360 310 372 280 372 L240 372 C215 372 205 390 210 412"}),a.jsx("animate",{attributeName:"r",values:"5;4;3;2;1.5",dur:"8s",begin:`${h*2}s`,repeatCount:"indefinite"})]},h)),a.jsx(ye,{x:300,y:30,t:"~9 L/day in",fill:"#93c5fd"}),a.jsx(ye,{x
