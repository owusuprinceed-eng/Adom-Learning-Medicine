<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moral IQ</title>
<meta name="description" content="Moral IQ: practical, hands-on character building with weekly actions, weekend online meetings and online tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a4a;--navy2:#163a63;--teal:#0e8f8a;--teal2:#12b3ac;--bg:#f5f7f9;--card:#fff;--tx:#1f2937;--mut:#6b7280;--bd:#e3e8ee}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,"Source Sans 3",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
a{color:var(--teal);text-decoration:none}h1{font-size:28px;margin:0 0 4px}h2{font-size:18px;margin:0 0 14px}hr{border:0;border-top:1px solid var(--bd);margin:16px 0}
.top{height:60px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;position:fixed;top:0;left:0;right:0;z-index:5}
.top img.lg{height:36px;border-radius:4px}.brand{font-weight:700;letter-spacing:.5px;color:#fff}.sp{flex:1}
.tag{background:var(--teal);font-size:11px;padding:3px 9px;border-radius:10px}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--teal);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.burger{display:none;background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
.side{position:fixed;top:60px;bottom:0;left:0;width:230px;background:#fff;border-right:1px solid var(--bd);padding:14px 0;overflow:auto;z-index:4}
.side small{display:block;padding:6px 20px;color:var(--mut);font-size:11px;letter-spacing:1px}
.side a{display:block;padding:11px 20px;color:var(--tx);border-left:3px solid transparent}
.side a.on{background:#e8f5f4;border-color:var(--teal);color:var(--navy);font-weight:600}
main{margin:60px 0 0 230px;padding:26px;min-height:calc(100vh - 110px)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.g11{grid-template-columns:1fr 1fr}.g2{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.mc{padding:0;overflow:hidden;display:block;color:inherit}.mi{height:120px;background:linear-gradient(135deg,var(--navy),var(--teal));position:relative}
.mi img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.mb{padding:14px}.lock{opacity:.6}.lock .mi{filter:grayscale(.8)}
.bar{height:8px;background:#e5eaf0;border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--teal)}
.num{color:var(--teal);font-weight:700;font-size:13px}.mut{color:var(--mut);font-size:13px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;display:inline-block;font-family:inherit;font-weight:600;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,42,74,.18)}
.btn.t{background:var(--teal)}.btn.w{width:100%;text-align:center;font-size:15px;padding:11px}.btn.g{background:#e5eaf0;color:var(--tx)}.btn:disabled{opacity:.6;transform:none;box-shadow:none}
.btn.o{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff}.btn.o:hover{background:rgba(255,255,255,.1)}
.btn.sm{padding:7px 12px;font-size:13px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cfd6df;border-radius:8px;font-size:15px;margin:4px 0 12px;background:#fff;font-family:inherit}
label{font-size:13px;font-weight:600}.err{color:#b42318;font-size:13px;margin-bottom:8px}.okm{color:#166534;font-size:13px;margin-bottom:8px}
.hint{font-size:13px;margin:-8px 0 12px;color:#b42318}
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .l{background:var(--navy);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center}
.auth .l img{width:90px;border-radius:10px;margin-bottom:20px}.auth .l h1{font-size:38px}
.auth .r{padding:40px 24px;display:flex;align-items:center;justify-content:center}.auth form{width:100%;max-width:400px}
.back{display:inline-block;margin-bottom:18px;font-size:13px;color:var(--mut)}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps b{flex:1;height:5px;border-radius:4px;background:#dde3ea}.steps b.on{background:var(--teal)}
.pic{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#e5eaf0;display:block;margin:6px 0 10px}
ul.n{list-style:none;padding:0;margin:0}ul.n li{padding:11px 0;border-bottom:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);vertical-align:top}.wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}.ok{background:#dcfce7;color:#166534}.wt{background:#fef3c7;color:#92400e}.bl{background:#e0ecff;color:#1e3a8a}
.ban{background:#fff7e0;border:1px solid #f3d98b;border-radius:10px;padding:14px;margin-bottom:16px}.ban.t{background:#e8f5f4;border-color:#a7d9d6}
.stat{font-size:30px;font-weight:700;color:var(--navy)}.chk{max-height:180px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:10px}
footer{margin-left:230px;padding:18px;text-align:center;color:var(--mut);font-size:12px}.ld{padding:60px;text-align:center;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.ev{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);color:inherit}.ev:last-child{border:0}
.ev .d{width:52px;height:56px;border-radius:10px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.ev .d b{font-size:20px}.ev .d span{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.act{display:flex;gap:16px;align-items:center}.act .ic{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--teal));flex:none;display:grid;place-items:center;color:#fff;font-size:28px}
.ive{background:#f8fafc;border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:8px}
/* ===== homepage ===== */
.pub{background:#fff;min-height:100vh}
.nav{position:sticky;top:0;z-index:10;background:rgba(15,42,74,.97);backdrop-filter:blur(8px);color:#fff}
.nav .in{max-width:1160px;margin:0 auto;height:66px;display:flex;align-items:center;gap:22px;padding:0 20px}
.nav img{height:38px;border-radius:6px}.nav .links a{color:#d6e2f0;font-size:14px;font-weight:500;margin-right:20px}.nav .links a:hover{color:#fff}
.hero{background:radial-gradient(1100px 500px at 85% -10%,rgba(18,179,172,.35),transparent 60%),linear-gradient(160deg,var(--navy) 0%,#0b2240 60%,#0a1d36 100%);color:#fff;position:relative;overflow:hidden}
.hero .in{max-width:1160px;margin:0 auto;padding:72px 20px 84px;display:grid;grid-template-columns:1.25fr .9fr;gap:48px;align-items:center;position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--teal2);box-shadow:0 0 0 0 rgba(18,179,172,.7);animation:pulse 2s infinite}

.hero h1{font-size:52px;line-height:1.06;letter-spacing:-1.2px;margin:18px 0 16px;font-weight:800}.hero h1 em{font-style:normal;color:var(--teal2)}
.hero p.lead{font-size:18px;line-height:1.6;color:#d3deeb;max-width:560px;margin:0 0 28px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}.hero .cta .btn{padding:14px 22px;font-size:15px;border-radius:10px}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.18;background:var(--teal2);animation:float 12s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-24px)}}
.panel{background:rgba(255,255,255,.97);color:var(--tx);border-radius:18px;padding:22px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.panel h3{margin:0 0 4px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal)}
.pev{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;color:inherit;transition:background .15s,transform .15s;margin:0 -8px}
.pev:hover{background:#eef6f6;transform:translateX(3px)}.pev .d{width:56px;height:60px;border-radius:12px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.pev .d b{font-size:21px}.pev .d span{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.85}.pev .go{margin-left:auto;color:var(--teal);font-size:20px}
.sec{max-width:1160px;margin:0 auto;padding:80px 20px}.sec .k{color:var(--teal);font-weight:700;font-size:13px;letter-spacing:1.6px;text-transform:uppercase}
.sec h2{font-size:34px;letter-spacing:-.6px;margin:8px 0 14px;line-height:1.15}.sec p.sub{font-size:17px;line-height:1.65;color:#4b5563;max-width:720px;margin:0}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:36px}
.pil{border:1px solid var(--bd);border-radius:16px;padding:22px;background:#fff;transition:transform .2s,box-shadow .2s,border-color .2s}
.pil:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(15,42,74,.1);border-color:#bfe3e1}
.pil .ic{width:44px;height:44px;border-radius:12px;background:#e8f5f4;color:var(--teal);display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.pil b{display:block;font-size:16px;margin-bottom:6px;color:var(--navy)}.pil span{color:var(--mut);font-size:14px;line-height:1.5}
.band{background:var(--bg)}
.course{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:center}
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mod{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:14px;transition:border-color .15s,transform .15s}
.mod:hover{border-color:var(--teal);transform:translateY(-2px)}.mod i{font-style:normal;font-weight:700;color:var(--teal);font-size:12px;width:22px}
.assess{background:linear-gradient(135deg,#0b2240,var(--navy2));color:#fff;border-radius:24px;padding:48px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;overflow:hidden;position:relative}
.assess h2{color:#fff}.assess p.sub{color:#cbd8e6}
.eq{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px}
.eq .r{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin:10px 0;font-size:13px;color:#d3deeb}
.eq .t{height:10px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}.eq .t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--teal2));animation:eqb 3.2s ease-in-out infinite alternate}
@keyframes eqb{from{width:var(--a)}to{width:var(--b)}}
.play{display:inline-flex;align-items:center;gap:12px;background:var(--teal);color:#fff;border:0;border-radius:14px;padding:16px 24px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:26px;transition:transform .15s,box-shadow .15s}
.play:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 14px 30px rgba(14,143,138,.45)}.play b{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--teal);display:grid;place-items:center;font-size:13px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-top:32px}
.tm{border:1px solid var(--bd);border-radius:16px;padding:22px;text-align:center;background:#fff;transition:transform .2s,box-shadow .2s}.tm:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(15,42,74,.1)}
.tm img,.tm .ph{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;font-size:34px;font-weight:700}
.tm b{display:block;color:var(--navy);font-size:16px}.tm .ti{color:var(--teal);font-size:13px;font-weight:600;margin:4px 0 8px}.tm p{color:var(--mut);font-size:14px;line-height:1.5;margin:0}
.join{background:var(--navy);color:#fff;text-align:center}.join h2{color:#fff}.join p.sub{color:#cbd8e6;margin:0 auto 26px}
.cmail{margin:26px 0 0;color:#cbd8e6;font-size:15px}.cmail a,.pfoot a{color:var(--teal2)}
.pfoot{margin:0;background:#0a1d36;color:#93a6bd;font-size:13px;text-align:center;padding:26px 20px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}.rv.shown{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(6,18,34,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .box{background:#fff;width:min(1180px,100%);height:min(92vh,900px);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:600}
.modal .hd button{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit}
.modal iframe{border:0;flex:1;width:100%;background:#fff}
/* ===== classroom ===== */
.rm{position:fixed;inset:0;background:#0b1626;color:#e6edf5;display:flex;flex-direction:column;z-index:20;font-size:14px}
.rm .bar1{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #1c2c44;background:#0e1c30}
.rm .bar1 b{font-size:15px}.rm .bar1 .pill{background:#13324f;color:#9fd8d4}.rm .live{display:inline-flex;align-items:center;gap:6px;color:#fca5a5;font-weight:600;font-size:12px}
.rm .live i{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:pulse 2s infinite}
.rm .body{flex:1;display:flex;min-height:0}
.rm .stage{flex:1;padding:14px;display:grid;gap:12px;min-height:0;align-content:center}
.rm .stage.spot{grid-template-columns:1fr 220px!important;grid-template-rows:1fr!important}
.rm .strip{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.tile{position:relative;background:#14243a;border-radius:14px;overflow:hidden;aspect-ratio:16/9;min-height:0;border:2px solid transparent;transition:border-color .2s}
.tile.speak{border-color:var(--teal2);box-shadow:0 0 0 3px rgba(18,179,172,.25)}
.tile video{width:100%;height:100%;object-fit:cover;display:block;background:#000}.tile.me video{transform:scaleX(-1)}.tile.scr video{object-fit:contain}
.tile .avt{position:absolute;inset:0;display:grid;place-items:center}.tile .avt span{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--navy2),var(--teal));display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff}
.tile .nm{position:absolute;left:10px;bottom:10px;background:rgba(8,16,28,.72);padding:4px 10px;border-radius:8px;font-size:13px;display:flex;gap:6px;align-items:center;max-width:80%}
.tile .hand{position:absolute;top:10px;left:10px;background:#f59e0b;color:#1f1300;border-radius:20px;padding:4px 10px;font-weight:700;font-size:13px;animation:fade .3s}
.stage.spot .tile.scr{aspect-ratio:auto;height:100%}.strip .tile{flex:none}
.rm .side2{width:320px;border-left:1px solid #1c2c44;background:#0e1c30;display:flex;flex-direction:column;min-height:0}
.rm .tabs{display:flex;border-bottom:1px solid #1c2c44}.rm .tabs button{flex:1;background:none;border:0;color:#9fb3c8;padding:12px;cursor:pointer;font-family:inherit;font-weight:600;border-bottom:2px solid transparent}
.rm .tabs button.on{color:#fff;border-color:var(--teal2)}.rm .pane{flex:1;overflow:auto;padding:12px}
.ivq .pp{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #e5e9f0}.ivq .pp .a{width:36px;height:36px;border-radius:50%;background:#0f2a4a;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}.ivq .pp .x{margin-left:auto;flex:none;display:flex;gap:6px}
.ivq .sm2{background:#eef2f7;border:0;color:#0f2a4a;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}.ivq .sm2.g{background:var(--teal);color:#fff}.ivq .sm2.r{background:#fee2e2;color:#991b1b}
.rm .wait{background:#1b2e1f;border:1px solid #2f6b3a;border-radius:10px;padding:10px;margin-bottom:12px}
.rm .pp{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #182a40}.rm .pp .a{width:32px;height:32px;border-radius:50%;background:var(--navy2);display:grid;place-items:center;font-weight:700;flex:none}
.rm .pp>div:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}.rm .pp .x{margin-left:auto;flex:none;display:flex;gap:4px}.rm .sm2{background:#1c3150;border:0;color:#dbe7f3;border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer;font-family:inherit}.rm .sm2.g{background:var(--teal)}.rm .sm2.r{background:#7f1d1d}
.rm .msg{margin-bottom:10px}.rm .msg b{color:#9fd8d4;font-size:12px}.rm .chatin{display:flex;gap:6px;padding:10px;border-top:1px solid #1c2c44}.rm .chatin input{margin:0;background:#14243a;border-color:#22385a;color:#fff}
.rm .ctl{height:76px;display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid #1c2c44;background:#0e1c30;position:relative}
.cb{width:52px;height:52px;border-radius:50%;border:0;background:#1c3150;color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center;position:relative;transition:background .15s,transform .15s}
.cb:hover{transform:translateY(-2px);background:#25416a}.cb.off{background:#b91c1c}.cb.on{background:var(--teal)}.cb.hand.on{background:#f59e0b}
.cb small{position:absolute;top:-4px;right:-4px;background:#ef4444;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:700}
.cb.leave{width:auto;border-radius:26px;padding:0 20px;background:#dc2626;font-size:14px;font-weight:700;font-family:inherit}
.cb[title]:hover::after{content:attr(title);position:absolute;bottom:62px;background:#000;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap}
.pre{flex:1;display:grid;place-items:center;padding:20px;overflow:auto}.pre .box2{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;max-width:980px;width:100%}
.pre .pv{position:relative;background:#14243a;border-radius:18px;overflow:hidden;aspect-ratio:16/9}.pre .pv video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.pre .pv .t2{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:10px}
.pre h1{color:#fff;font-size:26px}.pre p{color:#9fb3c8;line-height:1.6}.spin{width:42px;height:42px;border:4px solid #22385a;border-top-color:var(--teal2);border-radius:50%;animation:spin 1s linear infinite;margin:10px 0}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#f8fafc;color:#0f172a;padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:600;z-index:3;animation:fade .2s}
@media(max-width:860px){.rm .side2{position:absolute;right:0;top:58px;bottom:76px;width:min(340px,100%);z-index:2}.rm .side2.hide{display:none}.pre .box2{grid-template-columns:1fr}.rm .stage.spot{grid-template-columns:1fr!important;grid-template-rows:1fr 120px!important}.rm .stage.spot .strip{flex-direction:row}.strip .tile{width:160px}.cb{width:46px;height:46px}}
@media(max-width:960px){.hero .in,.course,.assess{grid-template-columns:1fr}.pillars{grid-template-columns:1fr 1fr}.nav .links{display:none}.hero h1{font-size:38px}.assess{padding:30px 22px}}

async function dupCheck(){const em=$("em"),ph=$("ph2");if(!em)return false;const email=em.value.toLowerCase().trim(),phone=ph.value.trim();

<div><h2>Interviews</h2>${ivs.length?`<div class="grid">${ivs.map(x=>roomRow(x,true)).join("")}</div>`:""}</div></div></div>

function lkSetup(){const c=(MH&&MH.classroom)||{};return `<div class="card" style="margin:16px 0"><h2>Connect the classroom (one time)</h2><p class="mut">Video runs on LiveKit, a professional video service with a free plan. 1) Create a free account at <a href="https://cloud.livekit.io" target="_blank" rel="noopener">cloud.livekit.io</a> and create a project. 2) Open Settings › API keys › Create key. 3) Paste the three values below and click Save.</p>
<div id="lke" class="err"></div><label>Project URL (starts with wss://)</label><input id="lku" value="${esc(c.url||"")}" placeholder="wss://your-project.livekit.cloud"><div class="row"><div><label>API key</label><input id="lkk" value="${esc(c.key||"")}"></div><div><label>API secret</label><input id="lks" type="password" placeholder="${c.key?"(saved – paste only to change)":""}"></div></div>
<button class="btn t" onclick="saveLk()">Save</button> <span id="lkr" class="mut"></span></div>`}
async function saveLk(){const r=await api("saveClassroomSetup",{url:$("lku").value,key:$("lkk").value,secret:$("lks").value});if(!r.ok){$("lke").textContent=r.error;return}$("lkr").textContent="Saved ✓";await loadR();await loadMH();route()}
async function mkCls(){const now=$("cnow").checked,[y,mo,da]=$("cd").value.split("-").map(Number),[hh,mm]=$("ctm").value.split(":").map(Number);
 const emails=[...document.querySelectorAll(".csc:checked")].map(x=>x.value);$("cb").disabled=true;
 const r=await api("createClass",{title:$("ct").value,now,start:now?0:Date.UTC(y,mo-1,da,hh,mm),minutes:+$("cmin").value,who:$("cwho").value,emails,notify:$("cmail").checked});
 $("cb").disabled=false;if(!r.ok){$("ce").textContent=r.error;return}
 if(r.mail&&r.mail.total)alert("Class scheduled. Emailed "+r.mail.sent+" of "+r.mail.total+" students."+(r.mail.error?" Problem: "+r.mail.error:""));
 if(now){location.hash="#/room/"+r.id;return}await loadR();route()}
async function endCls(id,remove){if(!confirm(remove?"Delete this class?":"End this class for everyone?"))return;await api("endClass",{id,remove});await loadR();route()}
function tAnnounce(){return `<h1>Announcements</h1><div class="card" style="margin-bottom:16px"><input id="at" placeholder="Title"><textarea id="ab" rows="3" placeholder="Message"></textarea><label style="font-weight:400"><input type="checkbox" id="an" checked style="width:auto;margin:0 8px 0 0">Email all students that their portal has been updated</label><br><br><button class="btn t" id="pab" onclick="postAnn()">Post announcement</button><div id="anr" class="mut" style="margin-top:10px"></div></div>
<div class="card">${S.announcements.length?S.announcements.map(a=>`<p><b>${esc(a.title)}</b> <span class="mut">${esc(a.date)}</span><br>${esc(a.body)}<br><a href="#" onclick="delAnn('${esc(a.id)}');return false">Delete</a></p>`).join(""):'<p class="mut">Nothing posted yet.</p>'}</div>`}
function tProfile(){const u=S.user;tp="";return `<h1>My Profile</h1><div class="card" style="max-width:520px"><img class="pic" id="tpv" src="${u.photo?esc(u.photo):BLANK}"><label>Profile picture</label><input type="file" accept="image/*" onchange="resize(this.files[0],d=>{tp=d;$('tpv').src=d})">
<label>Full name</label><input id="pn" value="${esc(u.name)}"><label>Title</label><input id="pt" value="${esc(u.title)}" placeholder="e.g. Lead Instructor"><label>Phone</label><input id="pp" value="${esc(u.phone)}"><label>About you</label><textarea id="pb" rows="4">${esc(u.bio)}</textarea>
<p class="mut">${esc(u.email)}${u.admin?" · Admin accounts are not shown in the public team list.":""}</p><button class="btn t" id="psb" onclick="saveProf()">Save profile</button></div>`}

function tInstr(){return `<h1>Instructors</h1><div class="card" style="max-width:640px;margin-bottom:16px"><div id="ie" class="err"></div><label>Add an instructor by email</label><input id="ie2" type="email" placeholder="name@example.com"><button class="btn t" onclick="addInstr()">Add instructor</button>
<p class="mut">When this person creates an account at moral-iq.com with this email, they become an instructor. If they already have a student account, it is converted (their student progress is removed) and their existing password keeps working. Instructors appear in the Team section of the homepage automatically once they have signed up.</p></div>
<div class="card"><h2>Instructors</h2><ul class="n">${I.map(i=>`<li style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span><b>${esc(i.name||"Not signed up yet")}</b> ${i.lead?'<span class="pill ok">Lead</span>':""}${i.admin?'<span class="pill bl">Admin</span>':""} <span class="pill ${i.claimed?"ok":"wt"}">${i.claimed?"Active":"Invited"}</span><br><span class="mut">${esc(i.email)}</span></span>${i.lead||i.admin?"":`<a href="#" onclick="rmInstr('${enc(i.email)}');return false">Remove</a>`}</li>`).join("")}</ul></div>`}
async function addInstr(){const r=await api("addInstructor",{target:$("ie2").value});if(!r.ok){$("ie").textContent=r.error;return}await loadI();route()}
async function rmInstr(e){if(!confirm("Remove this instructor? They will lose instructor access."))return;const r=await api("removeInstructor",{target:dec(e)});if(!r.ok)alert(r.error);await loadI();route()}
const ago=t=>{if(!t)return "—";const m=Math.floor((Date.now()-t)/60000);if(m<1)return "just now";if(m<60)return m+" min ago";const h=Math.floor(m/60);if(h<24)return h+" hr ago";const d=Math.floor(h/24);return d+" day"+(d>1?"s":"")+" ago"};
function playTable(L,who){return `<div class="wrap"><table><tr>${who?"<th>Who</th>":""}<th>Scene</th><th>Reading</th><th>Helped?</th><th>Access</th><th>When</th></tr>${L.map(p=>`<tr>${who?`<td>${esc(p.name||p.email)}${p.role=="participant"?` <a href="#/t/student/${enc(p.email)}">View</a>`:' <span class="mut">(instructor)</span>'}</td>`:""}<td>${esc(p.scene)}</td><td>${p.reading}%</td><td>${p.helped?'<span class="pill ok">Yes</span>':'<span class="pill wt">No</span>'}</td><td>${esc(p.access)}</td><td>${ago(p.at)}</td></tr>`).join("")}</table></div>`}
function tActivity(){const L=T.filter(s=>s.lastLogin).sort((a,b)=>b.lastLogin-a.lastLogin).slice(0,25),M=T.filter(s=>s.lastModuleAt).sort((a,b)=>b.lastModuleAt-a.lastModuleAt).slice(0,25);
const tb=(h,rows)=>rows.length?`<div class="wrap"><table><tr><th>Student</th><th>${h}</th><th></th></tr>${rows.join("")}</table></div>`:'<p class="mut">Nothing recorded yet.</p>';
const row=(s,x)=>`<tr><td>${esc(s.name)}</td><td>${x}</td><td><a href="#/t/student/${enc(s.email)}">View</a></td></tr>`;
const players=new Set(G.plays.filter(p=>p.role=="participant").map(p=>p.email)).size;
return `<h1>Activity</h1><p class="mut">Who has been active recently. A student appears here after their next sign-in, module view or game play.</p>
<div class="grid g4" style="margin-bottom:16px"><div class="card"><div class="stat">${players}</div>Participants who played Read the Room</div><div class="card"><div class="stat">${G.plays.length}</div>Game rounds played in the portal</div><div class="card"><div class="stat">${G.homePlays||0}</div>Homepage visitors who finished the preview</div></div>
<div class="card" style="margin-bottom:16px"><h2>Played the learning activity (Read the Room)</h2>${G.plays.length?playTable(G.plays.slice(0,60),true):'<p class="mut">Nobody has played in the portal yet.</p>'}</div>
<div class="grid g11"><div class="card"><h2>Recently signed in</h2>${tb("Last sign-in",L.map(s=>row(s,ago(s.lastLogin))))}</div><div class="card"><h2>Recently viewed a module</h2>${tb("Module",M.map(s=>row(s,"Module "+s.lastModule+" · "+ago(s.lastModuleAt))))}</div></div>`}
function mailCard(){if(!isA())return "";const h=MH||{};return `<div class="card" style="max-width:680px;margin-top:16px"><h2>Email status</h2>
${h.error?`<div class="ban"><b>Email is not authorised.</b> Open the Apps Script editor, choose <b>authorizeAll</b> and click Run, then allow access. Google says: ${esc(h.error)}</div>`:""}
<p>Sending from: <b>${esc(h.me||"unknown")}</b><br>Emails left today: <b>${h.quota==null?"unknown":h.quota}</b> <span class="mut">(each recipient counts; a free Gmail account allows about 100 a day, Google Workspace about 1,500)</span></p>
<div class="row"><input id="tm" type="email" placeholder="Send a test email to… (blank = you)"><button class="btn t" style="flex:none;margin:4px 0 12px" onclick="testMail()">Send test</button></div><div id="tmr" class="mut"></div>
<b>Recent email problems</b>${(h.logs||[]).length?`<ul class="n">${h.logs.map(l=>`<li><span class="mut">${esc(l.date.slice(0,16).replace("T"," "))}</span><br>${esc(l.msg)}</li>`).join("")}</ul>`:'<p class="mut">None logged.</p>'}</div>`}
async function testMail(){$("tmr").textContent="Sending…";const r=await api("testMail",{to:$("tm").value});$("tmr").textContent=r.ok?"Sent to "+r.to+". Check the inbox and the spam folder.":"Failed: "+(r.error||"unknown error")}
function tMessages(){const paid=T.filter(s=>s.pay=="Paid").length,un=T.length-paid;
return `<h1>Messages</h1><p class="mut">Email a group of students in one click.</p><div class="card" style="max-width:680px"><h2>Interview notice</h2><div id="me" class="okm"></div>
<p class="mut">Tells students to prepare for the online interview. There's no time to book: they sign in, open Classroom, press Start my interview and wait to be admitted. The interview helps us get to know them and match them with their pair.</p>
<p><b>Paid students:</b> the notice only.<br><b>Unpaid students:</b> the notice plus a reminder to pay ${FEE} before ${START_TXT}, with a Pay link.</p>
<button class="btn t" id="mp" onclick="sendInt('paid')" ${paid?"":"disabled"}>Send to paid students (${paid})</button> <button class="btn" id="mu" onclick="sendInt('unpaid')" ${un?"":"disabled"}>Send to unpaid students (${un})</button>
<label style="font-weight:400"><input type="checkbox" id="magain" style="width:auto;margin:0 8px 0 0">Send again to everyone in the group (use this if earlier emails didn't arrive)</label>
<p class="mut">Each student gets their own email. Without the tick above, pressing a button again only sends to people who haven't received it yet.</p></div>${mailCard()}`}
async function sendInt(g){if(!confirm("Send the interview notice to all "+g+" students now?"))return;const b=$(g=="paid"?"mp":"mu");b.disabled=true;$("me").textContent="Sending… please wait (about 1 second per student).";
 const r=await api("sendInterview",{group:g,again:$("magain").checked});b.disabled=false;const m=r.mail||{};
 $("me").textContent=r.ok?"Sent to "+m.sent+" students."+(r.already?" "+r.already+" had already received it.":"")+(m.skipped?" "+m.skipped+" not sent"+(m.error?" ("+m.error+")":" because the daily email limit was reached: press the button again tomorrow")+".":""):(r.error||"Failed.")}

/* ----- admin: interviews (one shared room, no set times; the admin admits or queues each participant) ----- */
let IVQ=null,IVT=0;
const ivSt={waiting:["Just arrived","wt"],queued:["Queued","wt"],admitted:["In the room","ok"]};
function ivQueueHtml(q,can,inRoom){if(!q||!q.length)return '<p class="mut">Nobody is waiting.</p>';
 return q.map((w,i)=>{const e=enc(w.email),st=ivSt[w.status]||[w.status,""],mins=Math.max(0,Math.round((Date.now()-w.at)/60000));
  return `<div class="pp"><div class="a">${initials(w.name)}</div><div style="flex:1">${esc(w.name)} <span class="pill ${st[1]}">${st[0]}</span><br><span class="mut" ${inRoom?'style="color:#9fb3c8"':""}>${esc(w.email)} · ${mins} min</span></div>
  ${can?`<div class="x">${w.status=="admitted"?`<button class="sm2 g" onclick="ivSet('${e}','done')">Done</button>`:`<button class="sm2 g" onclick="ivSet('${e}','admitted')">Admit</button>${w.status=="waiting"?`<button class="sm2" onclick="ivSet('${e}','queued')">Queue</button>`:""}`}<button class="sm2 r" onclick="ivSet('${e}','denied')" title="Remove from the line">✕</button></div>`:""}</div>`}).join("")}
async function ivSet(e,status){const email=dec(e);
 if(status=="done"&&!confirm("Mark this interview as done? They'll be taken out of the room."))return;
 if(status=="denied"&&!confirm("Remove this person from the line?"))return;
 const r=await api("admit",{id:"interview",student:email,status});if(!r.ok){alert(r.error||"Could not update.");return}
 if(RM&&RM.lk&&RM.id=="interview"){clearTimeout(RM.lpoll);pollLobby()}else ivPoll(true)}
async function ivPoll(once){clearTimeout(IVT);if(!/^#\/t\/interviews/.test(location.hash))return;const r=await api("lobby",{id:"interview"});
 if(r.ok){IVQ=r;const q=$("ivq");if(q)q.innerHTML=ivQueueHtml(r.queue,r.canAdmit,false);const c=$("ivqn");if(c)c.textContent=r.queue.filter(x=>x.status!="admitted").length}
 IVT=setTimeout(ivPoll,5000)}
async function ivToggle(open){const r=await api("setInterviewsOpen",{open});if(!r.ok){alert(r.error);return}await loadR();route()}
function tInterviews(){const rm=(R.rooms||[]).find(x=>x.kind=="interview")||{},open=!!rm.ivOpen,done=T.filter(s=>s.interview&&s.interview.done).sort((a,b)=>b.interview.done-a.interview.done);
 setTimeout(()=>ivPoll(true),0);
return `<h1>Interviews</h1><p class="mut">There are no set times. Facilitators go straight into the interview room. Each participant presses <b>Start my interview</b> and waits in the waiting room until you admit them. Press <b>Queue</b> to tell someone the panel is with another person and they'll be admitted soon. When an interview ends, press <b>Done</b>, then admit the next person.</p>
<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px"><div style="flex:1;min-width:220px"><b>Interviews are ${open?'<span style="color:#15803d">open</span>':'<span style="color:#b91c1c">closed</span>'} to participants</b><br><span class="mut">${open?"Participants see a Start my interview button in their portal.":"Participants can't start an interview until you open it."}</span></div>
<button class="btn ${open?"g":"t"}" onclick="ivToggle(${!open})">${open?"Close interviews":"Open interviews"}</button><a class="btn t" href="#/room/interview">Enter interview room</a></div>
${R.ready?"":'<div class="ban"><b>The classroom is not set up yet.</b> Connect it under Classroom first.</div>'}
<div class="grid g11" style="align-items:start"><div class="card"><h2>Waiting line (<span id="ivqn">…</span>)</h2><div id="ivq" class="ivq"><p class="mut">Loading…</p></div><p class="mut" style="margin-top:10px">Updates every few seconds. You can also admit people from the People panel inside the interview room.</p></div>
<div class="card"><h2>Interviewed (${done.length} of ${T.length})</h2>${done.length?`<div class="wrap"><table><tr><th>Participant</th><th>When</th></tr>${done.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span class="mut">${esc(s.email)}</span></td><td>${esc(new Date(s.interview.done).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}${s.interview.by?`<br><span class="mut">${esc(s.interview.by)}</span>`:""}</td></tr>`).join("")}</table></div>`:'<p class="mut">No interviews done yet.</p>'}</div></div>`}
/* ----- admin: website editor ----- */
const W=(id,label,val,rows)=>`<label>${label}</label>${rows?`<textarea id="${id}" rows="${rows}">${esc(val)}</textarea>`:`<input id="${id}" value="${esc(val)}">`}`;
function tWebsite(){const s=SITE,det=S.details||{};
return `<h1>Website</h1><p class="mut">Change what visitors see on the homepage. No code needed: edit, then click Save. <a href="#/" target="_blank">Open the homepage</a></p>
<div class="grid g11" style="align-items:start"><div class="grid">
<div class="card"><h2>Top of the page</h2>${W("w_eyebrow","Small label above the title",s.eyebrow)}${W("w_heroTitle","Main title (wrap words in &lt;em&gt;…&lt;/em&gt; to colour them teal)",s.heroTitle)}${W("w_heroText","Short description",s.heroText,3)}</div>
<div class="card"><h2>About</h2>${W("w_aboutTitle","Heading",s.aboutTitle)}${W("w_aboutText","Text",s.aboutText,5)}${(s.pillars||[]).map((p,i)=>`<div class="row"><div>${W("w_pt"+i,"Point "+(i+1),p.t)}</div><div>${W("w_pd"+i,"Detail",p.d)}</div></div>`).join("")}</div>
<div class="card"><h2>Course</h2>${W("w_courseTitle","Course name",s.courseTitle)}${W("w_courseTag","Label",s.courseTag)}${W("w_courseText","Text",s.courseText,3)}
<label>Programme start date (modules open and payment deadline)</label><input type="date" id="w_start" value="${esc(START_ISO)}"></div>
</div><div class="grid">
<div class="card"><h2>Events</h2><p class="mut">Events show on the homepage until their last day has passed. "Members-only details" are shown only to signed-in participants (for example the orientation link).</p><div id="evs">${(s.events||[]).map((e,i)=>evEdit(e,i,det[e.id]||"")).join("")}</div><button class="btn g" onclick="addEv()">+ Add event</button></div>
<div class="card"><h2>Assess your Moral IQ (game)</h2><label style="font-weight:400"><input type="checkbox" id="w_showGame" ${s.showGame?"checked":""} style="width:auto;margin:0 8px 0 0">Show the game on the homepage</label><br><br>${W("w_assessTitle","Label",s.assessTitle)}${W("w_assessSub","Heading",s.assessSub)}${W("w_assessText","Text",s.assessText,2)}</div>
<div class="card"><h2>Team and closing</h2>${W("w_teamTitle","Team heading",s.teamTitle)}${W("w_teamText","Team text",s.teamText)}${W("w_joinTitle","Closing heading",s.joinTitle)}${W("w_joinText","Closing text",s.joinText,2)}${W("w_contact","Contact emails (shown at the bottom of the homepage)",s.contact)}<p class="mut">Team members come from instructor profiles (Instructors and My Profile).</p></div>
<div class="card"><h2>Full game file</h2><p class="mut">Paid participants play the full Read the Room game from this file. Upload <b>read-the-room-full.html</b>. It stays private in your Google Drive.</p><p>Status: ${MH&&MH.gameFileAt?`<span class="pill ok">Uploaded ${esc(MH.gameFileAt.slice(0,10))}</span>`:'<span class="pill wt">Not uploaded yet</span>'}</p><input type="file" id="gfile" accept=".html,text/html"><button class="btn t" id="gfb" onclick="uploadGame()">Upload game</button> <span id="gfs" class="mut"></span></div>
</div></div><div style="position:sticky;bottom:0;background:var(--bg);padding:14px 0;margin-top:10px"><button class="btn t" id="wsb" style="padding:12px 26px" onclick="saveSite()">Save website</button> <span id="wsr" class="mut"></span></div>`}
function evEdit(e,i,det){return `<div class="ive evi" data-i="${i}"><input class="e_id" type="hidden" value="${esc(e.id)}">${W("e_t"+i,"Title",e.title)}<div class="row"><div><label>Date</label><input type="date" id="e_d${i}" value="${esc(e.date)}"></div><div><label>Second day (optional)</label><input type="date" id="e_d2${i}" value="${esc(e.date2||"")}"></div><div>${W("e_tm"+i,"Time or place",e.time)}</div></div>
${W("e_s"+i,"One-line summary",e.short)}${W("e_x"+i,"Event page text",e.text,2)}${W("e_m"+i,"Members-only details (optional)",det,2)}<a href="#" onclick="this.closest('.evi').remove();return false">Remove event</a></div>`}
function addEv(){const i=Date.now()%1e6,d=document.createElement("div");d.innerHTML=evEdit({id:"ev"+i,title:"",date:"",date2:"",time:"",short:"",text:""},i,"");$("evs").appendChild(d.firstChild)}
async function saveSite(){const v=id=>($(id)?$(id).value.trim():""),s={},details={};
 ["eyebrow","heroTitle","heroText","aboutTitle","aboutText","courseTitle","courseTag","courseText","assessTitle","assessSub","assessText","teamTitle","teamText","joinTitle","joinText","contact"].forEach(k=>s[k]=v("w_"+k));
 s.showGame=$("w_showGame").checked;s.pillars=(SITE.pillars||[]).map((p,i)=>({t:v("w_pt"+i),d:v("w_pd"+i)}));
 s.events=[...document.querySelectorAll(".evi")].map(el=>{const i=el.dataset.i,id=el.querySelector(".e_id").value;const m=v("e_m"+i);if(m)details[id]=m;
  return {id,title:v("e_t"+i),date:v("e_d"+i),date2:v("e_d2"+i),time:v("e_tm"+i),short:v("e_s"+i),text:v("e_x"+i)}}).filter(e=>e.title);
 if(s.events.some(e=>!e.date)){$("wsr").textContent="Every event needs a date.";return}
 $("wsb").disabled=true;$("wsr").textContent="Saving…";const r=await api("saveSite",{site:s,details,start:$("w_start").value});$("wsb").disabled=false;
 if(!r.ok){$("wsr").textContent=r.error;return}await load();await loadSite();$("wsr").textContent="Saved ✓ The homepage now shows your changes."}
async function uploadGame(){const f=$("gfile").files[0];if(!f){$("gfs").textContent="Choose the file first.";return}$("gfb").disabled=true;$("gfs").textContent="Uploading… (about 2 MB)";
 const data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.readAsDataURL(f)});
 const r=await api("uploadGame",{data});$("gfb").disabled=false;$("gfs").textContent=r.ok?"Uploaded ✓ Paid participants now get the full game.":(r.error||"Upload failed.");if(r.ok){GAME_HTML="";await loadMH()}}

async function setPay(e,st){const r=await api("setPay",{student:dec(e),status:st});if(!r.ok)alert(r.error);else if(st=="Paid")alert(r.mailed?"Marked as paid. A confirmation email was sent to the student.":"Marked as paid. (The confirmation email could not be sent: check Messages › Email status.)");await loadT();route()}
async function saveMod(n){const b=$("mb"+n);b.disabled=true;const r=await api("saveModule",{no:n,title:$("mt"+n).value,desc:$("md"+n).value});b.disabled=false;b.textContent=r.ok?"Saved ✓":"Failed";if(r.ok)await load();setTimeout(()=>{b.textContent="Save details"},1800)}
async function saveAct(n){const b=$("ab"+n);b.disabled=true;const emails=[...document.querySelectorAll(".sc"+n+":checked")].map(x=>x.value);
 const r=await api("setActive",{no:n,mode:$("am"+n).value,emails});b.disabled=false;b.textContent=r.ok?(r.mail&&r.mail.sent?"Saved ✓ "+r.mail.sent+" emailed":"Saved ✓"):"Failed";if(r.ok)await load();setTimeout(()=>{b.textContent="Save activation"},2500)}

async function connect(r){stopPreview();const L=window.LivekitClient,room=new L.Room({adaptiveStream:true,dynacast:true});RM.lk=room;RM.started=Date.now();

 <div class="ctl"><button class="cb" id="cmic" title="Microphone" onclick="tMic()">🎤</button><button class="cb" id="ccam" title="Camera" onclick="tCam()">📷</button><button class="cb" id="cscr" title="Share screen" onclick="tScr()">🖥️</button><button class="cb hand" id="chand" title="Raise hand" onclick="tHand()">✋</button>
 <button class="cb" id="cppl" title="People" onclick="rPanel('people')">👥<small id="bpp" style="display:none"></small></button><button class="cb" id="cchat" title="Chat" onclick="rPanel('chat')">💬<small id="bch" style="display:none"></small></button>

 if(RM.host)pollLobby();rTab(RM.tab);syncRoom()}

function syncRoom(){if(!RM||!RM.lk||!$("stage"))return;const L=window.LivekitClient,S_=L.Track.Source,st=$("stage"),ps=parts(),me=RM.lk.localParticipant;
 let scr=null;ps.forEach(p=>{const pub=p.getTrackPublication(S_.ScreenShare);if(pub&&pub.track&&!pub.isMuted&&!scr)scr={p,track:pub.track}});
 const keep=new Set();

  const v=el.querySelector("video"),pub=isScr?null:p.getTrackPublication(S_.Camera),tr=isScr?scr.track:(pub&&pub.track&&!pub.isMuted?pub.track:null);

  return el};
 const els=ps.map(p=>tile("p:"+p.identity,p,false));
 st.className="stage"+(scr?" spot":"");
 if(scr){const big=tile("scr",scr.p,true);let strip=st.querySelector(".strip");if(!strip){st.innerHTML="";strip=document.createElement("div");strip.className="strip"}st.style.gridTemplateColumns="";st.style.gridTemplateRows="";if(big.parentNode!==st)st.prepend(big);if(strip.parentNode!==st)st.appendChild(strip);els.forEach(e=>{if(e.parentNode!==strip)strip.appendChild(e)})}
 else{const n=els.length,c=n<=1?1:n<=4?2:n<=9?3:4;st.style.gridTemplateColumns=`repeat(${c},minmax(0,1fr))`;st.style.gridTemplateRows="";const strip=st.querySelector(".strip");if(strip)strip.remove();els.forEach(e=>{if(e.parentNode!==st)st.appendChild(e)})}

 const ps=parts().sort((a,b)=>{const ha=+(a.attributes&&a.attributes.hand||0),hb=+(b.attributes&&b.attributes.hand||0);return (hb?1:0)-(ha?1:0)||(ha-hb)});
